<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>NutriGenius AI - Precision 2026</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f0f4f8; color: #333; margin: 0; padding: 20px; }
        .container { max-width: 700px; margin: auto; background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        h1 { color: #27ae60; text-align: center; }
        .btn-main { width: 100%; background: #27ae60; color: white; border: none; padding: 15px; border-radius: 12px; font-size: 1.1em; cursor: pointer; margin-bottom: 10px; font-weight: bold; transition: 0.3s; }
        .btn-main:hover { background: #219150; }
        
        /* Barre de progression améliorée */
        #progress-container { display: none; margin: 20px 0; background: #eee; border-radius: 10px; height: 25px; overflow: hidden; border: 1px solid #ddd; }
        #progress-bar { width: 0%; height: 100%; background: linear-gradient(90deg, #2ecc71, #27ae60); transition: width 0.05s linear; }
        #percent-text { text-align: center; font-family: 'Courier New', monospace; font-weight: bold; color: #27ae60; font-size: 1.4em; margin-bottom: 10px; }

        .menu-box { margin-top: 20px; border: 1px solid #e0e0e0; border-radius: 15px; padding: 20px; background: #fff; }
        .meal { margin-bottom: 15px; padding-bottom: 10px; border-bottom: 1px dashed #ddd; }
        .meal strong { color: #2ecc71; text-transform: uppercase; font-size: 0.85em; }
        .shop-list { background: #f9f9f9; padding: 15px; border-radius: 10px; border-left: 5px solid #27ae60; }
    </style>
</head>
<body>

<div class="container">
    <h1>NutriGenius AI 🥗</h1>
    <p style="text-align:center;">Analyse locale haute précision</p>
    
    <button class="btn-main" onclick="lancerNutriGenius()">📍 Scanner ma position</button>
    <button class="btn-main" style="background:#3498db;" onclick="demanderVille()">🌍 Chercher une ville</button>
    
    <div id="status" style="text-align: center; margin-top: 15px; font-weight: bold; color: #555;"></div>

    <div id="percent-text"></div>
    <div id="progress-container">
        <div id="progress-bar"></div>
    </div>
    
    <div id="resultat" style="display:none;">
        <div class="menu-box">
            <h3>📅 Ton Menu du Jour</h3>
            <div id="contenu-menu"></div>
        </div>
        <div class="menu-box">
            <h3>🛒 Magasins trouvés</h3>
            <div id="liste-magasins"></div>
        </div>
    </div>
</div>

<script src="https://maps.googleapis.com/maps/api/js?key=TA_CLE_API_ICI&libraries=places"></script>

<script>
    let intervalleProgression;

    function animerBarre(cible) {
        const bar = document.getElementById('progress-bar');
        const text = document.getElementById('percent-text');
        
        clearInterval(intervalleProgression);
        
        intervalleProgression = setInterval(() => {
            let actuel = parseFloat(bar.style.width) || 0;
            
            if (actuel < cible) {
                actuel += 0.1; 
            } else if (actuel >= 99.9 && cible < 100) {
                // Si on arrive au bout mais que Google n'a pas répondu, on stoppe à 99.9
                clearInterval(intervalleProgression);
            } else if (cible === 100 && actuel < 100) {
                actuel += 0.5; // Accélération finale
            }

            if (actuel > 100) actuel = 100;
            
            bar.style.width = actuel + "%";
            text.innerText = actuel.toFixed(1) + "%";
            
            if (actuel >= 100) clearInterval(intervalleProgression);
        }, 30); 
    }

    function lancerNutriGenius() {
        resetUI();
        if (navigator.geolocation) {
            document.getElementById('status').innerText = "📡 Connexion satellite...";
            animerBarre(30.0);
            navigator.geolocation.getCurrentPosition(
                (pos) => lancerRecherche(pos.coords.latitude, pos.coords.longitude),
                () => { document.getElementById('status').innerText = "❌ GPS refusé."; }
            );
        }
    }

    function demanderVille() {
        const ville = prompt("Dans quelle ville êtes-vous ?");
        if (ville) {
            resetUI();
            animerBarre(45.0);
            const geocoder = new google.maps.Geocoder();
            geocoder.geocode({ address: ville }, (results, status) => {
                if (status === "OK") {
                    const loc = results[0].geometry.location;
                    lancerRecherche(loc.lat(), loc.lng());
                }
            });
        }
    }

    function lancerRecherche(lat, lng) {
        document.getElementById('status').innerText = "🔬 Analyse des données de quartier...";
        animerBarre(95.0);

        const service = new google.maps.places.PlacesService(document.createElement('div'));
        service.nearbySearch({
            location: { lat, lng },
            radius: 1500,
            type: ['supermarket']
        }, (results, statusAPI) => {
            if (statusAPI === google.maps.places.PlacesServiceStatus.OK) {
                animerBarre(100.0);
                setTimeout(() => {
                    afficherResultats(results);
                }, 600);
            } else {
                document.getElementById('status').innerText = "⚠️ Aucun magasin trouvé ici.";
                clearInterval(intervalleProgression);
            }
        });
    }

    function afficherResultats(results) {
        document.getElementById('status').innerText = "✅ Analyse terminée !";
        document.getElementById('resultat').style.display = "block";
        document.getElementById('liste-magasins').innerHTML = results.slice(0, 3).map(p => `📍 <strong>${p.name}</strong> (${p.vicinity})`).join('<br><br>');
        
        document.getElementById('contenu-menu').innerHTML = `
            <div class="meal"><strong>Matin :</strong> Bowl Açaï et graines de chia</div>
            <div class="meal"><strong>Midi :</strong> Poulet aux herbes et riz complet</div>
            <div class="meal"><strong>Soir :</strong> Soupe de légumes de saison</div>
            <div class="shop-list">📝 <strong>Liste de courses :</strong> Prête pour ${results[0].name}</div>
        `;
    }

    function resetUI() {
        document.getElementById('resultat').style.display = "none";
        document.getElementById('progress-container').style.display = "block";
        document.getElementById('progress-bar').style.width = "0%";
        document.getElementById('percent-text').innerText = "0.0%";
        document.getElementById('status').innerText = "";
    }
</script>

</body>
</html>
