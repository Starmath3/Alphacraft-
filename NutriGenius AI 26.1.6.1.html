function toggleDark() { document.body.classList.toggle('dark-mode'); }

    function changerLangue() {
        currentLang = document.getElementById('lang-picker').value;
        const t = translations[currentLang] || translations['en'];
        
        // Mise à jour de l'interface utilisateur
        document.getElementById('age').placeholder = t.age;
        document.getElementById('poids').placeholder = t.poids;
        document.getElementById('taille').placeholder = t.taille;
        document.getElementById('btn-gen').innerText = t.gen;
        document.getElementById('lbl-veg').innerText = t.veg;
        document.getElementById('loader-text').innerText = t.loader;
        document.getElementById('opt-h').innerText = t.male;
        document.getElementById('opt-f').innerText = t.female;
        document.getElementById('dur-1').innerText = t.menu1;
        document.getElementById('dur-7').innerText = t.menu7;

        // Si un planning existe déjà, on le rafraîchit pour changer sa langue
        if (planningGlobal.length > 0) afficherMenu();
    }

    function lancer() {
        if (!document.getElementById('age').value) {
            const msg = currentLang === 'fr' ? "Veuillez entrer votre Age !" : "Please enter your Age!";
            return alert(msg);
        }
        document.getElementById('loader-overlay').style.display = "flex";
        setTimeout(() => { 
            genererPlanning(); 
            document.getElementById('loader-overlay').style.display = "none";
        }, 1200);
    }

    function genererPlanning() {
        const jours = parseInt(document.getElementById('select-duree').value);
        const isVeg = document.getElementById('check-veg').checked;
        const poolP = isVeg ? db.petitDej.filter(x => x.v) : db.petitDej;
        const poolM = isVeg ? db.dejeuner.filter(x => x.v) : db.dejeuner;
        const poolD = isVeg ? db.diner.filter(x => x.v) : db.diner;

        planningGlobal = [];
        for (let i = 0; i < jours; i++) {
            planningGlobal.push({
                p: JSON.parse(JSON.stringify(poolP[Math.floor(Math.random() * poolP.length)])),
                m: JSON.parse(JSON.stringify(poolM[Math.floor(Math.random() * poolM.length)])),
                d: JSON.parse(JSON.stringify(poolD[Math.floor(Math.random() * poolD.length)])),
                vP: 0, vM: 0, vD: 0
            });
        }
        afficherMenu();
    }

    function remplacerRepas(jIdx, type) {
        const isVeg = document.getElementById('check-veg').checked;
        const categorie = type === 'p' ? db.petitDej : (type === 'm' ? db.dejeuner : db.diner);
        const pool = isVeg ? categorie.filter(x => x.v) : categorie;
        if (pool.length <= 1) return;
        let nouveauPlat;
        do { nouveauPlat = pool[Math.floor(Math.random() * pool.length)]; } 
        while (nouveauPlat.n.fr === planningGlobal[jIdx][type].n.fr);
        
        planningGlobal[jIdx][type] = JSON.parse(JSON.stringify(nouveauPlat));
        planningGlobal[jIdx]['v' + type.toUpperCase()] = 0; 
        afficherMenu();
    }

    function changerVariante(jIdx, type) {
        let key = 'v' + type.toUpperCase();
        let plat = planningGlobal[jIdx][type];
        planningGlobal[jIdx][key] = (planningGlobal[jIdx][key] + 1) % plat.variantes.length;
        afficherMenu();
    }

    function toggleDetails(id) {
        const el = document.getElementById(id);
        el.style.display = (el.style.display === 'block') ? 'none' : 'block';
    }

    function afficherMenu() {
        const t = translations[currentLang] || translations['en'];
        let html = "";
        planningGlobal.forEach((jour, idx) => {
            if (idx % 7 === 0) {
                let listIng = new Set();
                let fin = Math.min(idx + 7, planningGlobal.length);
                for(let k=idx; k<fin; k++) {
                    [planningGlobal[k].p, planningGlobal[k].m, planningGlobal[k].d].forEach(r => {
                        (r.i[currentLang] || r.i['fr']).forEach(ing => listIng.add(ing));
                    });
                }
                html += `<div class="shopping-list"><b>🛒 ${t.shopping} (${t.menu7} ${Math.floor(idx/7)+1})</b><br>${Array.from(listIng).map(n => `<span class="shopping-item">${n}</span>`).join('')}</div>`;
            }
            html += `
            <div class="day-box">
                <span class="cal-float">${jour.p.c + jour.m.c + jour.d.c} kcal</span>
                <h3>${t.day} ${idx + 1}</h3>
                ${renderMeal(idx, 'p', '☀️', jour.p, jour.vP)}
                ${renderMeal(idx, 'm', '🥗', jour.m, jour.vM)}
                ${renderMeal(idx, 'd', '🌙', jour.d, jour.vD)}
            </div>`;
        });
        document.getElementById('content-area').innerHTML = html;
    }

    function renderMeal(jIdx, type, label, meal, vIdx) {
        const t = translations[currentLang] || translations['en'];
        const id = `det-${jIdx}-${type}`;
        const v = meal.variantes[vIdx];
        const lang = currentLang;

        return `
        <div class="meal-section">
            <b>${label} :</b> ${meal.n[lang] || meal.n['fr']} <small>(${v.t[lang] || v.t['fr']})</small><br>
            <span class="ing-label">🛒 : ${(meal.i[lang] || meal.i['fr']).join(', ')}</span>
            <div class="no-print">
                <button class="btn-sm btn-replace" onclick="remplacerRepas(${jIdx}, '${type}')">🔄 ${t.change}</button>
                <button class="btn-sm btn-variant" onclick="changerVariante(${jIdx}, '${type}')">✨ ${t.variant}</button>
                <button class="btn-sm btn-recipe" onclick="toggleDetails('${id}')">📖 ${t.recipe}</button>
            </div>
            <div id="${id}" class="details-content">
                <b>${t.steps}</b><br>
                ${(v.r[lang] || v.r['fr']).map((step, i) => `<b>${i+1}.</b> ${step}`).join('<br>')}
                <div class="macro-box">
                    📊 <b>${v.ntr[lang] || v.ntr['fr']}</b>
                </div>
                <br>
                <small>💡 <b>${t.tip} :</b> ${v.tip[lang] || v.tip['fr']}</small>
            </div>
        </div>`;
    }

    function sauvegarderProfil() {
        const p = { age: document.getElementById('age').value, poids: document.getElementById('poids').value, taille: document.getElementById('taille').value, sexe: document.getElementById('sexe').value, veg: document.getElementById('check-veg').checked };
        localStorage.setItem('NutriGenius_V10_GLOBAL', JSON.stringify(p));
    }

    function chargerProfil() {
        const s = localStorage.getItem('NutriGenius_V10_GLOBAL');
        if (s) {
            const d = JSON.parse(s);
            document.getElementById('age').value = d.age || "";
            document.getElementById('poids').value = d.poids || "";
            document.getElementById('taille').value = d.taille || "";
            document.getElementById('sexe').value = d.sexe || "H";
            document.getElementById('check-veg').checked = d.veg || false;
        }
        changerLangue(); // Initialise la langue par défaut au chargement
    }
</script>
