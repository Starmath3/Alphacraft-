        document.getElementById('opt-f').innerText = t.female;
        document.getElementById('dur-1').innerText = t.menu1;
        document.getElementById('dur-7').innerText = t.menu7;
        document.getElementById('dur-30').innerText = t.menu30;
        document.getElementById('dur-365').innerText = t.menu365;

        if (planningGlobal.length > 0) afficherMenu();
    }

    function lancer() {
        if (!document.getElementById('age').value) {
            const msg = (currentLang === 'fr') ? "Veuillez entrer votre Âge !" : "Please enter your Age!";
            return alert(msg);
        }
        // Affichage du loader "Loading..." universel
        document.getElementById('loader-overlay').style.display = "flex";
        
        // Simulation de calcul IA (plus long pour les plans annuels)
        const delai = planningGlobal.length > 30 ? 2500 : 1200;
        
        setTimeout(() => { 
            genererPlanning(); 
            document.getElementById('loader-overlay').style.display = "none";
        }, delai);
    }

    function genererPlanning() {
        const jours = parseInt(document.getElementById('select-duree').value);
        const isVeg = document.getElementById('check-veg').checked;
        
        const poolP = isVeg ? db.petitDej.filter(x => x.v) : db.petitDej;
        const poolM = isVeg ? db.dejeuner.filter(x => x.v) : db.dejeuner;
        const poolD = isVeg ? db.diner.filter(x => x.v) : db.diner;

        planningGlobal = [];
        for (let i = 0; i < jours; i++) {
            planningGlobal.push({
                p: JSON.parse(JSON.stringify(poolP[Math.floor(Math.random() * poolP.length)])),
                m: JSON.parse(JSON.stringify(poolM[Math.floor(Math.random() * poolM.length)])),
                d: JSON.parse(JSON.stringify(poolD[Math.floor(Math.random() * poolD.length)])),
                vP: Math.floor(Math.random() * 5), // Sélection aléatoire parmi les 5 variantes
                vM: Math.floor(Math.random() * 5),
                vD: Math.floor(Math.random() * 5)
            });
        }
        afficherMenu();
    }

    function remplacerRepas(jIdx, type) {
        const isVeg = document.getElementById('check-veg').checked;
        const cat = type === 'p' ? db.petitDej : (type === 'm' ? db.dejeuner : db.diner);
        const pool = isVeg ? cat.filter(x => x.v) : cat;
        
        let nouveau;
        do { nouveau = pool[Math.floor(Math.random() * pool.length)]; } 
        while (nouveau.n.fr === planningGlobal[jIdx][type].n.fr);
        
        planningGlobal[jIdx][type] = JSON.parse(JSON.stringify(nouveau));
        planningGlobal[jIdx]['v' + type.toUpperCase()] = 0; 
        afficherMenu();
    }

    function changerVariante(jIdx, type) {
        let key = 'v' + type.toUpperCase();
        let nbVar = planningGlobal[jIdx][type].variantes.length;
        planningGlobal[jIdx][key] = (planningGlobal[jIdx][key] + 1) % nbVar;
        afficherMenu();
    }

            // Liste de courses tous les 7 jours
            if (idx % 7 === 0) {
                let listIng = new Set();
                let fin = Math.min(idx + 7, planningGlobal.length);
                for(let k=idx; k<fin; k++) {
                    [planningGlobal[k].p, planningGlobal[k].m, planningGlobal[k].d].forEach(r => {
                        let ingLang = r.i[currentLang] || r.i['fr'] || r.i['en'];
                        ingLang.forEach(ing => listIng.add(ing));
                    });
                }
                html += `<div class="shopping-list"><h3>${t.shopping}</h3>${Array.from(listIng).map(n => `<span class="shopping-item">${n}</span>`).join('')}</div>`;
            }

            html += `
            <div class="day-box">
                <div class="cal-float">${jour.p.c + jour.m.c + jour.d.c} kcal</div>
                <h2 style="color:var(--primary)">✨ ${t.day} ${idx + 1}</h2>
                ${renderMeal(idx, 'p', '☀️ PETIT-DÉJEUNER', jour.p, jour.vP)}
                ${renderMeal(idx, 'm', '🍴 DÉJEUNER', jour.m, jour.vM)}
                ${renderMeal(idx, 'd', '🌙 DÎNER', jour.d, jour.vD)}
            </div>`;
        });
        document.getElementById('content-area').innerHTML = html;
    }

    function renderMeal(jIdx, type, label, meal, vIdx) {
        const t = translations[currentLang] || translations['en'];
        const id = `det-${jIdx}-${type}`;
        const lang = currentLang;
        
        // Sécurité si la variante n'existe pas (cas de base de données asymétrique)
        const v = meal.variantes[vIdx] || meal.variantes[0];

        return `
        <div class="meal-card">
            <b style="font-size:1.1em;">${label} :</b> <span style="font-size:1.1em;">${meal.n[lang] || meal.n['fr']}</span><br>
            <i style="color:var(--primary)">🛒 ${(meal.i[lang] || meal.i['fr']).join(', ')}</i>
            <div class="no-print" style="margin-top:10px;">
                <button class="btn-sm btn-replace" onclick="remplacerRepas(${jIdx}, '${type}')">${t.change}</button>
                <button class="btn-sm btn-variant" onclick="changerVariante(${jIdx}, '${type}')">${t.variant} (${vIdx + 1}/5)</button>
                <button class="btn-sm btn-recipe" onclick="toggleDetails('${id}')">${t.recipe}</button>
            </div>
            <div id="${id}" class="details-content">
                <h4 style="margin-top:0;">✨ ${v.t[lang] || v.t['fr']}</h4>
                <b>${t.steps}</b><br>
                ${(v.r[lang] || v.r['fr']).map((s, i) => `<b>${i+1}.</b> ${s}`).join('<br>')}
                <div class="macro-box">
                    <b>${t.macroTitle}</b><br>${v.ntr[lang] || v.ntr['fr']}
                </div>
                <div style="color:var(--accent); font-weight:bold;">${t.tip} : ${v.tip[lang] || v.tip['fr']}</div>
            </div>
        </div>`;
    }

    function sauvegarderProfil() {
        const p = { 
            age: document.getElementById('age').value, 
            poids: document.getElementById('poids').value, 
            taille: document.getElementById('taille').value, 
            sexe: document.getElementById('sexe').value, 
            veg: document.getElementById('check-veg').checked 
        };
        localStorage.setItem('NutriGenius_V26_1_6_2_Final', JSON.stringify(p));
    }

    function chargerProfil() {
        const s = localStorage.getItem('NutriGenius_V26_1_6_2_Final');
        if (s) {
            const d = JSON.parse(s);
            document.getElementById('age').value = d.age || "";
            document.getElementById('poids').value = d.poids || "";
            document.getElementById('taille').value = d.taille || "";
            document.getElementById('sexe').value = d.sexe || "H";
            document.getElementById('check-veg').checked = d.veg || false;
        }
        changerLangue();
    }
</script>
</body>
