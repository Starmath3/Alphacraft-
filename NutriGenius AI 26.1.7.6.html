        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); text-align: center; padding: 20px; transition: 0.3s; margin: 0; }

        .modes-title { font-weight: bold; margin-top: 20px; color: var(--primary); }

        .mode-item input { width: 18px; height: 18px; cursor: pointer; }

        button:hover { filter: brightness(1.1); transform: translateY(-2px); }

        .tip-box { font-style: italic; background: #fff3cd; color: #856404; padding: 15px; border-radius: 10px; border-left: 5px solid #ffeeba; margin-top: 10px; }
        .error-msg { background: #f8d7da; color: #721c24; padding: 20px; border-radius: 15px; font-weight: bold; margin-top: 20px; }

function genererMenu() {
    const age = parseInt(document.getElementById('age').value);
    const res = document.getElementById('resultat');
    // ON RÉCUPÈRE LA DURÉE (Semaine, Mois...)
    const duree = parseInt(document.getElementById('duree-programme').value) || 1;
    const selectedModes = Array.from(document.querySelectorAll('.filter-mode:checked')).map(cb => cb.value);
    
    if (!age) { alert("Veuillez entrer votre âge !"); return; }

    // On affiche le loader (si tu as l'élément dans ton HTML)
    const loader = document.getElementById('loader-overlay');
    if(loader) loader.style.display = 'flex';

    setTimeout(() => {
        // --- PALIER 1 : Nourrissons ---
        if (age >= 1 && age <= 2) {
            res.innerHTML = `<div class="error-msg">👶 À 1 ou 2 ans, l'alimentation est gérée par le pédiatre.</div>`;
            if(loader) loader.style.display = 'none';
            return;
        }

        let htmlGlobal = "";
        const moments = ['matin', 'midi', 'soir'];

        // --- LA BOUCLE DE DURÉE (Semaine, Mois, An) ---
        for (let jour = 1; jour <= duree; jour++) {
            let htmlJour = "";
            
            // On ajoute le titre du jour si plus de 1 jour sélectionné
            if (duree > 1) {
                htmlJour += `<h2 style="width:100%; text-align:center; color:var(--primary); margin-top:40px; border-top: 2px solid #ccc; padding-top:20px;">JOUR ${jour}</h2>`;
            }

// --- PALIER 2 : Enfants (3 à 6 ans) ---
if (age >= 3 && age <= 6) {
    moments.forEach(m => {
        // On filtre par moment ET par âge minimum
        let options = db_kids.filter(r => r.cat === m && age >= r.ageMin);
        
        if (options.length > 0) {
            const choice = options[Math.floor(Math.random() * options.length)];
            
            // --- CORRECTION DYNAMIQUE DU CONSEIL ---
            let conseilAdapte = choice.tip;
            if (age >= 4 && conseilAdapte.toLowerCase().includes("lait de croissance")) {
                conseilAdapte = "Privilégiez des portions adaptées à son activité et encouragez l'autonomie à table.";
            }
            if (age >= 5 && conseilAdapte.toLowerCase().includes("purée")) {
                conseilAdapte = "L'enfant peut maintenant manger presque comme un adulte, mais en quantités réduites.";
            }

            // On crée une copie de l'objet pour ne pas modifier la DB originale
            const choiceAdapte = { ...choice, tip: conseilAdapte };
            
            htmlJour += buildCardHTML(m, choiceAdapte, true, age, options);
        }
    });
}
            // --- PALIER 3 : Adultes (7 ans et plus) ---
            else {
                let possible = true;
                moments.forEach(m => {
                    let options = [];
                    db.forEach(recette => {
                        if(recette.cat === m) {
                            recette.variantes.forEach(v => {
                                const match = selectedModes.every(mode => v.m.includes(mode));
                                if(match) options.push({ nomRecette: recette.n, ...v });
                            });
                        }
                    });

                    if (options.length > 0) {
                        const choice = options[Math.floor(Math.random() * options.length)];
                        const optionsJSON = JSON.stringify(options).replace(/"/g, '&quot;');
                        htmlJour += buildCardHTML(m, choice, false, age, optionsJSON);
                    } else { possible = false; }
                });

                if (!possible && jour === 1) {
                    htmlGlobal = `<div class="error-msg">❌ Aucun repas trouvé pour vos filtres (${selectedModes.join(', ')}).</div>`;
                    break;
                }
            }
            htmlGlobal += htmlJour;
        }

        res.innerHTML = htmlGlobal;
        if(loader) loader.style.display = 'none';
        sauvegarderProfil(); 
    }, 500);
}

// Fonction utilitaire pour construire le HTML d'une carte (pour éviter les erreurs d'ID en double)
function buildCardHTML(moment, choice, isKid, age, optionsJSON) {
    const border = isKid ? 'style="border-left: 8px solid #ffcb05;"' : '';
    const badgeColor = isKid ? '#ffcb05' : 'var(--accent)';
    const title = isKid ? choice.n : choice.nomRecette;

    return `
        <div class="recipe-card" ${border}>
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
                <div style="background:${badgeColor}; color:white; padding:4px 10px; border-radius:4px; font-size:12px; font-weight:bold;">${moment.toUpperCase()}</div>
                <button class="change-btn" onclick="changerVar(null, ${optionsJSON}, this)" style="width:auto; margin:0; padding:5px 10px; font-size:11px; background:var(--text); color:white; border:none; border-radius:5px; cursor:pointer;">🔄 AUTRES VARIANTES</button>
            </div>
            <h3 class="card-title">${title}</h3>
            ${!isKid ? `<p><strong>Variante :</strong> <span class="card-vt">${choice.t}</span></p>` : ''}
            <div class="card-steps">${choice.r.map(s => `<p>• ${s}</p>`).join('')}</div>
            ${choice.ntr ? `<div class="ntr-box">📊 ${choice.ntr}</div>` : ''}
            <div class="tip-box">💡 ${choice.tip}</div>
        </div>`;
}

    function sauvegarderProfil() {
        const modes = Array.from(document.querySelectorAll('.filter-mode:checked')).map(cb => cb.value);
        const p = { 
            age: document.getElementById('age').value, 
            poids: document.getElementById('poids').value, 
            taille: document.getElementById('taille').value, 
            sexe: document.getElementById('sexe').value,
            modes: modes
        };
        localStorage.setItem('NutriGenius_Premium_Save', JSON.stringify(p));
    }

    window.onload = () => {
        const s = localStorage.getItem('NutriGenius_Premium_Save');
        if (s) {
            const d = JSON.parse(s);
            document.getElementById('age').value = d.age || "";
            document.getElementById('poids').value = d.poids || "";
            document.getElementById('taille').value = d.taille || "";
            document.getElementById('sexe').value = d.sexe || "H";
            if(d.modes) {
                document.querySelectorAll('.filter-mode').forEach(cb => {
                    if(d.modes.includes(cb.value)) cb.checked = true;
                });
            }
        }
    };

    function enregistrerSurPC() {
        const text = document.getElementById('resultat').innerText;
        if (!text) return;
        const blob = new Blob([text], { type: 'text/plain' });
        const a = document.createElement('a');
        a.download = "Mon_Menu_NutriGenius.txt";
        a.href = window.URL.createObjectURL(blob);
        a.click();
    }

    function changerVar(idIgnored, listeOptions, btn) {
        // 1. On choisit une nouvelle variante au hasard
        const v = listeOptions[Math.floor(Math.random() * listeOptions.length)];
    
        // 2. On trouve la carte parente du bouton sur lequel on a cliqué
        const card = btn.closest('.recipe-card');
    
        // 3. On met à jour les éléments à l'intérieur de CETTE carte précise
        // Mise à jour du Titre
        const titleElem = card.querySelector('.card-title');
        if (titleElem) titleElem.innerText = v.nomRecette || v.n;

        // Mise à jour de la Variante (si adulte)
        const vtElem = card.querySelector('.card-vt');
        if (vtElem) vtElem.innerText = v.t || "";

        // Mise à jour des Étapes
        const stepsElem = card.querySelector('.card-steps');
        if (stepsElem) {
        stepsElem.innerHTML = v.r.map(s => `<p>• ${s}</p>`).join('');
        }

        // Mise à jour de la Nutrition
        const ntrElem = card.querySelector('.ntr-box');
        if (ntrElem) {
            ntrElem.innerText = v.ntr ? "📊 " + v.ntr : "";
        }

        // Mise à jour du conseil
        const tipElem = card.querySelector('.tip-box');
        if (tipElem) {
            tipElem.innerText = "💡 " + v.tip;
        }
    }

</script>
