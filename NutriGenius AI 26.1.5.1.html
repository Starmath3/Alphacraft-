<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NutriGenius AI 26.1.5.1 - Halal Master Edition</title>
    <style>
        :root { --bg: #f0f4f8; --card: white; --text: #2c3e50; --primary: #009245; --accent: #e67e22; }
        .dark-mode { --bg: #1a1a1a; --card: #2d2d2d; --text: #f0f4f8; --primary: #27ae60; --accent: #d35400; }
        
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); text-align: center; padding: 20px; transition: 0.3s; }
        .container { background: var(--card); padding: 25px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); display: inline-block; width: 100%; max-width: 750px; text-align: left; }
        
        .header-ui { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .dark-toggle { cursor: pointer; background: var(--primary); color: white; padding: 8px 15px; border-radius: 20px; font-size: 0.8em; font-weight: bold; }
        
        h1 { margin: 0; color: var(--primary); }
        .subtitle { font-weight: bold; font-size: 0.85em; text-transform: uppercase; margin-bottom: 20px; display: block; color: #7f8c8d; }
        
        .input-group { margin-bottom: 15px; background: rgba(0,0,0,0.03); padding: 15px; border-radius: 12px; }
        .row { display: flex; gap: 10px; margin-bottom: 10px; }
        .input-field, .select-box { width: 100%; padding: 12px; border-radius: 10px; border: 2px solid #e0e0e0; background: var(--card); color: var(--text); }
        
        .btn { width: 100%; padding: 15px; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; color: white; background: var(--primary); font-size: 1.1em; transition: 0.2s; margin-top: 10px; }
        .btn:hover { filter: brightness(1.1); transform: translateY(-2px); }
        
        .btn-sm { width: auto; padding: 8px 12px; font-size: 0.75em; margin: 4px 2px; border: none; border-radius: 8px; cursor: pointer; color: white; font-weight: bold; transition: 0.2s; }
        .btn-replace { background: var(--accent); }
        .btn-recipe { background: #3498db; }
        .btn-variant { background: #8e44ad; }

        #loader { display: none; margin: 20px 0; font-weight: bold; color: var(--primary); font-size: 1.2em; }
        
        .day-box { background: var(--card); padding: 20px; margin-bottom: 20px; border-radius: 15px; border-left: 10px solid var(--primary); box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        .meal-section { margin-top: 15px; padding-top: 10px; border-top: 1px dashed rgba(127, 140, 141, 0.3); }
        .details-content { display: none; font-size: 0.9em; margin-top: 10px; background: rgba(0,0,0,0.04); padding: 15px; border-radius: 10px; line-height: 1.5; }
        
        .shopping-list { background: #e8f5e9; border: 2px dashed var(--primary); padding: 15px; border-radius: 12px; margin: 25px 0; color: #1b5e20; }
        .shopping-item { display: inline-block; background: white; padding: 5px 12px; margin: 4px; border-radius: 20px; font-size: 0.8em; font-weight: bold; border: 1px solid #c3e6cb; }

        .badge-ntr { background: #2c3e50; color: white; padding: 2px 8px; border-radius: 5px; font-size: 0.8em; margin-right: 5px; }
        .cal-float { float: right; background: var(--primary); color: white; padding: 4px 12px; border-radius: 10px; font-size: 0.9em; font-weight: bold; }

        @media print { .no-print, .btn-sm { display: none !important; } .details-content { display: block !important; } }
    </style>
</head>
<body onload="chargerProfil()">

<div class="container">
    <div class="header-ui">
        <h1>NutriGenius AI 🥗</h1>
        <div class="dark-toggle no-print" onclick="toggleDark()">🌓 Mode Sombre</div>
    </div>
    <span class="subtitle">v26.1.5.1 - Recettes Halal Certifiées & Planning Intelligent</span>

    <div class="no-print">
        <div class="input-group">
            <span style="font-size: 0.8em; font-weight: bold; color: #7f8c8d;">MON PROFIL</span>
            <div class="row">
                <input type="number" id="age" class="input-field" placeholder="Age" oninput="sauvegarderProfil()">
                <select id="sexe" class="input-field" onchange="sauvegarderProfil()">
                    <option value="H">Homme</option>
                    <option value="F">Femme</option>
                </select>
            </div>
            <div class="row">
                <input type="number" id="poids" class="input-field" placeholder="Poids (kg)" oninput="sauvegarderProfil()">
                <input type="number" id="taille" class="input-field" placeholder="Taille (cm)" oninput="sauvegarderProfil()">
            </div>
        </div>
        <select id="select-duree" class="select-box">
            <option value="1">🥗 Menu du Jour</option>
            <option value="7">📅 Menu de la Semaine</option>
            <option value="30">📊 Menu du Mois</option>
        </select>
        <button class="btn" onclick="lancer()">GÉNÉRER MON MENU</button>
    </div>

    <div id="loader">Loading...</div>
    <div id="resultat">
        <div id="content-area"></div>
    </div>
</div>

<script>
    // --- BASE DE DONNÉES HALAL & RECEPTES ---
    // Note: Chaque plat contient maintenant un tableau de 5 variantes de recettes
    const db = {
        petitDej: [
            { 
                n: "Bowl Skyr & Miel 🍯", c: 320, 
                variantes: [
                    { r: ["150g Skyr", "1 c.à.s Miel de forêt", "10g Amandes"], ntr: "P: 22g | G: 30g | L: 8g", tip: "Le skyr est très riche en protéines pour la satiété." },
                    { r: ["150g Skyr", "Miel", "Graines de Chia", "Baies"], ntr: "P: 20g | G: 35g | L: 9g", tip: "Les graines de chia apportent des Oméga-3." },
                    { r: ["Skyr", "Miel", "Flocons d'avoine", "Noix"], ntr: "P: 24g | G: 40g | L: 12g", tip: "Idéal avant une séance de sport." },
                    { r: ["Skyr", "Miel", "Banane écrasée"], ntr: "P: 21g | G: 45g | L: 7g", tip: "La banane apporte du potassium naturel." },
                    { r: ["Skyr", "Sirop d'érable (Halal)", "Amandes effilées"], ntr: "P: 20g | G: 32g | L: 9g", tip: "Le sirop d'érable a un index glycémique plus bas que le sucre." }
                ],
                i: ["Skyr", "Miel", "Amandes"]
            },
            { 
                n: "Omelette Créole 🍳", c: 360, 
                variantes: [
                    { r: ["2 Oeufs", "Oignons verts ciselés", "Pincée de sel/poivre"], ntr: "P: 18g | G: 4g | L: 20g", tip: "Cuisinez avec un filet d'huile d'olive." },
                    { r: ["2 Oeufs", "Tomates concassées", "Thym frais"], ntr: "P: 18g | G: 6g | L: 19g", tip: "La tomate rend l'omelette plus juteuse." },
                    { r: ["3 Blancs d'oeufs", "1 Jaune", "Curcuma", "Ail"], ntr: "P: 20g | G: 3g | L: 12g", tip: "Version allégée en lipides." },
                    { r: ["2 Oeufs", "Fromage râpé", "Oignon rouge"], ntr: "P: 22g | G: 5g | L: 25g", tip: "Plus gourmand et riche en calcium." },
                    { r: ["2 Oeufs", "Brèdes sautées", "Gingembre"], ntr: "P: 19g | G: 7g | L: 19g", tip: "Apport massif en fer grâce aux brèdes." }
                ],
                i: ["Oeufs certifiés", "Oignons vert", "Ail", "Gingembre"]
            }
        ],
        dejeuner: [
            { 
                n: "Carry Poulet Halal 🍗", c: 580, 
                variantes: [
                    { r: ["Poulet certifié Halal", "Tomates", "Oignons", "Curcuma", "Thym"], ntr: "P: 45g | G: 35g | L: 18g", tip: "Faites bien roussir le poulet sans brûler les épices." },
                    { r: ["Poulet", "Curry Madras", "Lait de coco", "Coriandre"], ntr: "P: 42g | G: 38g | L: 25g", tip: "Le lait de coco adoucit le piment." },
                    { r: ["Poulet grillé", "Salade de grains", "Riz blanc"], ntr: "P: 48g | G: 50g | L: 12g", tip: "Plus riche en glucides complexes." },
                    { r: ["Poulet sauté", "Poivrons", "Sauce Soja Halal", "Gingembre"], ntr: "P: 44g | G: 30g | L: 15g", tip: "Style Shop Suey, très rapide à cuire." },
                    { r: ["Poulet", "Combava", "Tomates cerises", "Thym"], ntr: "P: 45g | G: 32g | L: 16g", tip: "Le combava donne une note citronnée unique." }
                ],
                i: ["Poulet Halal", "Tomates", "Curcuma", "Oignons", "Ail"]
            },
            { 
                n: "Rougail Morue 🐟", c: 520, 
                variantes: [
                    { r: ["Morue dessalée", "Oignons", "Tomates", "Piment"], ntr: "P: 38g | G: 32g | L: 14g", tip: "Changez l'eau du dessalage 3 fois." },
                    { r: ["Morue grillée au feu de bois", "Gros piments"], ntr: "P: 40g | G: 28g | L: 16g", tip: "Le goût fumé est exceptionnel." },
                    { r: ["Morue", "Gingembre", "Ail", "Oignons frits"], ntr: "P: 37g | G: 30g | L: 18g", tip: "Ajoutez les oignons à la fin pour le croquant." },
                    { r: ["Morue", "Vinaigrette citronnée", "Oignons crus", "Persil"], ntr: "P: 35g | G: 25g | L: 12g", tip: "Version froide en salade, très rafraîchissante." },
                    { r: ["Morue", "Pommes de terre", "Curcuma"], ntr: "P: 36g | G: 45g | L: 15g", tip: "Repas complet très rassasiant." }
                ],
                i: ["Morue", "Oignons", "Tomates", "Piment"]
            }
        ],
        diner: [
            { 
                n: "Bouillon de Brèdes 🍵", c: 280, 
                variantes: [
                    { r: ["Brèdes Chouchou", "Ail", "Gingembre", "Sel"], ntr: "P: 8g | G: 40g | L: 2g", tip: "C'est l'allié digestion par excellence." },
                    { r: ["Brèdes", "Petit morceau de morue", "Piment"], ntr: "P: 15g | G: 38g | L: 4g", tip: "La morue apporte le sel naturel." },
                    { r: ["Brèdes", "Bouillon de volaille Halal", "Nouilles"], ntr: "P: 12g | G: 55g | L: 5g", tip: "Plus énergétique pour les soirs d'hiver." },
                    { r: ["Brèdes sautées à l'ail", "Riz", "Oeuf au plat"], ntr: "P: 18g | G: 50g | L: 14g", tip: "Un classique simple et protéiné." },
                    { r: ["Soupe de Brèdes mixée", "Crème légère"], ntr: "P: 9g | G: 35g | L: 8g", tip: "Texture veloutée très douce." }
                ],
                i: ["Brèdes fraîches", "Ail", "Gingembre", "Riz"]
            }
        ]
    };

    let planningGlobal = [];

    function toggleDark() { document.body.classList.toggle('dark-mode'); }

    function lancer() {
        if (!document.getElementById('age').value) return alert("Veuillez remplir votre profil pour personnaliser les portions !");
        document.getElementById('loader').style.display = "block";
        document.getElementById('resultat').style.display = "none";
        setTimeout(() => { genererPlanning(); }, 1000);
    }

    function genererPlanning() {
        const jours = parseInt(document.getElementById('select-duree').value);
        planningGlobal = [];
        for (let i = 0; i < jours; i++) {
            planningGlobal.push({
                p: JSON.parse(JSON.stringify(db.petitDej[Math.floor(Math.random() * db.petitDej.length)])),
                m: JSON.parse(JSON.stringify(db.dejeuner[Math.floor(Math.random() * db.dejeuner.length)])),
                d: JSON.parse(JSON.stringify(db.diner[Math.floor(Math.random() * db.diner.length)])),
                vP: 0, vM: 0, vD: 0 // Index des variantes sélectionnées (0 à 4)
            });
        }
        afficherMenu();
    }

    function changerVariante(jIdx, type) {
        let mealKey = 'v' + type.toUpperCase();
        planningGlobal[jIdx][mealKey] = (planningGlobal[jIdx][mealKey] + 1) % 5;
        afficherMenu();
    }

    function remplacerRepas(jIdx, type) {
        const pool = type === 'p' ? db.petitDej : (type === 'm' ? db.dejeuner : db.diner);
        planningGlobal[jIdx][type] = JSON.parse(JSON.stringify(pool[Math.floor(Math.random() * pool.length)]));
        planningGlobal[jIdx]['v' + type.toUpperCase()] = 0;
        afficherMenu();
    }

    function toggleDetails(id) {
        const el = document.getElementById(id);
        el.style.display = (el.style.display === 'block') ? 'none' : 'block';
    }

    function afficherMenu() {
        document.getElementById('loader').style.display = "none";
        document.getElementById('resultat').style.display = "block";
        let html = "";
        
        planningGlobal.forEach((jour, idx) => {
            if (idx % 15 === 0) {
                let listIng = new Set();
                let fin = Math.min(idx + 15, planningGlobal.length);
                for(let k=idx; k<fin; k++) {
                    planningGlobal[k].p.i.forEach(x => listIng.add(x));
                    planningGlobal[k].m.i.forEach(x => listIng.add(x));
                    planningGlobal[k].d.i.forEach(x => listIng.add(x));
                }
                html += `<div class="shopping-list"><b>🛒 LISTE DE COURSES HALAL (JOUR ${idx+1} À ${fin})</b><br>${Array.from(listIng).map(n => `<span class="shopping-item">${n}</span>`).join('')}</div>`;
            }

            let totalCal = jour.p.c + jour.m.c + jour.d.c;
            html += `
            <div class="day-box">
                <span class="cal-float">${totalCal} kcal</span>
                <h3>JOUR ${idx + 1}</h3>
                ${renderMeal(idx, 'p', '☀️ Petit-Déjeuner', jour.p, jour.vP)}
                ${renderMeal(idx, 'm', '🥗 Déjeuner', jour.m, jour.vM)}
                ${renderMeal(idx, 'd', '🌙 Dîner', jour.d, jour.vD)}
            </div>`;
        });
        document.getElementById('content-area').innerHTML = html;
    }

    function renderMeal(jIdx, type, label, meal, varIdx) {
        const id = `det-${jIdx}-${type}`;
        const variante = meal.variantes[varIdx];
        return `
        <div class="meal-section">
            <span style="font-size:1.1em;"><b>${label} :</b> ${meal.n}</span>
            <div class="no-print">
                <button class="btn-sm btn-replace" onclick="remplacerRepas(${jIdx}, '${type}')">🔄 Remplacer Plat</button>
                <button class="btn-sm btn-recipe" onclick="toggleDetails('${id}')">📖 Recette & Analyse</button>
            </div>
            <div id="${id}" class="details-content">
                <div style="margin-bottom:10px;">
                    <span class="badge-ntr">Variante ${varIdx + 1}/5</span>
                    <button class="btn-sm btn-variant" onclick="changerVariante(${jIdx}, '${type}')">🔄 Autre Recette Halal</button>
                </div>
                <b>🛒 Ingrédients spécifiques :</b> ${meal.i.join(', ')}<br><br>
                <b>👨‍🍳 Préparation :</b><br>
                ${variante.r.map(s => "• " + s).join('<br>')}
                <br><br>
                <div style="background:rgba(0,146,69,0.1); padding:10px; border-radius:8px;">
                    <b>📊 Analyse Nutritionnelle :</b> ${variante.ntr}<br>
                    <b>💡 Conseil :</b> <i>${variante.tip}</i>
                </div>
            </div>
        </div>`;
    }

    function sauvegarderProfil() {
        const p = { age: document.getElementById('age').value, poids: document.getElementById('poids').value, taille: document.getElementById('taille').value, sexe: document.getElementById('sexe').value };
        localStorage.setItem('NutriGenius_26', JSON.stringify(p));
    }

    function chargerProfil() {
        const s = localStorage.getItem('NutriGenius_26');
        if (s) {
            const d = JSON.parse(s);
            document.getElementById('age').value = d.age || ""; document.getElementById('poids').value = d.poids || "";
            document.getElementById('taille').value = d.taille || ""; document.getElementById('sexe').value = d.sexe || "H";
        }
    }
</script>
</body>
</html>
