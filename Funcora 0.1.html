function modelePour(mot){
  const m = normaliser(mot);
  for (const cle in MODELES) if (MODELES[cle].mots.indexOf(m) >= 0) return cle;
  const sing = m.replace(/s$/,"");
  for (const cle in MODELES) if (MODELES[cle].mots.indexOf(sing) >= 0) return cle;
  return null;
}

/* ---------- 8. La scène : plusieurs objets, placés ensemble ------------ */

function tag(liste, nom){ liste.forEach(c => { if (c) c.part = nom; }); return liste; }

function echantillonsCourbe(c, n){
  const out = [];
  if (c.fam === "cercle"){
    const N = Math.max(n, 28);
    for (let i = 0; i <= N; i++){
      const a = i*2*Math.PI/N;
      out.push([c.p.h + c.p.r*Math.cos(a), c.p.k + c.p.r*Math.sin(a)]);
    }
    return out;
  }
  const t0 = Math.min(c.dom[0], c.dom[1]), t1 = Math.max(c.dom[0], c.dom[1]);
  const serre = (c.fam === "arc" || c.fam === "ellipse");
  const N = Math.max(2, n|0);
  for (let i = 0; i <= N; i++){
    const u = i/N;
    const t = serre ? (t0+t1)/2 + (t1-t0)/2*Math.sin(Math.PI*(u-0.5)) : t0 + (t1-t0)*u;
    const v = evaluer(c, t);
    if (!isFinite(v)){ out.push(null); continue; }
    out.push(c.axe === "x" ? [t, v] : [v, t]);
  }
  return out;
}

function bboxListe(liste){
  let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
  for (const c of liste){
    if (!c) continue;
    for (const p of echantillonsCourbe(c, 24)){
      if (!p) continue;
      if (p[0] < x0) x0 = p[0]; if (p[0] > x1) x1 = p[0];
      if (p[1] < y0) y0 = p[1]; if (p[1] > y1) y1 = p[1];
    }
  }
  if (!isFinite(x0)) return null;
  return { x0:x0, x1:x1, y0:y0, y1:y1, w: Math.max(x1-x0, 1e-6), h: Math.max(y1-y0, 1e-6) };
}

const MOTS_CIEL = ["soleil","lune","nuage","nuages","etoile","etoiles","oiseau","avion","arc en ciel","eclair","planete","fusee"];

const scene = {
  objets: [],
  mode: "formules",
  cible: 250,          // nombre de fonctions visé (10 à 1000)
  couleurs: 12,        // nombre de calques de couleur (1 à 1000)
  historique: [],
  demande: ""
};

let _idObjet = 1;

function creerObjet(mot, type, source){
  return {
    id: _idObjet++,
    mot: mot,
    type: type || "mot",
    src: source || null,
    mode: scene.mode,
    cible: scene.cible,
    couleurs: scene.couleurs,
    opts: {},
    retirees: [],
    palette: false,
    couleurForcee: null,
    t: { s: 1, dx: 0, dy: 0, mir: false, rot: 0 },
    man: { s: 1, dx: 0, dy: 0 },   // ce que l'utilisateur a corrigé à la main
    ciel: false,
    info: "",
    base: []
  };
}

function regenererBase(o){
  const reg = { cible: o.cible, couleurs: o.couleurs, hauteur: 10 };
  if (o.type === "image" || o.type === "dessin"){
    const r = vectoriserSource(o.src, reg);
    o.base = r.courbes; o.info = o.type; o.ciel = false; o.calques = r.calques;
    return;
  }
  const cle = modelePour(o.mot);
  o.modele = cle;
  o.ciel = cle ? !!MODELES[cle].ciel : MOTS_CIEL.indexOf(normaliser(o.mot)) >= 0;
  if (o.mode === "formules" && cle){
    o.base = MODELES[cle].f(o.opts).filter(Boolean);
    o.info = "formules";
    return;
  }
  if (o.mode === "tracage" && cle && !emojiPour(o.mot) && !emojiDisponible()){
    o.base = MODELES[cle].f(o.opts).filter(Boolean);
    o.info = "formules";
    return;
  }
  const r = vectoriserMot(o.mot, reg);
  if (r.courbes.length){
    o.base = r.courbes;
    o.info = r.source;
    o.calques = r.calques;
  } else if (cle){
    o.base = MODELES[cle].f(o.opts).filter(Boolean);
    o.info = "formules";
  } else {
    o.base = []; o.info = "vide";
  }
}

function courbesObjet(o){
  let base = o.base.filter(c => c && o.retirees.indexOf(c.part) < 0);
  let liste = transformerListe(base, o.t).map(normaliserCourbe).filter(courbeValide);
  liste.forEach((c, i) => {
    if (o.couleurForcee) c.col = o.couleurForcee;
    else if (o.palette || !c.col) c.col = PALETTE[i % PALETTE.length];
  });
  return liste;
}

function courbesScene(){
  const out = [];
  for (const o of scene.objets) out.push.apply(out, courbesObjet(o));
  return out;
}

// Place les objets : les uns à côté des autres sur le sol, le décor en haut
// Le placement automatique, puis par-dessus les corrections demandées
function appliquerPlacement(o, s0, dx0, dy0){
  if (!o.man) o.man = { s: 1, dx: 0, dy: 0 };
  o.t.s = arrondi(s0*o.man.s, 3);
  o.t.dx = arrondi(dx0 + o.man.dx, 2);
  o.t.dy = arrondi(dy0*o.man.s + o.man.dy, 2);
}

function placerScene(){
  const sol = scene.objets.filter(o => !o.ciel);
  const ciel = scene.objets.filter(o => o.ciel);
  // un seul objet en mode formules : on garde ses coordonnées d'origine,
  // les équations restent avec des nombres ronds.
  if (scene.objets.length === 1 && scene.objets[0].info === "formules"){
    appliquerPlacement(scene.objets[0], 1, 0, 0);
    return;
  }
  let curseur = 0;
  sol.forEach((o, i) => {
    const b = bboxListe(o.base.filter(c => c && o.retirees.indexOf(c.part) < 0));
    if (!b){ appliquerPlacement(o, 1, 0, 0); return; }
    const hCible = i === 0 ? 9 : 6.5;
    // l'échelle se calcule sur la taille d'origine : enlever une cheminée
    // ne doit pas faire grossir toute la maison.
    if (!o.ref || o.refInfo !== o.info){ o.ref = b; o.refInfo = o.info; }
    const s = arrondi(Math.min(hCible/o.ref.h, 12/o.ref.w), 2);
    o.pos = { s: s, dx: arrondi(curseur - b.x0*s, 1), dy: arrondi(-b.y0*s, 1) };
    curseur += b.w*s + 1.3;
  });
  const largeur = Math.max(curseur - 1.3, 6);
  sol.forEach(o => { if (o.pos) appliquerPlacement(o, o.pos.s, arrondi(o.pos.dx - largeur/2, 1), o.pos.dy); });
  ciel.forEach((o, i) => {
    const b = bboxListe(o.base.filter(c => c && o.retirees.indexOf(c.part) < 0));
    if (!b){ appliquerPlacement(o, 1, 0, 10); return; }
    if (!o.ref || o.refInfo !== o.info){ o.ref = b; o.refInfo = o.info; }
    const s = arrondi(Math.min(4.4/o.ref.h, 5.5/o.ref.w), 2);
    const n = ciel.length;
    const cx = (i + 1)/(n + 1)*largeur - largeur/2 + largeur*0.12;
    appliquerPlacement(o, s, arrondi(cx - (b.x0 + b.w/2)*s, 1), arrondi(10.2 - b.y0*s, 1));
  });
}

function memoriser(){
  const copie = scene.objets.map(o => {
    const c = Object.assign({}, o);
    c.base = null;
    c.t = Object.assign({}, o.t);
    c.man = Object.assign({}, o.man || { s:1, dx:0, dy:0 });
    c.opts = Object.assign({}, o.opts);
    c.retirees = o.retirees.slice();
    return c;
  });
  scene.historique.push({ objets: copie, mode: scene.mode, cible: scene.cible, couleurs: scene.couleurs, demande: scene.demande });
  if (scene.historique.length > 30) scene.historique.shift();
}

function annulerDerniere(){
  if (scene.historique.length < 1) return false;
  const e = scene.historique.pop();
  scene.objets = e.objets;
  scene.mode = e.mode; scene.cible = e.cible; scene.couleurs = e.couleurs; scene.demande = e.demande;
  scene.objets.forEach(regenererBase);
  return true;
}

/* ---------- Analyse de la demande ------------------------------------- */

const MOTS_INUTILES = ["dessine","dessiner","dessin","trace","tracer","fais","faire","moi","genere","generer",
  "cree","creer","montre","montrer","je","veux","voudrais","peux","tu","stp","s","il","te","plait","please",
  "un","une","des","le","la","les","du","de","d","l","au","aux","mon","ma","mes","ce","cette"];

function nettoyerSujet(p){
  const mots = p.trim().split(/\s+/).filter(Boolean);
  while (mots.length && MOTS_INUTILES.indexOf(mots[0]) >= 0) mots.shift();
  return mots.join(" ").trim();
}

function analyserDemande(txt){
  let n = " " + normaliser(txt) + " ";
  n = n.replace(/ (avec|et|puis|ainsi que|plus) /g, " | ");
  n = n.replace(/[,+]/g, " | ");
  const sujets = n.split("|").map(nettoyerSujet).filter(Boolean);
  return sujets.length ? sujets : [];
}

function construireScene(demande){
  const sujets = analyserDemande(demande);
  if (!sujets.length) return { ok: false, message: "Écris ce que tu veux dessiner, par exemple « une maison »." };
  scene.demande = demande;
  scene.objets = sujets.slice(0, 6).map(m => creerObjet(m, "mot"));
  return { ok: true, sujets: sujets };
}

function ajouterObjetMot(mot){
  const o = creerObjet(mot, "mot");
  o.mode = scene.mode; o.cible = cibleParObjet(scene.objets.length + 1); o.couleurs = scene.couleurs;
  regenererBase(o);
  if (!o.base.length) return null;
  scene.objets.push(o);
  placerScene();
  return o;
}

function objetDepuisSource(nom, type, canvas){
  const o = creerObjet(nom, type, canvas);
  o.mode = "tracage"; o.cible = scene.cible; o.couleurs = scene.couleurs;   // une image = un seul objet
  regenererBase(o);
  return o;
}

/* ---------- 9. Les reproches : corriger le dessin en français ---------- */

const PIECES = {
  toit:["toit","toiture"], cheminee:["cheminee"], fumee:["fumee"], porte:["porte"],
  fenetre:["fenetre","fenetres","vitre","vitres"], mur:["mur","murs"], roue:["roue","roues"],
  hublot:["hublot"], flamme:["flamme","flammes","feu"], moustache:["moustache","moustaches"],
  oreille:["oreille","oreilles"], oeil:["oeil","yeux"], tronc:["tronc"], rayon:["rayon","rayons"],
  feuille:["feuille","feuilles","feuillage"], tige:["tige"], queue:["queue"]
};

const COULEURS_MOTS = {
  rouge:"#e2564d", bleu:"#2d70f5", bleue:"#2d70f5", vert:"#3ec46d", verte:"#3ec46d",
  jaune:"#f2c744", orange:"#f08a35", violet:"#c07cf5", violette:"#c07cf5", rose:"#f27a9b",
  blanc:"#e8edf7", blanche:"#e8edf7", noir:"#8a94ab", gris:"#9aa6bf", grise:"#9aa6bf",
  marron:"#c08a55", brun:"#c08a55", cyan:"#48c7d0", turquoise:"#48c7d0"
};

function trouverPiece(n){
  for (const cle in PIECES) for (const m of PIECES[cle])
    if (new RegExp("\\b" + m + "\\b").test(n)) return cle;
  return null;
}

function trouverObjet(n){
  for (const o of scene.objets){
    const m = normaliser(o.mot);
    if (m && new RegExp("\\b" + m.replace(/[.*+?^${}()|[\]\\]/g,"") + "\\b").test(n)) return o;
  }
  return null;
}

function objetPrincipal(){ return scene.objets.length ? scene.objets[0] : null; }

function appliquerReproche(txt){
  const n = normaliser(txt);
  if (!n) return { ok:false, message:"Dis-moi ce qui ne va pas." };

  if (/\b(annule|annuler|retour|reviens|undo|avant)\b/.test(n)){
    if (annulerDerniere()) return { ok:true, message:"C'est annulé, on revient au dessin d'avant." };
    return { ok:false, message:"Il n'y a rien à annuler." };
  }

  memoriser();
  const cible = trouverObjet(n) || objetPrincipal();
  if (!cible) return { ok:false, message:"Il n'y a encore rien à corriger : demande d'abord un dessin." };
  const piece = trouverPiece(n);
  const tous = /\b(tout|tous|toute|entier|dessin|scene)\b/.test(n);
  const vises = tous ? scene.objets : [cible];
  const modele = cible.modele && MODELES[cible.modele];
  const options = (modele && modele.options) || [];
  const nomCible = cible.mot;

  const grand = /\b(plus (grand|gros|grande|large|haut|haute|long|longue)|agrandis|agrandir|grossis|trop petit|trop petite|minuscule|plus grand)\b/.test(n);
  const petit = /\b(plus (petit|petite|fin|mince|bas|basse|court|courte)|reduis|reduire|diminue|retrecis|trop grand|trop grande|trop gros|enorme)\b/.test(n);
  const facteurTexte = n.match(/\b(?:fois|x|\*)\s*([0-9]+(?:[.,][0-9]+)?)/);
  let facteur = grand ? 1.35 : (petit ? 1/1.35 : 1);
  if (facteurTexte){
    const v = parseFloat(facteurTexte[1].replace(",", "."));
    if (isFinite(v) && v > 0.05 && v < 20) facteur = petit ? 1/v : v;
  }
  if (/\b(deux fois plus (grand|gros))\b/.test(n)) facteur = 2;
  if (/\b(deux fois plus (petit|petite))\b/.test(n)) facteur = 0.5;

  /* --- enlever --- */
  if (/\b(enleve|enlever|supprime|supprimer|retire|retirer|vire|sans|cache)\b/.test(n)){
    if (piece){
      if (options.indexOf(piece) >= 0){ cible.opts[piece] = false; regenererBase(cible); placerScene();
        return { ok:true, message:"D'accord, j'enlève " + piece + " sur " + nomCible + "." }; }
      let trouve = false;
      for (const o of vises){
        if (o.base.some(c => c && c.part === piece)){ o.retirees.push(piece); trouve = true; }
      }
      if (trouve){ placerScene(); return { ok:true, message:"C'est enlevé : " + piece + "." }; }
      return { ok:false, message:"Je ne trouve pas « " + piece + " » dans ce dessin." };
    }
    const objVise = trouverObjet(n);
    if (objVise && scene.objets.length > 1){
      scene.objets = scene.objets.filter(o => o !== objVise);
      placerScene();
      return { ok:true, message:"J'ai retiré " + objVise.mot + " de la scène." };
    }
    return { ok:false, message:"Précise ce que j'enlève : « enlève la cheminée », « enlève le sapin »." };
  }

  /* --- ajouter --- */
  if (/\b(ajoute|ajouter|rajoute|mets|met|mettre|avec un|avec une)\b/.test(n)){
    if (piece && options.indexOf(piece) >= 0){
      const v = cible.opts[piece];
      cible.opts[piece] = (typeof v === "number") ? v + 1 : true;
      regenererBase(cible); placerScene();
      return { ok:true, message:"J'ajoute " + piece + " sur " + nomCible + "." };
    }
    if (piece && cible.retirees.indexOf(piece) >= 0){
      cible.retirees = cible.retirees.filter(p => p !== piece);
      placerScene();
      return { ok:true, message:"Je remets " + piece + "." };
    }
    const apres = n.replace(/^.*\b(ajoute|ajouter|rajoute|mets|met|mettre)\b/, "");
    const sujet = nettoyerSujet(apres);
    if (sujet){
      const o = ajouterObjetMot(sujet);
      if (o) return { ok:true, message:"J'ajoute " + sujet + " à la scène." };
      return { ok:false, message:"Je n'arrive pas à tracer « " + sujet + " »." };
    }
    return { ok:false, message:"Dis-moi quoi ajouter : « ajoute un soleil »." };
  }

  /* --- pièce paramétrable (toit plus pointu, porte plus grande...) --- */
  if (piece && (grand || petit || /\bpointu|plat|pentu|haut\b/.test(n))){
    if (options.indexOf(piece) >= 0){
      const actuel = typeof cible.opts[piece] === "number" ? cible.opts[piece] : 1;
      let f = facteur;
      if (/\bpointu|pentu\b/.test(n)) f = 1.3;
      if (/\bplat\b/.test(n)) f = 0.75;
      cible.opts[piece] = borne(actuel*f, 0.2, 4);
      regenererBase(cible); placerScene();
      return { ok:true, message:"Voilà : " + piece + " " + (f >= 1 ? "plus grand" : "plus petit") + " sur " + nomCible + "." };
    }
    // sinon : on agrandit juste cette pièce, autour de son centre
    let touche = 0;
    for (const o of vises){
      const morceaux = o.base.filter(c => c && c.part === piece);
      if (!morceaux.length) continue;
      const b = bboxListe(morceaux);
      if (!b) continue;
      const cx = (b.x0+b.x1)/2, cy = (b.y0+b.y1)/2;
      const remplace = morceaux.map(c => {
        let r = deplacer(c, -cx, -cy);
        r = agrandir(r, facteur);
        r = deplacer(r, cx, cy);
        r.part = c.part; r.col = c.col;
        return r;
      });
      let k = 0;
      o.base = o.base.map(c => (c && c.part === piece) ? remplace[k++] : c);
      touche++;
    }
    if (touche){ placerScene(); return { ok:true, message:(facteur >= 1 ? "J'agrandis " : "Je réduis ") + piece + "." }; }
    return { ok:false, message:"Je ne trouve pas « " + piece + " » dans ce dessin." };
  }

  /* --- taille globale --- */
  if (grand || petit || (facteurTexte && facteur !== 1)){
    vises.forEach(o => { o.man.s = borne(o.man.s*facteur, 0.15, 8); });
    placerScene();
    return { ok:true, message:(facteur >= 1 ? "J'agrandis " : "Je réduis ") + (tous ? "tout le dessin" : nomCible) + "." };
  }

  /* --- déplacement --- */
  const pas = 2.2;
  let bouge = null;
  if (/\b(a gauche|vers la gauche|plus a gauche|gauche)\b/.test(n)) bouge = [-pas, 0];
  else if (/\b(a droite|vers la droite|plus a droite|droite)\b/.test(n)) bouge = [pas, 0];
  else if (/\b(plus haut|monte|vers le haut|en haut|remonte)\b/.test(n)) bouge = [0, pas];
  else if (/\b(plus bas|descend|vers le bas|en bas|baisse)\b/.test(n)) bouge = [0, -pas];
  else if (/\b(au milieu|au centre|centre|recentre)\b/.test(n)) bouge = "centre";
  if (bouge === "centre"){
    scene.objets.forEach(o => { o.man = { s: o.man.s, dx: 0, dy: 0 }; });
    placerScene();
    return { ok:true, message:"Tout est recentré." };
  }
  if (bouge){
    vises.forEach(o => { o.man.dx += bouge[0]; o.man.dy += bouge[1]; });
    placerScene();
    return { ok:true, message:"Déplacé " + (bouge[0] < 0 ? "à gauche" : bouge[0] > 0 ? "à droite" : bouge[1] > 0 ? "vers le haut" : "vers le bas") + "." };
  }

  /* --- retournement / rotation --- */
  if (/\b(retourne|miroir|inverse|autre sens|symetrique)\b/.test(n)){
    vises.forEach(o => { o.t.mir = !o.t.mir; });
    placerScene();
    return { ok:true, message:"Retourné comme dans un miroir." };
  }
  if (/\b(tourne|pivote|rotation|couche|penche)\b/.test(n)){
    const sens = /\b(gauche|antihoraire)\b/.test(n) ? 3 : 1;
    vises.forEach(o => { o.t.rot = (o.t.rot + sens) % 4; });
    placerScene();
    return { ok:true, message:"J'ai fait tourner d'un quart de tour." };
  }

  /* --- niveau de détail / mode --- */
  if (/\b(plus de detail|plus de details|plus precis|plus fin|plus ressemblant|plus realiste|mieux|vrai dessin|plus beau)\b/.test(n)){
    let change = false;
    const avant = scene.cible;
    if (scene.mode === "formules"){   // les modèles tout faits ne peuvent pas être plus détaillés
      scene.mode = "tracage"; change = true;
    } else if (scene.cible < CIBLE_MAX){
      scene.cible = borne(Math.round(scene.cible*2), CIBLE_MIN, CIBLE_MAX); change = true;
    }
    scene.objets.forEach(o => { o.mode = scene.mode; o.cible = cibleParObjet(); regenererBase(o); });
    placerScene();
    majCurseurs();
    return { ok:change, message: change
      ? "Plus de détails : environ " + scene.cible + " fonctions" + (scene.mode === "tracage" && avant === scene.cible ? ", en mode traçage" : "") + "."
      : "C'est déjà le maximum : 1000 fonctions." };
  }
  if (/\b(moins de detail|moins de fonctions|trop de fonctions|simplifie|plus simple|trop complique|allege)\b/.test(n)){
    let change = false;
    if (/\b(fonctions|simple|simplifie)\b/.test(n) && scene.mode === "tracage" && scene.cible <= CIBLE_MIN*2){
      scene.mode = "formules"; change = true;
    } else if (scene.cible > CIBLE_MIN){
      scene.cible = borne(Math.round(scene.cible/2), CIBLE_MIN, CIBLE_MAX); change = true;
    }
    scene.objets.forEach(o => { o.mode = scene.mode; o.cible = cibleParObjet(); regenererBase(o); });
    placerScene();
    majCurseurs();
    return { ok:change, message: change
      ? (scene.mode === "formules" ? "Version plus simple : mode formules."
                                   : "Version plus simple : environ " + scene.cible + " fonctions.")
      : "C'est déjà le plus simple." };
  }
  if (/\b(formules?|equations simples|pour desmos|propre)\b/.test(n)){
    scene.mode = "formules";
    scene.objets.forEach(o => { o.mode = "formules"; regenererBase(o); });
    placerScene();
    return { ok:true, message:"Mode formules : peu d'équations, bien lisibles." };
  }
  if (/\b(tracage|trace le vrai|photo|image reelle)\b/.test(n)){
    scene.mode = "tracage";
    scene.objets.forEach(o => { o.mode = "tracage"; regenererBase(o); });
    placerScene();
    return { ok:true, message:"Mode traçage : beaucoup plus de fonctions, beaucoup plus ressemblant." };
  }

  /* --- couleurs --- */
  if (/\bnoir et blanc\b/.test(n)){
    scene.couleurs = 1;
    majCurseurs();
    scene.objets.forEach(o => { o.couleurs = 1; o.palette = false; o.couleurForcee = "#e8edf7"; regenererBase(o); });
    placerScene();
    return { ok:true, message:"Tout en blanc sur fond sombre." };
  }
  if (/\b(arc en ciel|toutes les couleurs|colore|coloree|multicolore)\b/.test(n)){
    vises.forEach(o => { o.palette = true; o.couleurForcee = null; });
    return { ok:true, message:"Chaque fonction a maintenant sa couleur." };
  }
  if (/\bplus de couleurs\b/.test(n)){
    scene.couleurs = borne(Math.round(scene.couleurs*2), 1, COULEURS_MAX);
    scene.objets.forEach(o => { o.couleurs = scene.couleurs; o.couleurForcee = null; o.palette = false; regenererBase(o); });
    placerScene();
    majCurseurs();
    return { ok:true, message:"Plus de couleurs : " + scene.couleurs + " calques." };
  }
  if (/\bmoins de couleurs\b/.test(n)){
    scene.couleurs = borne(Math.round(scene.couleurs/2), 1, COULEURS_MAX);
    scene.objets.forEach(o => { o.couleurs = scene.couleurs; o.couleurForcee = null; o.palette = false; regenererBase(o); });
    placerScene();
    majCurseurs();
    return { ok:true, message:"Moins de couleurs : " + scene.couleurs + " calques." };
  }
  for (const mot in COULEURS_MOTS){
    if (new RegExp("\\b" + mot + "\\b").test(n)){
      vises.forEach(o => { o.couleurForcee = COULEURS_MOTS[mot]; o.palette = false; });
      return { ok:true, message:"Tracé en " + mot + "." };
    }
  }

  return { ok:false, message:"Je n'ai pas compris. Essaie : « plus grand », « à gauche », « plus de détails », « enlève la cheminée », « ajoute un soleil », « en rouge », « annule »." };
}

/* ---------- 10. Le repère et le panneau des équations ----------------- */

const cvGraphe = document.getElementById("graphe");
const ctxG = cvGraphe.getContext("2d");
const elEtat = document.getElementById("etat");
const elListe = document.getElementById("liste");
const elPagination = document.getElementById("pagination");
const elCompteur = document.getElementById("compteur");
const elJournal = document.getElementById("journal");

let COURBES = [];
let page = 0;
const PAR_PAGE = 200;
let vue = { cx: 0, cy: 5, ppu: 32 };

function redimensionner(){
  const r = cvGraphe.getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  cvGraphe.width = Math.max(1, Math.round(r.width*dpr));
  cvGraphe.height = Math.max(1, Math.round(r.height*dpr));
  ctxG.setTransform(dpr, 0, 0, dpr, 0, 0);
  dessiner();
}

function largeurVue(){ return cvGraphe.width / (Math.min(window.devicePixelRatio || 1, 2)); }
function hauteurVue(){ return cvGraphe.height / (Math.min(window.devicePixelRatio || 1, 2)); }
function versEcranX(x){ return largeurVue()/2 + (x - vue.cx)*vue.ppu; }
function versEcranY(y){ return hauteurVue()/2 - (y - vue.cy)*vue.ppu; }
function versRepereX(px){ return vue.cx + (px - largeurVue()/2)/vue.ppu; }
function versRepereY(py){ return vue.cy - (py - hauteurVue()/2)/vue.ppu; }

function pasGrille(){
  const brut = 80/vue.ppu;
  const p = Math.pow(10, Math.floor(Math.log10(brut)));
  for (const m of [1, 2, 5, 10]) if (p*m >= brut) return p*m;
  return p*10;
}

function dessinerGrille(){
  const W = largeurVue(), H = hauteurVue();
  const pas = pasGrille();
  const x0 = versRepereX(0), x1 = versRepereX(W), y0 = versRepereY(H), y1 = versRepereY(0);
  ctxG.lineWidth = 1;
  ctxG.strokeStyle = "#2a3244";
  ctxG.beginPath();
  for (let x = Math.ceil(x0/pas)*pas; x <= x1; x += pas){
    const px = Math.round(versEcranX(x)) + 0.5;
    ctxG.moveTo(px, 0); ctxG.lineTo(px, H);
  }
  for (let y = Math.ceil(y0/pas)*pas; y <= y1; y += pas){
    const py = Math.round(versEcranY(y)) + 0.5;
    ctxG.moveTo(0, py); ctxG.lineTo(W, py);
  }
  ctxG.stroke();
  // axes
  ctxG.strokeStyle = "#7d8aa5";
  ctxG.lineWidth = 1.4;
  ctxG.beginPath();
  const py0 = Math.round(versEcranY(0)) + 0.5, px0 = Math.round(versEcranX(0)) + 0.5;
  ctxG.moveTo(0, py0); ctxG.lineTo(W, py0);
  ctxG.moveTo(px0, 0); ctxG.lineTo(px0, H);
  ctxG.stroke();
  // graduations
  ctxG.fillStyle = "#9aa6bf";
  ctxG.font = "11px system-ui,sans-serif";
  ctxG.textAlign = "center"; ctxG.textBaseline = "top";
  for (let x = Math.ceil(x0/pas)*pas; x <= x1; x += pas){
    if (Math.abs(x) < pas/2) continue;
    ctxG.fillText(nb(x, 2), versEcranX(x), borne(py0 + 4, 4, H - 16));
  }
  ctxG.textAlign = "right"; ctxG.textBaseline = "middle";
  for (let y = Math.ceil(y0/pas)*pas; y <= y1; y += pas){
    if (Math.abs(y) < pas/2) continue;
    ctxG.fillText(nb(y, 2), borne(px0 - 6, 26, W - 4), versEcranY(y));
  }
}

function echantillonsAffichage(c){
  if (c._ppu === vue.ppu && c._ech) return c._ech;
  let n;
  if (c.fam === "cercle") n = borne(Math.round(2*Math.PI*c.p.r*vue.ppu/5), 32, 400);
  else n = borne(Math.round(Math.abs(c.dom[1]-c.dom[0])*vue.ppu/3), 14, 320);
  c._ech = echantillonsCourbe(c, n);
  c._ppu = vue.ppu;
  return c._ech;
}

function dessinerCourbes(){
  const W = largeurVue(), H = hauteurVue();
  ctxG.lineWidth = 2.1;
  ctxG.lineJoin = "round"; ctxG.lineCap = "round";
  for (const c of COURBES){
    const pts = echantillonsAffichage(c);
    ctxG.strokeStyle = c.col || "#2d70f5";
    ctxG.beginPath();
    let leve = true;
    for (const p of pts){
      if (!p){ leve = true; continue; }
      const px = versEcranX(p[0]), py = versEcranY(p[1]);
      if (px < -4000 || px > W + 4000 || py < -4000 || py > H + 4000){ leve = true; continue; }
      if (leve){ ctxG.moveTo(px, py); leve = false; } else ctxG.lineTo(px, py);
    }
    ctxG.stroke();
  }
}

function dessiner(){
  ctxG.clearRect(0, 0, largeurVue(), hauteurVue());
  ctxG.fillStyle = "#1b2130";
  ctxG.fillRect(0, 0, largeurVue(), hauteurVue());
  dessinerGrille();
  dessinerCourbes();
}

function recadrer(){
  const b = bboxListe(COURBES);
  if (!b){ vue = { cx: 0, cy: 5, ppu: 32 }; dessiner(); return; }
  const W = largeurVue(), H = hauteurVue();
  const marge = 0.12;
  vue.ppu = borne(Math.min(W/(b.w*(1+marge*2)), H/(b.h*(1+marge*2))), 1, 400);
  vue.cx = (b.x0 + b.x1)/2;
  vue.cy = (b.y0 + b.y1)/2;
  COURBES.forEach(c => { c._ech = null; });
  dessiner();
}

/* --- panneau des équations --- */

function majPanneau(){
  const n = COURBES.length;
  elCompteur.innerHTML = "<b>" + n + "</b> fonction" + (n > 1 ? "s" : "");
  const pages = Math.max(1, Math.ceil(n/PAR_PAGE));
  if (page >= pages) page = pages - 1;
  const debut = page*PAR_PAGE, fin = Math.min(n, debut + PAR_PAGE);
  const frag = document.createDocumentFragment();
  for (let i = debut; i < fin; i++){
    const c = COURBES[i];
    const d = document.createElement("div");
    d.className = "eq";
    const past = document.createElement("span");
    past.className = "pastille";
    past.style.background = c.col || "#2d70f5";
    const f = document.createElement("span");
    f.className = "form";
    const txt = texteEquation(c, "uni");
    const coupe = txt.indexOf(" {");
    if (coupe > 0){
      f.appendChild(document.createTextNode(txt.slice(0, coupe)));
      const dom = document.createElement("span");
      dom.className = "dom";
      dom.textContent = txt.slice(coupe);
      f.appendChild(dom);
    } else f.textContent = txt;
    d.appendChild(past); d.appendChild(f);
    frag.appendChild(d);
  }
  elListe.innerHTML = "";
  elListe.appendChild(frag);
  elListe.scrollTop = 0;
  majBoutonCopie();
  elPagination.innerHTML = "";
  if (pages > 1){
    const prec = document.createElement("button");
    prec.textContent = "◀";
    prec.disabled = page === 0;
    prec.onclick = () => { page--; majPanneau(); };
    const suiv = document.createElement("button");
    suiv.textContent = "▶";
    suiv.disabled = page >= pages - 1;
    suiv.onclick = () => { page++; majPanneau(); };
    const txt = document.createElement("span");
    txt.textContent = "équations " + (debut+1) + " à " + fin + " sur " + n;
    elPagination.appendChild(prec); elPagination.appendChild(txt); elPagination.appendChild(suiv);
  } else if (n){
    const txt = document.createElement("span");
    txt.textContent = "toutes les équations sont affichées";
    elPagination.appendChild(txt);
  }
}

const LOT_COPIE = 200;
let lotCopie = 0;

function formatChoisi(){
  const el = document.getElementById("format");
  return el && el.value === "texte" ? "texte" : "latex";
}

// N'exporte que des équations relues et vérifiées : ce qui part dans
// Desmos redonne exactement la courbe affichée.
function equationsExport(style){
  const lignes = [];
  let refus = 0;
  for (const c of COURBES){
    const v = verifierCourbe(c, style);
    if (v.ok) lignes.push(v.txt); else refus++;
  }
  return { lignes: lignes, refus: refus };
}

function texteExport(style){ return equationsExport(style || formatChoisi()).lignes.join("\n"); }

function majBoutonCopie(){
  const b = document.getElementById("btnCopier");
  const tout = document.getElementById("btnCopierTout");
  if (!b) return;
  const n = COURBES.length;
  if (n <= LOT_COPIE){
    lotCopie = 0;
    b.textContent = "Copier pour Desmos";
    if (tout) tout.hidden = true;
    return;
  }
  if (tout) tout.hidden = false;
  if (lotCopie*LOT_COPIE >= n) lotCopie = 0;
  const debut = lotCopie*LOT_COPIE + 1, fin = Math.min(n, (lotCopie + 1)*LOT_COPIE);
  b.textContent = (lotCopie === 0 ? "Copier " : "Lot suivant ") + debut + "\u2013" + fin;
}

function copierTexte(texte, fini){
  if (navigator.clipboard && navigator.clipboard.writeText)
    navigator.clipboard.writeText(texte).then(() => fini(true), () => fini(copierRepli(texte)));
  else fini(copierRepli(texte));
}

function copierPourDesmos(tout){
  const style = formatChoisi();
  const r = equationsExport(style);
  if (!r.lignes.length){ journal("Il n'y a encore aucune équation à copier.", "app", true); return; }
  let debut = 0, fin = r.lignes.length, parLot = false;
  if (!tout && r.lignes.length > LOT_COPIE){
    debut = lotCopie*LOT_COPIE;
    if (debut >= r.lignes.length){ debut = 0; lotCopie = 0; }
    fin = Math.min(r.lignes.length, debut + LOT_COPIE);
    parLot = true;
  }
  copierTexte(r.lignes.slice(debut, fin).join("\n"), ok => {
    if (!ok){ journal("Copie impossible ici : sélectionne les équations dans la liste.", "app", true); return; }
    const nom = style === "latex" ? "en LaTeX" : "en texte simple";
    let msg = parLot
      ? "Lot copié " + nom + " : équations " + (debut + 1) + " à " + fin + " sur " + r.lignes.length +
        ". Colle-les dans Desmos, puis reclique pour le lot suivant."
      : "J'ai copié " + r.lignes.length + " équations " + nom + " : colle-les dans Desmos, une par ligne.";
    if (r.refus) msg += " (" + r.refus + " écartée" + (r.refus > 1 ? "s" : "") + " : je ne les ai pas relues correctement.)";
    journal(msg, "app");
    if (parLot) lotCopie = fin >= r.lignes.length ? 0 : lotCopie + 1;
    majBoutonCopie();
  });
}

function copierRepli(texte){
  try {
    const ta = document.createElement("textarea");
    ta.value = texte;
    ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    const ok = document.execCommand("copy");
    document.body.removeChild(ta);
    return ok;
  } catch (e){ return false; }
}

/* ---------- 11. Interface --------------------------------------------- */

function journal(texte, qui, rate){
  const d = document.createElement("div");
  d.className = "msg " + (qui === "moi" ? "moi" : "app") + (rate ? " rate" : "");
  d.textContent = texte;
  elJournal.appendChild(d);
  elJournal.scrollTop = elJournal.scrollHeight;
  while (elJournal.children.length > 40) elJournal.removeChild(elJournal.firstChild);
}

function etat(txt){ elEtat.textContent = txt; }

function majTout(recadre){
  COURBES = courbesScene();
  page = 0;
  if (recadre) recadrer(); else dessiner();
  majPanneau();
}

function descriptionScene(){
  const parts = scene.objets.map(o => {
    const src = o.info === "formules" ? "formules" : (o.info === "emoji" ? "traçage" :
      (o.info === "texte" ? "texte tracé" : o.info));
    return o.mot + " (" + src + ")";
  });
  return parts.join(", ");
}

/* Les gros calculs sont découpés : la page reprend la main entre deux
   morceaux, donc le bandeau d'état avance au lieu de rester figé. */
function enChaine(taches, fin){
  let i = 0;
  const pas = () => {
    if (i >= taches.length){ if (fin) fin(); return; }
    const t = taches[i++];
    try { t(); } catch (e){ console.error(e); }
    setTimeout(pas, 0);
  };
  setTimeout(pas, 0);
}

// Le curseur Détail donne le nombre de fonctions du DESSIN : quand la scène
// compte plusieurs objets, chacun en reçoit sa part.
function cibleParObjet(nb){
  return Math.max(CIBLE_MIN, Math.round(scene.cible/Math.max(1, nb || scene.objets.length || 1)));
}

function tachesCalcul(objets, intitule){
  const taches = [];
  objets.forEach((o, i) => {
    taches.push(() => etat(intitule + " « " + o.mot + " » " + (i+1) + "/" + objets.length + "…"));
    taches.push(() => {
      o.mode = scene.mode; o.cible = cibleParObjet(objets.length); o.couleurs = scene.couleurs;
      regenererBase(o);
    });
  });
  return taches;
}

function tracerDemande(txt, silencieux, fin){
  const t0 = performance.now();
  const r = construireScene(txt);
  if (!r.ok){
    etat("Rien à tracer.");
    journal(r.message, "app", true);
    if (fin) fin(false);
    return false;
  }
  etat("Je calcule les fonctions…");
  enChaine(tachesCalcul(scene.objets, "Je calcule"), () => {
  scene.objets = scene.objets.filter(o => o.base.length);
  if (!scene.objets.length){
    etat("Rien à tracer.");
    journal("Je n'arrive pas à tracer ça. Essaie un autre mot, ou importe une image.", "app", true);
    if (fin) fin(false);
    return;
  }
  placerScene();
  majTout(true);
  const ms = Math.round(performance.now() - t0);
  etat(descriptionScene() + " — " + COURBES.length + " fonctions en " + ms + " ms");
  if (!silencieux){
    journal("Voilà " + descriptionScene() + " : " + COURBES.length + " fonctions. Tu peux me faire des reproches en dessous.", "app");
    prevenirSiPeu();
    const ecrits = scene.objets.filter(o => o.info === "texte").map(o => o.mot);
    if (ecrits.length)
      journal("Je ne connais pas de dessin pour « " + ecrits.join(" », « ") +
        " » : j'ai tracé le mot écrit. Importe une image ou dessine-le à la main pour le vrai dessin.", "app");
  }
  if (fin) fin(true);
  });
  return true;
}

// Le dessin de départ n'a parfois pas assez de matière pour la cible demandée
function prevenirSiPeu(){
  if (scene.mode !== "tracage" || !scene.objets.length) return;
  const part = cibleParObjet();
  const maigres = scene.objets.filter(o => o.base.length < part*0.7);
  if (!maigres.length) return;
  journal("Je vise " + scene.cible + " fonctions (" + part + " par objet), mais « " + maigres.map(o => o.mot).join(" », « ") +
    " » n'en donne que " + maigres.map(o => o.base.length).join(" / ") +
    " : le dessin de départ n'a pas plus de détails à offrir. Monte les couleurs pour en avoir davantage.", "app");
}

function regenererTout(fin){
  if (!scene.objets.length){ if (fin) fin(); return; }
  enChaine(tachesCalcul(scene.objets, "Je recalcule"), () => {
    placerScene();
    majTout(false);
    etat(descriptionScene() + " — " + COURBES.length + " fonctions");
    prevenirSiPeu();
    if (fin) fin();
  });
}

const EXEMPLES = ["une maison", "une maison avec un sapin et un soleil", "un chat", "une fusée",
  "un coeur", "une fleur", "une voiture", "un dragon", "une pizza", "un papillon"];

function construireExemples(){
  const box = document.getElementById("exemples");
  EXEMPLES.forEach(ex => {
    const b = document.createElement("button");
    b.className = "puce";
    b.textContent = ex;
    b.onclick = () => { document.getElementById("demande").value = ex; lancerTrace(); };
    box.appendChild(b);
  });
}

function lancerTrace(){
  const txt = document.getElementById("demande").value.trim();
  if (!txt) return;
  journal(txt, "moi");
  scene.historique = [];
  setTimeout(() => tracerDemande(txt), 10);
}

/* --- souris et doigts sur le repère --- */
(function interactionsGraphe(){
  let attrape = false, dernier = null, pincee = null;
  cvGraphe.addEventListener("pointerdown", e => {
    attrape = true; dernier = [e.clientX, e.clientY];
    cvGraphe.classList.add("attrape");
    cvGraphe.setPointerCapture(e.pointerId);
  });
  cvGraphe.addEventListener("pointermove", e => {
    if (!attrape || !dernier) return;
    const dx = e.clientX - dernier[0], dy = e.clientY - dernier[1];
    dernier = [e.clientX, e.clientY];
    vue.cx -= dx/vue.ppu; vue.cy += dy/vue.ppu;
    dessiner();
  });
  const fin = e => { attrape = false; dernier = null; cvGraphe.classList.remove("attrape"); };
  cvGraphe.addEventListener("pointerup", fin);
  cvGraphe.addEventListener("pointercancel", fin);
  cvGraphe.addEventListener("wheel", e => {
    e.preventDefault();
    zoomer(Math.pow(0.999, e.deltaY), e.clientX, e.clientY);
  }, { passive: false });
  cvGraphe.addEventListener("touchmove", e => {
    if (e.touches.length !== 2) return;
    e.preventDefault();
    const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
    if (pincee) zoomer(d/pincee, (e.touches[0].clientX + e.touches[1].clientX)/2, (e.touches[0].clientY + e.touches[1].clientY)/2);
    pincee = d;
  }, { passive: false });
  cvGraphe.addEventListener("touchend", () => { pincee = null; });
})();

function zoomer(facteur, clientX, clientY){
  const r = cvGraphe.getBoundingClientRect();
  const px = (clientX === undefined ? r.width/2 : clientX - r.left);
  const py = (clientY === undefined ? r.height/2 : clientY - r.top);
  const ax = versRepereX(px), ay = versRepereY(py);
  vue.ppu = borne(vue.ppu*facteur, 1.5, 600);
  vue.cx = ax - (px - largeurVue()/2)/vue.ppu;
  vue.cy = ay + (py - hauteurVue()/2)/vue.ppu;
  COURBES.forEach(c => { c._ech = null; });
  dessiner();
}

/* Curseurs de 10 à 1000 : échelle logarithmique, pour régler finement
   en bas (10, 12, 15…) comme en haut (700, 850, 1000). */
function valeurCurseur(pos, min, max){
  const v = min*Math.pow(max/min, borne(pos, 0, 100)/100);
  if (v < 20) return Math.round(v);
  const p = Math.pow(10, Math.floor(Math.log10(v)) - 1);
  return Math.round(Math.round(v/p)*p);
}
function positionCurseur(val, min, max){
  return borne(Math.round(100*Math.log(borne(val, min, max)/min)/Math.log(max/min)), 0, 100);
}

const elDetail = document.getElementById("detail"), elDetailVal = document.getElementById("detailVal");
const elCoul = document.getElementById("couleurs"), elCoulVal = document.getElementById("couleursVal");

function majCurseurs(){
  elDetail.value = positionCurseur(scene.cible, CIBLE_MIN, CIBLE_MAX);
  elDetailVal.textContent = scene.cible;
  elCoul.value = positionCurseur(Math.max(scene.couleurs, 10), 10, COULEURS_MAX);
  elCoulVal.textContent = scene.couleurs;
}

elDetail.oninput = () => { elDetailVal.textContent = valeurCurseur(+elDetail.value, CIBLE_MIN, CIBLE_MAX); };
elDetail.onchange = () => {
  scene.cible = valeurCurseur(+elDetail.value, CIBLE_MIN, CIBLE_MAX);
  elDetailVal.textContent = scene.cible;
  if (!scene.objets.length) return;
  memoriser();
  if (scene.mode === "formules"){
    journal("Le curseur Détail ne sert qu'en mode Traçage : les modèles tout faits ont un nombre d'équations fixe.", "app", true);
    return;
  }
  etat("Je recalcule…");
  regenererTout();
};

elCoul.oninput = () => { elCoulVal.textContent = valeurCurseur(+elCoul.value, 10, COULEURS_MAX); };
elCoul.onchange = () => {
  scene.couleurs = valeurCurseur(+elCoul.value, 10, COULEURS_MAX);
  elCoulVal.textContent = scene.couleurs;
  if (!scene.objets.length) return;
  memoriser();
  scene.objets.forEach(o => { o.couleurForcee = null; o.palette = false; });
  if (scene.mode === "formules"){
    journal("Le curseur Couleurs ne sert qu'en mode Traçage.", "app", true);
    return;
  }
  etat("Je recalcule…");
  regenererTout(() => {
    const vus = scene.objets.map(o => o.calques || 0).reduce((a, b) => Math.max(a, b), 0);
    if (vus && vus < scene.couleurs*0.8)
      journal(scene.couleurs + " calques demandés, " + vus + " seulement : le dessin de départ ne contient pas plus de couleurs.", "app");
  });
};

document.getElementById("fichier").addEventListener("change", e => {
  const f = e.target.files && e.target.files[0];
  if (!f) return;
  const lect = new FileReader();
  lect.onload = () => {
    const img = new Image();
    img.onload = () => {
      const cv = creerCanvas(TAILLE_MAX);
      const ctx = contexteVide(cv);
      const ech = Math.min(TAILLE_MAX/img.width, TAILLE_MAX/img.height);
      const w = img.width*ech, h = img.height*ech;
      ctx.drawImage(img, (TAILLE_MAX-w)/2, (TAILLE_MAX-h)/2, w, h);
      etat("Je transforme l'image en fonctions…");
      journal("Image importée : " + f.name, "moi");
      setTimeout(() => {
        scene.historique = [];
        const o = objetDepuisSource(f.name.replace(/\.[^.]+$/, "") || "image", "image", cv);
        if (!o.base.length){ journal("Cette image est trop uniforme pour en tirer des contours.", "app", true); etat("Rien à tracer."); return; }
        scene.objets = [o];
        placerScene();
        majTout(true);
        etat("image — " + COURBES.length + " fonctions");
        journal("Ton image est devenue " + COURBES.length + " fonctions. Règle « Détail » pour en avoir plus ou moins.", "app");
      }, 10);
    };
    img.src = lect.result;
  };
  lect.readAsDataURL(f);
  e.target.value = "";
});

/* --- dessin à la main --- */
const modal = document.getElementById("modalDessin");
const toile = document.getElementById("toile");
const ctxToile = toile.getContext("2d", { willReadFrequently: true });
function viderToile(){
  ctxToile.fillStyle = "#ffffff";
  ctxToile.fillRect(0, 0, toile.width, toile.height);
  ctxToile.strokeStyle = "#111318";
  ctxToile.lineWidth = 9;
  ctxToile.lineJoin = "round"; ctxToile.lineCap = "round";
}
viderToile();
(function dessinLibre(){
  let trace = false, prec = null;
  const pos = e => {
    const r = toile.getBoundingClientRect();
    return [(e.clientX - r.left)*toile.width/r.width, (e.clientY - r.top)*toile.height/r.height];
  };
  toile.addEventListener("pointerdown", e => {
    trace = true; prec = pos(e); toile.setPointerCapture(e.pointerId);
    ctxToile.beginPath(); ctxToile.moveTo(prec[0], prec[1]); ctxToile.lineTo(prec[0]+0.01, prec[1]); ctxToile.stroke();
  });
  toile.addEventListener("pointermove", e => {
    if (!trace) return;
    const p = pos(e);
    ctxToile.beginPath(); ctxToile.moveTo(prec[0], prec[1]); ctxToile.lineTo(p[0], p[1]); ctxToile.stroke();
    prec = p;
  });
  const fin = () => { trace = false; prec = null; };
  toile.addEventListener("pointerup", fin);
  toile.addEventListener("pointercancel", fin);
})();
document.getElementById("btnDessiner").onclick = () => { modal.hidden = false; };
document.getElementById("btnToileFermer").onclick = () => { modal.hidden = true; };
document.getElementById("btnToileEffacer").onclick = viderToile;
document.getElementById("btnToileValider").onclick = () => {
  modal.hidden = true;
  etat("Je transforme ton dessin en fonctions…");
  journal("Mon dessin à la main", "moi");
  setTimeout(() => {
    const cv = creerCanvas(toile.width);
    cv.getContext("2d").drawImage(toile, 0, 0);
    scene.historique = [];
    const o = objetDepuisSource("dessin", "dessin", cv);
    if (!o.base.length){ journal("La feuille est vide : dessine quelque chose d'abord.", "app", true); etat("Rien à tracer."); return; }
    scene.objets = [o];
    placerScene();
    majTout(true);
    etat("dessin — " + COURBES.length + " fonctions");
    journal("Ton dessin est devenu " + COURBES.length + " fonctions.", "app");
  }, 10);
};
