<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>Funcora 0.1</title>
<style>
*{box-sizing:border-box}
:root{
  --fond:#131722; --fond2:#1b2130; --fond3:#232b3d; --bord:#333d54;
  --texte:#e8edf7; --texte2:#9aa6bf; --accent:#2d70f5; --accent2:#3ec46d;
  --grille:#2a3244; --axe:#7d8aa5;
}
html,body{margin:0;padding:0;background:var(--fond);color:var(--texte);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:15px}
body{padding:0 0 env(safe-area-inset-bottom,0px)}
h1{margin:0;font-size:26px;letter-spacing:.5px}
h1 span{color:var(--accent);font-weight:400}
header{padding:14px 16px 8px}
.sous{margin:4px 0 0;color:var(--texte2);font-size:13px}
#barre{display:flex;gap:8px;padding:8px 16px}
#demande,#reproche{flex:1;min-width:0;padding:12px 14px;border-radius:10px;border:1px solid var(--bord);
  background:var(--fond2);color:var(--texte);font-size:16px;outline:none}
#demande:focus,#reproche:focus{border-color:var(--accent)}
button{font-family:inherit;font-size:14px;cursor:pointer;border:1px solid var(--bord);
  background:var(--fond3);color:var(--texte);padding:11px 16px;border-radius:10px}
button:hover{background:#2c364c}
button.principal{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
button.principal:hover{background:#245fd6}
button:disabled{opacity:.5;cursor:default}
#exemples{display:flex;flex-wrap:wrap;gap:6px;padding:2px 16px 8px}
.puce{background:var(--fond2);border:1px solid var(--bord);color:var(--texte2);
  padding:6px 10px;border-radius:999px;font-size:12.5px;cursor:pointer}
.puce:hover{color:var(--texte);border-color:var(--accent)}
#outils{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:6px 16px 10px}
.groupe{display:flex;align-items:center;gap:8px;background:var(--fond2);border:1px solid var(--bord);
  border-radius:10px;padding:6px 10px}
.groupe label{color:var(--texte2);font-size:12.5px;white-space:nowrap}
.bascule{display:flex;border:1px solid var(--bord);border-radius:10px;overflow:hidden}
.bascule button{border:0;border-radius:0;padding:10px 14px;background:var(--fond2)}
.bascule button.actif{background:var(--accent);color:#fff;font-weight:600}
input[type=range]{width:110px;accent-color:var(--accent)}
.fichier{display:inline-block}
.fichier input{display:none}
main{display:flex;gap:12px;padding:0 16px;align-items:stretch}
#zoneGraphe{position:relative;flex:1;min-width:0;background:var(--fond2);border:1px solid var(--bord);
  border-radius:12px;overflow:hidden;height:min(62vh,560px)}
#graphe{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#graphe.attrape{cursor:grabbing}
#etat{position:absolute;left:10px;top:10px;background:#0b0f18cc;border:1px solid var(--bord);
  padding:6px 10px;border-radius:8px;font-size:12.5px;color:var(--texte2);pointer-events:none;
  max-width:72%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#outilsGraphe{position:absolute;right:10px;bottom:10px;display:flex;gap:6px}
#outilsGraphe button{padding:8px 10px;font-size:12.5px;background:#0b0f18cc}
#panneau{width:380px;flex:0 0 380px;background:var(--fond2);border:1px solid var(--bord);
  border-radius:12px;display:flex;flex-direction:column;height:min(62vh,560px)}
#entete{display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:10px;border-bottom:1px solid var(--bord)}
#compteur{font-size:13px;color:var(--texte2);white-space:nowrap}
.copie{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.copie select{background:var(--fond3);color:var(--texte);border:1px solid var(--bord);
  border-radius:8px;padding:8px 6px;font-family:inherit;font-size:12.5px}
.copie button{padding:9px 12px;font-size:13px}
.copie button.mini{padding:9px 10px;color:var(--texte2)}
.unite{color:var(--texte2);font-size:11.5px}
.groupe span{min-width:34px;text-align:right;font-variant-numeric:tabular-nums}
#compteur b{color:var(--texte);font-size:15px}
#liste{flex:1;overflow:auto;padding:6px}
.eq{display:flex;gap:8px;align-items:flex-start;padding:7px 8px;border-radius:8px;font-size:13.5px;line-height:1.45}
.eq:hover{background:var(--fond3)}
.pastille{width:12px;height:12px;border-radius:50%;flex:0 0 12px;margin-top:4px}
.form{font-family:"Cambria Math","Latin Modern Math",Georgia,serif;font-size:15px;word-break:break-word}
.dom{color:var(--texte2)}
#pagination{display:flex;gap:6px;align-items:center;justify-content:center;padding:8px;
  border-top:1px solid var(--bord);font-size:12.5px;color:var(--texte2)}
#pagination button{padding:6px 10px;font-size:12.5px}
#retouches{padding:12px 16px 20px}
#journal{max-height:180px;overflow:auto;display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
.msg{padding:8px 11px;border-radius:10px;font-size:13.5px;max-width:92%}
.msg.moi{align-self:flex-end;background:var(--accent);color:#fff}
.msg.app{align-self:flex-start;background:var(--fond2);border:1px solid var(--bord);color:var(--texte)}
.msg.app.rate{border-color:#8a5a2b;color:#f0c890}
.barre2{display:flex;gap:8px}
#modalDessin{position:fixed;inset:0;background:#0b0f18e8;z-index:50;display:flex;align-items:center;
  justify-content:center;padding:16px}
#modalDessin[hidden]{display:none}
#modalDessin .carte{background:var(--fond2);border:1px solid var(--bord);border-radius:14px;padding:14px;
  max-width:min(560px,94vw)}
#modalDessin h2{margin:0 0 10px;font-size:18px}
#toile{background:#fff;border-radius:10px;touch-action:none;display:block;width:min(500px,86vw);height:min(500px,86vw)}
#modalDessin .actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.pied{padding:0 16px 22px;color:var(--texte2);font-size:12px;text-align:center}
@media (max-width:860px){
  main{flex-direction:column}
  #panneau{width:auto;flex:1 1 auto;height:min(52vh,420px)}
  #zoneGraphe{height:min(46vh,420px)}
  header{padding:10px 14px 4px}
  h1{font-size:22px}
  .sous{font-size:12px}
  #exemples,#outils{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:10px}
  #exemples::-webkit-scrollbar,#outils::-webkit-scrollbar{display:none}
  #exemples>*,#outils>*{flex:0 0 auto}
  .puce{white-space:nowrap}
  #etat{font-size:11px;padding:4px 8px;max-width:62%}
  input[type=range]{width:90px}
}
</style>
</head>
<body>

<header>
  <h1>Funcora <span>0.1</span></h1>
  <p class="sous">Écris ce que tu veux dessiner : Funcora le trace avec des fonctions mathématiques,
    et te donne toutes les équations à copier.</p>
</header>

<div id="barre">
  <input id="demande" placeholder="une maison avec un sapin et un soleil" autocomplete="off">
  <button id="btnTracer" class="principal">Tracer</button>
</div>

<div id="exemples"></div>

<div id="outils">
  <div class="bascule" id="modeBascule">
    <button data-mode="formules" class="actif">Formules</button>
    <button data-mode="tracage">Traçage</button>
  </div>
  <div class="groupe"><label for="detail">Détail</label><input type="range" id="detail" min="0" max="100" value="70"><span id="detailVal">250</span><span class="unite">fonctions</span></div>
  <div class="groupe"><label for="couleurs">Couleurs</label><input type="range" id="couleurs" min="0" max="100" value="4"><span id="couleursVal">12</span><span class="unite">calques</span></div>
  <label class="fichier"><button type="button" onclick="this.parentNode.querySelector('input').click()">Importer une image</button><input type="file" id="fichier" accept="image/*"></label>
  <button id="btnDessiner">Dessiner à la main</button>
</div>

<main>
  <section id="zoneGraphe">
    <canvas id="graphe"></canvas>
    <div id="etat">Prêt.</div>
    <div id="outilsGraphe">
      <button id="btnZoomM">−</button>
      <button id="btnZoomP">+</button>
      <button id="btnRecadrer">Recadrer</button>
    </div>
  </section>
  <aside id="panneau">
    <div id="entete">
      <span id="compteur"><b>0</b> fonction</span>
      <span class="copie">
        <select id="format" title="Format des équations copiées">
          <option value="latex">LaTeX (Desmos)</option>
          <option value="texte">texte simple</option>
        </select>
        <button id="btnCopier">Copier pour Desmos</button>
        <button id="btnCopierTout" class="mini" title="Tout copier d'un coup" hidden>tout</button>
      </span>
    </div>
    <div id="liste"></div>
    <div id="pagination"></div>
  </aside>
</main>

<section id="retouches">
  <div id="journal"></div>
  <div class="barre2">
    <input id="reproche" placeholder="fais-lui un reproche : « le toit est trop grand », « plus de détails »" autocomplete="off">
    <button id="btnReproche">Corriger</button>
  </div>
</section>

<p class="pied">Funcora 0.1 — tout se passe dans cette page, sans internet et sans compte.</p>

<div id="modalDessin" hidden>
  <div class="carte">
    <h2>Dessine, Funcora en fera des fonctions</h2>
    <canvas id="toile" width="512" height="512"></canvas>
    <div class="actions">
      <button id="btnToileValider" class="principal">Transformer en fonctions</button>
      <button id="btnToileEffacer">Effacer</button>
      <button id="btnToileFermer">Fermer</button>
    </div>
  </div>
</div>

<script>
"use strict";
/* =======================================================================
   FUNCORA 0.1
   Un dessin -> des fonctions. Tout est calculé ici, hors ligne.
   Nouveautés 0.1 : sortie LaTeX que Desmos lit sans broncher, curseurs
   Détail et Couleurs de 10 à 1000, contours plus nets (image interne
   jusqu'à 1536 px), coins francs, et plus aucun doublon.
   Plan du fichier :
     1. Outils généraux
     2. Familles de courbes (paramètres, évaluation, écriture)
     3. Transformations (échelle, déplacement, miroir, rotation)
     4. Ajustement : un nuage de points -> une équation
     5. Contours : pixels -> polygones (marching squares)
     6. Vectoriseur : mot / emoji / image / dessin -> courbes
     7. Lexique des mots et modèles paramétriques faits main
     8. Scène : plusieurs objets, placement, historique
     9. Reproches : corriger le dessin en français
    10. Rendu du repère et panneau des équations
    11. Interface
   ======================================================================= */

/* ---------- 1. Outils généraux ---------------------------------------- */

const PALETTE = ["#2d70f5","#3ec46d","#f2c744","#f08a35","#c07cf5","#f27a9b","#e2564d","#48c7d0"];

function borne(v, min, max){ return v < min ? min : (v > max ? max : v); }

function arrondi(v, d){
  if (!isFinite(v)) return 0;
  const p = Math.pow(10, d === undefined ? 4 : d);
  const r = Math.round(v * p) / p;
  return Object.is(r, -0) ? 0 : r;
}

// Arrondi à un nombre de chiffres significatifs : garde la précision des
// petits coefficients (0.00057) sans traîner 12 décimales sur les grands.
function net(v, sig){
  if (!isFinite(v)) return 0;
  if (Math.abs(v) < 1e-9) return 0;     // résidu de calcul flottant, pas un vrai nombre
  const r = Number(v.toPrecision(sig || 6));
  return Object.is(r, -0) ? 0 : r;
}

// Nombre écrit pour être relu : jamais de notation scientifique,
// Desmos ne comprend pas « 1e-7 ».
function nb(v, sig){
  const r = net(v, sig);
  if (r === 0) return "0";
  const t = String(r);
  if (t.indexOf("e") < 0 && t.indexOf("E") < 0) return t;
  const abs = Math.abs(r);
  if (abs >= 1e20) return String(Math.round(r/1e6)*1e6).replace(/e.*$/, "");
  let d = r.toFixed(20).replace(/0+$/, "").replace(/\.$/, "");
  return d === "-0" ? "0" : d;
}

// "sans accents, en minuscules" pour comparer les mots
function normaliser(txt){
  return String(txt).toLowerCase()
    .normalize("NFD").replace(/[̀-ͯ]/g, "")
    .replace(/[^a-z0-9 ]+/g, " ")
    .replace(/\s+/g, " ").trim();
}

function distanceCouleur(a, b){
  const dr = a[0]-b[0], dg = a[1]-b[1], db = a[2]-b[2];
  return dr*dr + dg*dg + db*db;
}

function rgbHex(c){
  const h = v => borne(Math.round(v),0,255).toString(16).padStart(2,"0");
  return "#" + h(c[0]) + h(c[1]) + h(c[2]);
}

// Une couleur trop sombre disparaît sur fond noir : on l'éclaircit un peu.
function lisibleSurFonce(c){
  const lum = 0.2126*c[0] + 0.7152*c[1] + 0.0722*c[2];
  if (lum >= 70) return c.slice();
  const k = 70 / Math.max(lum, 6);
  return [borne(c[0]*k + 30, 0, 255), borne(c[1]*k + 30, 0, 255), borne(c[2]*k + 30, 0, 255)];
}

/* ---------- 2. Familles de courbes ------------------------------------
   Une courbe garde SES PARAMÈTRES, jamais un texte figé : on peut donc la
   déplacer, l'agrandir, la retourner, et n'écrire l'équation qu'à la fin.
     { fam, p, axe, dom, col }
   axe "x" : y = f(x), le domaine porte sur x.
   axe "y" : x = f(y), le domaine porte sur y (morceaux verticaux).
------------------------------------------------------------------------ */

const FAMILLES = {
  // y = a t + b
  droite: {
    ev: (p,t) => p.a*t + p.b,
    ecrire: (p,v,st) => p.a === 0 ? nb(p.b) : coef(st, p.a) + v + terme(st, p.b)
  },
  // y = a (t - h)^2 + k   (sommet visible : la forme la plus lisible)
  parabole: {
    ev: (p,t) => p.a*(t-p.h)*(t-p.h) + p.k,
    ecrire: (p,v,st) => coef(st, p.a) + st.car(dedans(st, v, p.h)) + terme(st, p.k)
  },
  // y = a u^2 + b u + c  avec u = t - x0   (sommet lointain : forme développée,
  // recentrée sur le morceau pour que les coefficients restent petits et exacts)
  parabole2: {
    ev: (p,t) => { const u = t - p.x0; return p.a*u*u + p.b*u + p.c; },
    ecrire: (p,v,st) => {
      const u = p.x0 === 0 ? v : dedans(st, v, p.x0);
      let s = coef(st, p.a) + st.car(u);
      if (p.b > 0) s += st.plus + (p.b === 1 ? "" : nb(p.b)) + u;
      else if (p.b < 0) s += st.moins + (p.b === -1 ? "" : nb(-p.b)) + u;
      return s + terme(st, p.c);
    }
  },
  // y = k + s sqrt(r^2 - (t - h)^2)
  arc: {
    ev: (p,t) => {
      const d = p.r*p.r - (t-p.h)*(t-p.h);
      return d < 0 ? NaN : p.k + p.s*Math.sqrt(d);
    },
    ecrire: (p,v,st) => {
      const rac = st.rac(nb(p.r*p.r) + st.moins + st.car(dedans(st, v, p.h)));
      if (p.k === 0) return (p.s >= 0 ? "" : "-") + rac;
      return nb(p.k) + (p.s >= 0 ? st.plus : st.moins) + rac;
    }
  },
  // y = k + s ry sqrt(1 - ((t - h)/rx)^2)
  ellipse: {
    ev: (p,t) => {
      const u = (t-p.h)/p.rx;
      const d = 1 - u*u;
      return d < 0 ? NaN : p.k + p.s*p.ry*Math.sqrt(d);
    },
    ecrire: (p,v,st) => {
      const q = st.car(st.quotient(v + signeNb(st, -p.h), nb(p.rx)));
      const corps = (net(p.ry) === 1 ? "" : nb(p.ry) + st.mul) + st.rac("1" + st.moins + q);
      if (p.k === 0) return (p.s >= 0 ? "" : "-") + corps;
      return nb(p.k) + (p.s >= 0 ? st.plus : st.moins) + corps;
    }
  },
  // y = a |t - h| + k
  absolue: {
    ev: (p,t) => p.a*Math.abs(t-p.h) + p.k,
    ecrire: (p,v,st) => coefFonction(st, p.a) + st.val(v + signeNb(st, -p.h)) + terme(st, p.k)
  },
  // y = A sin(w (t - ph)) + k
  sinus: {
    ev: (p,t) => p.A*Math.sin(p.w*(t-p.ph)) + p.k,
    ecrire: (p,v,st) => {
      const arg = (net(p.w) === 1 ? "" : nb(p.w)) + (p.ph === 0 ? v : dedans(st, v, p.ph));
      return coefFonction(st, p.A) + st.fon("sin", arg) + terme(st, p.k);
    }
  },
  // y = a e^(b (t - h)) + k
  expo: {
    ev: (p,t) => p.a*Math.exp(p.b*(t-p.h)) + p.k,
    ecrire: (p,v,st) => {
      const arg = (net(p.b) === 1 ? "" : nb(p.b)) + (p.h === 0 ? v : dedans(st, v, p.h));
      return coefFonction(st, p.a) + st.exp(arg) + terme(st, p.k);
    }
  },
  // cercle entier : (x - h)^2 + (y - k)^2 = r^2
  cercle: { ev: null, ecrire: null },
  // droite horizontale ou verticale : t = c
  constante: { ev: (p) => p.c, ecrire: (p) => nb(p.c) }
};

/* --- Écriture des équations : trois styles, un seul jeu de formules ---
   "uni"   : joli, pour le panneau (≤ √ ²)
   "texte" : ASCII tapable à la main
   "latex" : exactement ce que Desmos met dans le presse-papier quand on
             copie une expression — le seul format qu'il relit sans erreur. */
const STYLES = {
  uni: {
    mul: "",
    plus: " + ", moins: " - ", eg: " = ", inf: " ≤ ",
    par: s => "(" + s + ")",
    car: s => s + "²",
    rac: s => "√(" + s + ")",
    val: s => "|" + s + "|",
    fon: (f, s) => f + "(" + s + ")",
    exp: s => "e^(" + s + ")",
    quotient: (a, b) => "(" + (/[-+*\/]/.test(a) ? "(" + a + ")" : a) + "/" + b + ")",
    acc: s => " {" + s + "}"
  },
  texte: {
    mul: "*",
    plus: "+", moins: "-", eg: "=", inf: "<=",
    par: s => "(" + s + ")",
    car: s => s + "^2",
    rac: s => "sqrt(" + s + ")",
    val: s => "abs(" + s + ")",
    fon: (f, s) => f + "(" + s + ")",
    exp: s => "e^(" + s + ")",
    quotient: (a, b) => "(" + (/[-+*\/]/.test(a) ? "(" + a + ")" : a) + "/" + b + ")",
    acc: s => "{" + s + "}"
  },
  latex: {
    mul: "",
    plus: "+", moins: "-", eg: "=", inf: "\\le ",
    par: s => "\\left(" + s + "\\right)",
    car: s => s + "^{2}",
    rac: s => "\\sqrt{" + s + "}",
    val: s => "\\left|" + s + "\\right|",
    fon: (f, s) => "\\" + f + "\\left(" + s + "\\right)",
    exp: s => "e^{" + s + "}",
    quotient: (a, b) => "\\left(\\frac{" + a + "}{" + b + "}\\right)",
    acc: s => "\\left\\{" + s + "\\right\\}"
  }
};

function coef(st, a){            // le nombre devant : 1 et -1 ne s'écrivent pas
  const n = net(a);
  return n === 1 ? "" : (n === -1 ? "-" : nb(n));
}
// Devant une fonction (sqrt, sin, |…|), le style ASCII écrit le × en clair :
// « 2.8*sqrt(...) » ne peut pas se lire comme un produit de lettres s·q·r·t.
function coefFonction(st, a){
  const c = coef(st, a);
  return (c === "" || c === "-") ? c : c + st.mul;
}
function terme(st, v){           // le « + 4 » ou « - 4 » de la fin
  const n = net(v);
  if (n > 0) return st.plus + nb(n);
  if (n < 0) return st.moins + nb(-n);
  return "";
}
function signeNb(st, v){         // « - 3 » collé derrière une variable
  const n = net(v);
  if (n > 0) return st.plus + nb(n);
  if (n < 0) return st.moins + nb(-n);
  return "";
}
function dedans(st, v, h){       // (x - h), ou x tout seul si h vaut 0
  return net(h) === 0 ? v : st.par(v + signeNb(st, -h));
}

function courbe(fam, p, axe, dom, col){
  return { fam: fam, p: p, axe: axe || "x", dom: [dom[0], dom[1]], col: col || PALETTE[0] };
}

function evaluer(c, t){
  const f = FAMILLES[c.fam];
  return f && f.ev ? f.ev(c.p, t) : NaN;
}

function pointCourbe(c, t){
  const v = evaluer(c, t);
  return c.axe === "x" ? [t, v] : [v, t];
}

// Les paramètres écrits sont EXACTEMENT ceux qui servent au tracé :
// on les arrondit une fois pour toutes, sinon l'équation et la courbe
// affichée ne racontent pas la même chose.
function normaliserCourbe(c){
  const p = {};
  for (const k in c.p) p[k] = typeof c.p[k] === "number" ? net(c.p[k], 6) : c.p[k];
  const d = [net(c.dom[0], 6), net(c.dom[1], 6)];
  return { fam: c.fam, p: p, axe: c.axe, dom: [Math.min(d[0],d[1]), Math.max(d[0],d[1])], col: c.col, part: c.part };
}

// Une courbe qu'on ne saurait ni tracer ni écrire proprement
function courbeValide(c){
  if (!c || !FAMILLES[c.fam]) return false;
  for (const k in c.p){
    const v = c.p[k];
    if (typeof v === "number" && (!isFinite(v) || Math.abs(v) > 1e6)) return false;
  }
  if (!isFinite(c.dom[0]) || !isFinite(c.dom[1])) return false;
  if ((c.fam === "arc" || c.fam === "cercle") && !(c.p.r > 0 && c.p.r < 5000)) return false;
  if (c.fam === "ellipse" && !(c.p.rx > 0 && c.p.rx < 5000 && c.p.ry !== 0)) return false;
  if (c.fam === "cercle") return true;
  return Math.abs(c.dom[1] - c.dom[0]) > 1e-6;
}

function texteEquation(c, style){
  const st = STYLES[style] || STYLES.uni;
  const v = c.axe === "x" ? "x" : "y";
  const sortie = c.axe === "x" ? "y" : "x";
  const d0 = nb(Math.min(c.dom[0], c.dom[1])), d1 = nb(Math.max(c.dom[0], c.dom[1]));
  const dom = st.acc(d0 + st.inf + v + st.inf + d1);

  if (c.fam === "cercle"){
    return st.car(dedans(st, "x", c.p.h)) + st.plus + st.car(dedans(st, "y", c.p.k)) +
           st.eg + nb(c.p.r*c.p.r);
  }
  if (c.fam === "constante") return sortie + st.eg + nb(c.p.c) + dom;
  return sortie + st.eg + FAMILLES[c.fam].ecrire(c.p, v, st) + dom;
}

/* --- Relecture des équations -----------------------------------------
   Un petit analyseur du LaTeX que Funcora produit : chaque équation
   exportée est relue puis recalculée, et si elle ne redonne pas la courbe
   tracée, elle n'est pas proposée. Desmos lit exactement ce sous-ensemble
   (\sqrt{}, \frac{}{}, \left \right, ^{}, \sin, \left| \right|, e^{}).  */
function lireExpression(src){
  const t = src.replace(/\\left/g, "").replace(/\\right/g, "").replace(/\s+/g, "");
  let i = 0, dansValeur = 0;
  const fini = () => i >= t.length;
  function attendre(c){ if (t[i] !== c) throw new Error("attendu « " + c + " » en " + i); i++; }
  function debutFacteur(){
    if (fini()) return false;
    const c = t[i];
    if (c === "|") return dansValeur === 0;
    return /[0-9.a-z(\\]/.test(c);
  }
  function motLettres(){
    const d = i;
    while (!fini() && /[a-z]/.test(t[i])) i++;
    return t.slice(d, i);
  }
  function nombre(){
    const d = i;
    while (!fini() && /[0-9.]/.test(t[i])) i++;
    const v = parseFloat(t.slice(d, i));
    if (!isFinite(v)) throw new Error("nombre illisible");
    return () => v;
  }
  function groupe(){ attendre("{"); const e = expression(); attendre("}"); return e; }
  function primaire(){
    if (fini()) throw new Error("fin inattendue");
    const c = t[i];
    if (c === "("){ i++; const e = expression(); attendre(")"); return e; }
    if (c === "|"){ i++; dansValeur++; const e = expression(); dansValeur--; attendre("|"); return (x,y) => Math.abs(e(x,y)); }
    if (c === "\\"){
      if (t.startsWith("\\sqrt", i)){ i += 5; const e = groupe(); return (x,y) => Math.sqrt(e(x,y)); }
      if (t.startsWith("\\frac", i)){ i += 5; const a = groupe(), b = groupe(); return (x,y) => a(x,y)/b(x,y); }
      if (t.startsWith("\\sin", i)){ i += 4; const e = primaire(); return (x,y) => Math.sin(e(x,y)); }
      if (t.startsWith("\\cos", i)){ i += 4; const e = primaire(); return (x,y) => Math.cos(e(x,y)); }
      throw new Error("commande inconnue : " + t.slice(i, i+6));
    }
    if (/[a-z]/.test(c)){
      const mot = motLettres();
      if (mot === "x") return (x) => x;
      if (mot === "y") return (x,y) => y;
      if (mot === "e"){
        if (t[i] === "^"){ i++; const e = t[i] === "{" ? groupe() : primaire(); return (x,y) => Math.exp(e(x,y)); }
        return () => Math.E;
      }
      if (mot === "sqrt"){ const e = primaire(); return (x,y) => Math.sqrt(e(x,y)); }
      if (mot === "abs"){ const e = primaire(); return (x,y) => Math.abs(e(x,y)); }
      if (mot === "sin"){ const e = primaire(); return (x,y) => Math.sin(e(x,y)); }
      if (mot === "cos"){ const e = primaire(); return (x,y) => Math.cos(e(x,y)); }
      throw new Error("nom inconnu : " + mot);
    }
    if (/[0-9.]/.test(c)) return nombre();
    throw new Error("caractère inattendu : " + c);
  }
  function puissance(){
    let base = primaire();
    while (!fini() && t[i] === "^"){
      i++;
      const e = t[i] === "{" ? groupe() : primaire();
      const b = base;
      base = (x,y) => Math.pow(b(x,y), e(x,y));
    }
    return base;
  }
  function facteur(){
    if (!fini() && t[i] === "-"){ i++; const e = facteur(); return (x,y) => -e(x,y); }
    if (!fini() && t[i] === "+"){ i++; return facteur(); }
    return puissance();
  }
  function produit(){
    let a = facteur();
    for (;;){
      if (!fini() && (t[i] === "*" || t[i] === "/")){
        const op = t[i]; i++;
        const b = facteur(), g = a;
        a = op === "*" ? ((x,y) => g(x,y)*b(x,y)) : ((x,y) => g(x,y)/b(x,y));
        continue;
      }
      if (debutFacteur()){                     // multiplication implicite : 2x, 0.4\sin(...)
        const b = facteur(), g = a;
        a = (x,y) => g(x,y)*b(x,y);
        continue;
      }
      break;
    }
    return a;
  }
  function expression(){
    let a = produit();
    while (!fini() && (t[i] === "+" || t[i] === "-")){
      const op = t[i]; i++;
      const b = produit(), g = a;
      a = op === "+" ? ((x,y) => g(x,y)+b(x,y)) : ((x,y) => g(x,y)-b(x,y));
    }
    return a;
  }
  const f = expression();
  if (!fini()) throw new Error("morceau non lu : " + t.slice(i));
  return f;
}

function relireEquation(texte){
  // la restriction est en fin d'équation : \left\{a\le x\le b\right\} ou {a<=x<=b}
  let corps = texte, dom = null;
  const mL = texte.match(/\\left\\\{(.*)\\right\\\}$/);
  const mA = texte.match(/\{([^{}]*)\}$/);
  const dedansAcc = mL ? mL[1] : (mA && /<=/.test(mA[1]) ? mA[1] : null);
  if (dedansAcc !== null){
    corps = texte.slice(0, texte.length - (mL ? mL[0].length : mA[0].length));
    const morceaux = dedansAcc.split(mL ? "\\le" : "<=");
    if (morceaux.length !== 3) throw new Error("restriction illisible");
    dom = [parseFloat(morceaux[0]), parseFloat(morceaux[2])];
    if (!isFinite(dom[0]) || !isFinite(dom[1])) throw new Error("bornes illisibles");
  }
  const iEg = corps.indexOf("=");
  if (iEg < 0) throw new Error("il manque le =");
  const g = corps.slice(0, iEg), d = corps.slice(iEg + 1);
  return {
    gauche: lireExpression(g), droite: lireExpression(d),
    simple: (g === "y" || g === "x") ? g : null, dom: dom
  };
}

// Relit l'équation d'une courbe et vérifie qu'elle redonne bien la courbe tracée
function verifierCourbe(c, style){
  const txt = texteEquation(c, style || "latex");
  try {
    const eq = relireEquation(txt);
    let ecart = 0;
    if (eq.simple){
      if (!eq.dom) throw new Error("domaine manquant");
      for (let i = 0; i < 12; i++){
        const t = c.dom[0] + (c.dom[1] - c.dom[0])*(i + 0.5)/12;
        const attendu = evaluer(c, t);
        if (!isFinite(attendu)) continue;
        const obtenu = eq.simple === "y" ? eq.droite(t, 0) : eq.droite(0, t);
        if (!isFinite(obtenu)) throw new Error("valeur impossible");
        ecart = Math.max(ecart, Math.abs(attendu - obtenu));
      }
      ecart = Math.max(ecart, Math.abs(eq.dom[0] - c.dom[0]), Math.abs(eq.dom[1] - c.dom[1]));
    } else {
      for (const q of echantillonsCourbe(c, 12)){
        if (!q) continue;
        const g = eq.gauche(q[0], q[1]), d = eq.droite(q[0], q[1]);
        if (!isFinite(g) || !isFinite(d)) throw new Error("valeur impossible");
        ecart = Math.max(ecart, Math.abs(Math.sqrt(Math.max(g,0)) - Math.sqrt(Math.max(d,0))));
      }
    }
    return { ok: ecart < 1e-3, ecart: ecart, txt: txt };
  } catch (e){
    return { ok: false, ecart: Infinity, txt: txt, raison: e.message };
  }
}

/* ---------- 3. Transformations ---------------------------------------
   Elles agissent sur les PARAMÈTRES, pour que les équations restent
   propres après un déplacement ou un agrandissement.
------------------------------------------------------------------------ */

// Décale l'entrée : f(t) devient f(t - d)
function decalerEntree(c, d){
  const p = Object.assign({}, c.p);
  switch (c.fam){
    case "droite":  p.b = p.b - p.a*d; break;
    case "parabole2": p.x0 = p.x0 + d; break;
    case "parabole": case "absolue": p.h = p.h + d; break;
    case "arc": case "ellipse": p.h = p.h + d; break;
    case "sinus": p.ph = p.ph + d; break;
    case "expo": p.h = p.h + d; break;
    case "constante": break;
  }
  return { fam: c.fam, p: p, axe: c.axe, dom: [c.dom[0]+d, c.dom[1]+d], col: c.col };
}

// Décale la sortie : f(t) devient f(t) + d
function decalerSortie(c, d){
  const p = Object.assign({}, c.p);
  switch (c.fam){
    case "droite": p.b += d; break;
    case "parabole2": p.c += d; break;
    case "parabole": case "absolue": case "arc": case "ellipse": case "sinus": case "expo":
      p.k += d; break;
    case "constante": p.c += d; break;
  }
  return { fam: c.fam, p: p, axe: c.axe, dom: c.dom.slice(), col: c.col };
}

// Inverse la sortie : f(t) devient -f(t)
function opposerSortie(c){
  const p = Object.assign({}, c.p);
  switch (c.fam){
    case "droite": p.a = -p.a; p.b = -p.b; break;
    case "parabole2": p.a = -p.a; p.b = -p.b; p.c = -p.c; break;
    case "parabole": case "absolue": p.a = -p.a; p.k = -p.k; break;
    case "arc": case "ellipse": p.k = -p.k; p.s = -p.s; break;
    case "sinus": p.A = -p.A; p.k = -p.k; break;
    case "expo": p.a = -p.a; p.k = -p.k; break;
    case "constante": p.c = -p.c; break;
  }
  return { fam: c.fam, p: p, axe: c.axe, dom: c.dom.slice(), col: c.col };
}

// Inverse l'entrée : f(t) devient f(-t)
function opposerEntree(c){
  const p = Object.assign({}, c.p);
  switch (c.fam){
    case "droite": p.a = -p.a; break;
    case "parabole2": p.x0 = -p.x0; p.b = -p.b; break;
    case "parabole": case "absolue": p.h = -p.h; break;
    case "arc": case "ellipse": p.h = -p.h; break;
    case "sinus": p.A = -p.A; p.ph = -p.ph; break;
    case "expo": p.b = -p.b; p.h = -p.h; break;
    case "constante": break;
  }
  return { fam: c.fam, p: p, axe: c.axe, dom: [-c.dom[1], -c.dom[0]], col: c.col };
}

function agrandir(c, s){
  if (c.fam === "cercle"){
    return { fam:"cercle", p:{h:c.p.h*s, k:c.p.k*s, r:c.p.r*s}, axe:c.axe, dom:[c.dom[0]*s, c.dom[1]*s], col:c.col };
  }
  const p = Object.assign({}, c.p);
  switch (c.fam){
    case "droite": p.b *= s; break;
    case "parabole2": p.a = p.a/s; p.c *= s; p.x0 *= s; break;
    case "parabole": p.a = p.a/s; p.h *= s; p.k *= s; break;
    case "absolue": p.h *= s; p.k *= s; break;
    case "arc": p.h *= s; p.k *= s; p.r *= s; break;
    case "ellipse": p.h *= s; p.k *= s; p.rx *= s; p.ry *= s; break;
    case "sinus": p.A *= s; p.w = p.w/s; p.ph *= s; p.k *= s; break;
    case "expo": p.a *= s; p.b = p.b/s; p.h *= s; p.k *= s; break;
    case "constante": p.c *= s; break;
  }
  return { fam: c.fam, p: p, axe: c.axe, dom: [c.dom[0]*s, c.dom[1]*s], col: c.col };
}

function deplacer(c, dx, dy){
  if (c.fam === "cercle"){
    return { fam:"cercle", p:{h:c.p.h+dx, k:c.p.k+dy, r:c.p.r}, axe:c.axe, dom:c.dom.slice(), col:c.col };
  }
  const dEntree = c.axe === "x" ? dx : dy;
  const dSortie = c.axe === "x" ? dy : dx;
  return decalerSortie(decalerEntree(c, dEntree), dSortie);
}

// Miroir gauche/droite : (x, y) -> (-x, y)
function miroirX(c){
  if (c.fam === "cercle"){
    return { fam:"cercle", p:{h:-c.p.h, k:c.p.k, r:c.p.r}, axe:c.axe, dom:c.dom.slice(), col:c.col };
  }
  return c.axe === "x" ? opposerEntree(c) : opposerSortie(c);
}

// Quart de tour : (x, y) -> (-y, x)
function tourner90(c){
  if (c.fam === "cercle"){
    return { fam:"cercle", p:{h:-c.p.k, k:c.p.h, r:c.p.r}, axe:c.axe, dom:c.dom.slice(), col:c.col };
  }
  const o = opposerSortie(c);
  return { fam:o.fam, p:o.p, axe: c.axe === "x" ? "y" : "x", dom:o.dom.slice(), col:o.col };
}

function transformerListe(liste, t){
  let out = liste;
  if (t.mir)  out = out.map(miroirX);
  if (t.rot){ for (let i = 0; i < ((t.rot % 4) + 4) % 4; i++) out = out.map(tourner90); }
  if (t.s && t.s !== 1) out = out.map(c => agrandir(c, t.s));
  if (t.dx || t.dy) out = out.map(c => deplacer(c, t.dx || 0, t.dy || 0));
  return out;
}

/* ---------- 4. Ajustement : des points -> une équation ---------------- */

// Résout un petit système linéaire (pivot de Gauss). m : n x (n+1).
function resoudre(m){
  const n = m.length;
  for (let i = 0; i < n; i++){
    let piv = i;
    for (let r = i+1; r < n; r++) if (Math.abs(m[r][i]) > Math.abs(m[piv][i])) piv = r;
    if (Math.abs(m[piv][i]) < 1e-12) return null;
    const tmp = m[i]; m[i] = m[piv]; m[piv] = tmp;
    for (let r = 0; r < n; r++){
      if (r === i) continue;
      const f = m[r][i]/m[i][i];
      for (let ccc = i; ccc <= n; ccc++) m[r][ccc] -= f*m[i][ccc];
    }
  }
  const sol = [];
  for (let i = 0; i < n; i++) sol.push(m[i][n]/m[i][i]);
  return sol;
}

// Erreur maximale d'une famille sur le morceau
function erreurMax(ts, vs, f){
  let e = 0;
  for (let i = 0; i < ts.length; i++){
    const d = Math.abs(vs[i] - f(ts[i]));
    if (!isFinite(d)) return Infinity;
    if (d > e) e = d;
  }
  return e;
}

function ajusterDroite(ts, vs){
  const n = ts.length;
  let st = 0, sv = 0, stt = 0, stv = 0;
  for (let i = 0; i < n; i++){ st += ts[i]; sv += vs[i]; stt += ts[i]*ts[i]; stv += ts[i]*vs[i]; }
  const den = n*stt - st*st;
  if (Math.abs(den) < 1e-12) return null;
  const a = (n*stv - st*sv)/den;
  const b = (sv - a*st)/n;
  return { a: a, b: b };
}

// Ajustement recentré sur le morceau (u = t - x0) : les coefficients restent
// petits, donc justes une fois arrondis — c'est ce que Desmos relira.
function ajusterParabole(ts, vs){
  const n = ts.length;
  const x0 = arrondi((ts[0] + ts[n-1])/2, 3);
  let s = [0,0,0,0,0], sv = [0,0,0];
  for (let i = 0; i < n; i++){
    const u = ts[i] - x0, v = vs[i];
    const u2 = u*u;
    s[0] += 1; s[1] += u; s[2] += u2; s[3] += u2*u; s[4] += u2*u2;
    sv[0] += v; sv[1] += v*u; sv[2] += v*u2;
  }
  const sol = resoudre([
    [s[2], s[1], s[0], sv[0]],
    [s[3], s[2], s[1], sv[1]],
    [s[4], s[3], s[2], sv[2]]
  ]);
  if (!sol) return null;
  const A = sol[0], B = sol[1], C = sol[2];        // v = A u^2 + B u + C
  if (Math.abs(A) < 1e-9) return null;
  const du = -B/(2*A);
  return { A: A, B: B, C: C, x0: x0, h: x0 + du, k: C - A*du*du };
}

// Cercle par moindres carrés (méthode de Kåsa)
function ajusterCercle(ts, vs){
  const n = ts.length;
  let stt = 0, svv = 0, stv = 0, st = 0, sv = 0, sq = 0, sqt = 0, sqv = 0;
  for (let i = 0; i < n; i++){
    const t = ts[i], v = vs[i], q = t*t + v*v;
    stt += t*t; svv += v*v; stv += t*v; st += t; sv += v;
    sq += q; sqt += q*t; sqv += q*v;
  }
  const sol = resoudre([
    [stt, stv, st, sqt],
    [stv, svv, sv, sqv],
    [st,  sv,  n,  sq]
  ]);
  if (!sol) return null;
  const h = sol[0]/2, k = sol[1]/2;
  const r2 = sol[2] + h*h + k*k;
  if (!(r2 > 0)) return null;
  return { h: h, k: k, r: Math.sqrt(r2) };
}

// Le morceau est-il bien une fonction de t (t qui avance toujours) ?
function monotone(ts){
  const n = ts.length;
  if (n < 3) return true;
  const total = ts[n-1] - ts[0];
  if (Math.abs(total) < 1e-9) return false;
  const sens = Math.sign(total);
  const pas = Math.abs(total)/(n-1)*0.35;
  for (let i = 1; i < n; i++){
    const d = (ts[i] - ts[i-1])*sens;
    if (d < -pas) return false;
  }
  return true;
}

// Coeur du vectoriseur : trouve la plus simple équation qui colle au morceau.
function ajusterMorceau(pts, tol){
  const n = pts.length;
  if (n < 2) return null;
  let xmin = Infinity, xmax = -Infinity, ymin = Infinity, ymax = -Infinity;
  for (let i = 0; i < n; i++){
    const p = pts[i];
    if (p[0] < xmin) xmin = p[0]; if (p[0] > xmax) xmax = p[0];
    if (p[1] < ymin) ymin = p[1]; if (p[1] > ymax) ymax = p[1];
  }
  const axe = (xmax - xmin) >= (ymax - ymin) ? "x" : "y";
  const ts = [], vs = [];
  for (let i = 0; i < n; i++){
    ts.push(axe === "x" ? pts[i][0] : pts[i][1]);
    vs.push(axe === "x" ? pts[i][1] : pts[i][0]);
  }
  if (!monotone(ts)) return null;
  const dom = [Math.min(ts[0], ts[n-1]), Math.max(ts[0], ts[n-1])];
  if (dom[1] - dom[0] < 1e-9) return null;

  // 1) une droite ?
  const dr = ajusterDroite(ts, vs);
  if (dr && erreurMax(ts, vs, t => dr.a*t + dr.b) <= tol){
    if (Math.abs(dr.a) < 1e-6) return courbe("constante", {c: arrondi(dr.b)}, axe, dom);
    return courbe("droite", dr, axe, dom);
  }
  if (n < 5) return dr ? courbe("droite", dr, axe, dom) : null;

  // 2) un arc de cercle ?
  const ce = ajusterCercle(ts, vs);
  if (ce && isFinite(ce.r) && ce.r < (dom[1]-dom[0])*25){
    const milieu = vs[Math.floor(n/2)];
    const s = milieu >= ce.k ? 1 : -1;
    const p = { h: ce.h, k: ce.k, r: ce.r, s: s };
    let bon = true;
    for (let i = 0; i < n; i++){
      if (Math.abs(ts[i] - ce.h) > ce.r*0.999){ bon = false; break; }
      if ((vs[i] - ce.k)*s < -tol){ bon = false; break; }
    }
    if (bon && erreurMax(ts, vs, t => FAMILLES.arc.ev(p, t)) <= tol)
      return courbe("arc", p, axe, dom);
  }

  // 3) une parabole ?
  const pa = ajusterParabole(ts, vs);
  if (pa){
    const p2 = { a: pa.A, b: pa.B, c: pa.C, x0: pa.x0 };
    if (erreurMax(ts, vs, t => FAMILLES.parabole2.ev(p2, t)) <= tol){
      const span = dom[1] - dom[0];
      // sommet dans le morceau (ou juste à côté) : forme sommet, plus lisible
      if (isFinite(pa.h) && pa.h > dom[0] - span && pa.h < dom[1] + span && Math.abs(pa.h) < 1e3)
        return courbe("parabole", { a: pa.A, h: pa.h, k: pa.k }, axe, dom);
      return courbe("parabole2", p2, axe, dom);
    }
  }

  return null;
}

/* Les vrais coins du dessin : un virage serré ne doit jamais être avalé
   par un ajustement, sinon les toits et les étoiles s'arrondissent.   */
function indicesCoins(pts, seuil, f){
  const n = pts.length, out = [];
  if (n < 2*f + 3) return out;
  for (let i = f; i < n - f; i++){
    const ax = pts[i][0]-pts[i-f][0], ay = pts[i][1]-pts[i-f][1];
    const bx = pts[i+f][0]-pts[i][0], by = pts[i+f][1]-pts[i][1];
    if ((ax*ax+ay*ay) < 1e-12 || (bx*bx+by*by) < 1e-12) continue;
    const ang = Math.abs(Math.atan2(ax*by - ay*bx, ax*bx + ay*by));
    if (ang > seuil){ out.push(i); i += f - 1; }
  }
  return out;
}

function fusionnerIndices(a, b){
  const vus = new Set();
  const out = [];
  for (const liste of [a, b]) for (const i of liste) if (!vus.has(i)){ vus.add(i); out.push(i); }
  out.sort((x, y) => x - y);
  return out;
}

/* Découpe une polyligne en morceaux et donne la liste des courbes.
   On part des sommets « importants » (Douglas-Peucker) plus les coins,
   et on essaie d'aller le plus loin possible avec une seule équation. */
function polyligneVersCourbes(pts, tol){
  // La fenêtre de détection des coins suit la tolérance : en dessin grossier,
  // seuls les virages vraiment francs comptent.
  let somme = 0;
  for (let i = 1; i < pts.length; i++) somme += Math.hypot(pts[i][0]-pts[i-1][0], pts[i][1]-pts[i-1][1]);
  const pas = somme/Math.max(pts.length - 1, 1);
  const fenetre = borne(Math.round(tol/Math.max(pas, 1e-9)), 3, 40);
  const anc = fusionnerIndices(indicesDouglasPeucker(pts, tol), indicesCoins(pts, 0.62, fenetre));
  const out = [];
  let i = 0;
  let garde = 0;
  while (i < anc.length - 1 && garde++ < 20000){
    let meilleur = null, meilleurJ = i + 1;
    for (let j = i + 1; j < anc.length; j++){
      const morceau = pts.slice(anc[i], anc[j] + 1);
      if (morceau.length > 600) break;
      const c = ajusterMorceau(morceau, tol);
      if (!c){ if (j > i + 1) break; else continue; }
      meilleur = c; meilleurJ = j;
    }
    if (!meilleur){
      const a = pts[anc[i]], b = pts[anc[i+1]];
      meilleur = droiteEntre(a, b);
      meilleurJ = i + 1;
    }
    if (meilleur) out.push(meilleur);
    i = meilleurJ;
  }
  return out;
}

function droiteEntre(a, b){
  const dx = b[0]-a[0], dy = b[1]-a[1];
  if (Math.abs(dx) < 1e-9 && Math.abs(dy) < 1e-9) return null;
  if (Math.abs(dx) >= Math.abs(dy)){
    const p = { a: dy/dx, b: a[1] - (dy/dx)*a[0] };
    return courbe("droite", p, "x", [Math.min(a[0],b[0]), Math.max(a[0],b[0])]);
  }
  if (Math.abs(dx) < 1e-9)
    return courbe("constante", {c: arrondi(a[0])}, "y", [Math.min(a[1],b[1]), Math.max(a[1],b[1])]);
  const p = { a: dx/dy, b: a[0] - (dx/dy)*a[1] };
  return courbe("droite", p, "y", [Math.min(a[1],b[1]), Math.max(a[1],b[1])]);
}

// Douglas-Peucker : garde les sommets qui comptent, renvoie leurs indices
function indicesDouglasPeucker(pts, tol){
  const n = pts.length;
  if (n <= 2) return pts.map((_, i) => i);
  const garder = new Uint8Array(n);
  garder[0] = 1; garder[n-1] = 1;
  const pile = [[0, n-1]];
  while (pile.length){
    const [d, f] = pile.pop();
    if (f - d < 2) continue;
    const ax = pts[d][0], ay = pts[d][1], bx = pts[f][0], by = pts[f][1];
    const vx = bx-ax, vy = by-ay;
    const long = Math.hypot(vx, vy);
    let pire = -1, idx = -1;
    for (let i = d+1; i < f; i++){
      const px = pts[i][0]-ax, py = pts[i][1]-ay;
      const dist = long < 1e-12 ? Math.hypot(px, py) : Math.abs(px*vy - py*vx)/long;
      if (dist > pire){ pire = dist; idx = i; }
    }
    if (pire > tol && idx > 0){
      garder[idx] = 1;
      pile.push([d, idx]); pile.push([idx, f]);
    }
  }
  const out = [];
  for (let i = 0; i < n; i++) if (garder[i]) out.push(i);
  return out;
}

/* ---------- 5. Contours : des pixels -> des polygones -----------------
   Marching squares : on parcourt les cases entre pixels, on note les
   petits segments de frontière, puis on les recolle en boucles.
------------------------------------------------------------------------ */

function extraireContours(masque, w, h, boite){
  const val = (x, y) => (x < 0 || y < 0 || x >= w || y >= h) ? 0 : masque[y*w + x];
  const segs = [];
  const T = (x,y) => [x+0.5, y], R = (x,y) => [x+1, y+0.5],
        B = (x,y) => [x+0.5, y+1], L = (x,y) => [x, y+0.5];
  // un calque n'occupe souvent qu'un coin de l'image : inutile de balayer le reste
  const x0 = boite ? Math.max(-1, boite[0]-1) : -1, y0 = boite ? Math.max(-1, boite[1]-1) : -1;
  const x1 = boite ? Math.min(w, boite[2]+1) : w,   y1 = boite ? Math.min(h, boite[3]+1) : h;
  for (let y = y0; y < y1; y++){
    for (let x = x0; x < x1; x++){
      const a = val(x,y), b = val(x+1,y), c = val(x+1,y+1), d = val(x,y+1);
      const code = a*8 + b*4 + c*2 + d;
      if (code === 0 || code === 15) continue;
      switch (code){
        case 1:  segs.push([L(x,y), B(x,y)]); break;
        case 2:  segs.push([B(x,y), R(x,y)]); break;
        case 3:  segs.push([L(x,y), R(x,y)]); break;
        case 4:  segs.push([T(x,y), R(x,y)]); break;
        case 5:  segs.push([L(x,y), T(x,y)]); segs.push([B(x,y), R(x,y)]); break;
        case 6:  segs.push([T(x,y), B(x,y)]); break;
        case 7:  segs.push([L(x,y), T(x,y)]); break;
        case 8:  segs.push([T(x,y), L(x,y)]); break;
        case 9:  segs.push([T(x,y), B(x,y)]); break;
        case 10: segs.push([T(x,y), R(x,y)]); segs.push([B(x,y), L(x,y)]); break;
        case 11: segs.push([T(x,y), R(x,y)]); break;
        case 12: segs.push([L(x,y), R(x,y)]); break;
        case 13: segs.push([B(x,y), R(x,y)]); break;
        case 14: segs.push([L(x,y), B(x,y)]); break;
      }
    }
  }
  // Recollage des petits segments en polylignes
  const cle = p => (p[0]*2) + "," + (p[1]*2);
  const adj = new Map();
  segs.forEach((s, i) => {
    for (const k of [cle(s[0]), cle(s[1])]){
      if (!adj.has(k)) adj.set(k, []);
      adj.get(k).push(i);
    }
  });
  const pris = new Uint8Array(segs.length);
  const polys = [];
  for (let i = 0; i < segs.length; i++){
    if (pris[i]) continue;
    pris[i] = 1;
    const poly = [segs[i][0], segs[i][1]];
    // on avance par la fin
    let boucle = false;
    for (let sens = 0; sens < 2; sens++){
      let garde = 0;
      while (garde++ < 100000){
        const bout = sens === 0 ? poly[poly.length-1] : poly[0];
        const liste = adj.get(cle(bout)) || [];
        let suiv = -1;
        for (const j of liste) if (!pris[j]){ suiv = j; break; }
        if (suiv < 0) break;
        pris[suiv] = 1;
        const s = segs[suiv];
        const autre = (cle(s[0]) === cle(bout)) ? s[1] : s[0];
        if (sens === 0) poly.push(autre); else poly.unshift(autre);
        if (cle(autre) === cle(poly[sens === 0 ? 0 : poly.length-1])){ boucle = true; break; }
      }
      if (boucle) break;
    }
    if (poly.length >= 4) polys.push({ pts: poly, ferme: boucle });
  }
  return polys;
}

/* Largeur moyenne d'un contour fermé (aire / demi-périmètre), en pixels.
   Les bandes d'anticrénelage entre deux couleurs sont des rubans de 1 à 2
   pixels : elles ne sont pas des formes, seulement du bruit de rendu. */
function largeurMoyenne(pts){
  let aire = 0, perim = 0;
  for (let i = 0; i < pts.length - 1; i++){
    const a = pts[i], b = pts[i+1];
    aire += a[0]*b[1] - b[0]*a[1];
    perim += Math.hypot(b[0]-a[0], b[1]-a[1]);
  }
  aire = Math.abs(aire)/2;
  return perim < 1e-9 ? 0 : 2*aire/perim;
}

// Adoucit l'escalier des pixels (moyenne glissante)
function lisser(pts, passes, ferme){
  let cur = pts;
  for (let p = 0; p < passes; p++){
    const n = cur.length;
    const out = new Array(n);
    for (let i = 0; i < n; i++){
      let ia = i-1, ib = i+1;
      if (ia < 0) ia = ferme ? n-2 : 0;
      if (ib >= n) ib = ferme ? 1 : n-1;
      out[i] = [(cur[ia][0] + 2*cur[i][0] + cur[ib][0])/4,
                (cur[ia][1] + 2*cur[i][1] + cur[ib][1])/4];
    }
    if (ferme && n > 1) out[n-1] = out[0].slice();
    cur = out;
  }
  return cur;
}

/* ---------- 6. Vectoriseur universel ----------------------------------
   Le navigateur sait déjà dessiner presque tout (emoji, texte, image,
   dessin à la main). Funcora récupère ces pixels et les retransforme en
   équations : c'est ce qui lui permet de tracer n'importe quoi.
------------------------------------------------------------------------ */

const TAILLE_MAX = 1536;
const POLICE_EMOJI = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji","EmojiOne Color","Twemoji Mozilla","Android Emoji",sans-serif';

const CIBLE_MIN = 10, CIBLE_MAX = 1000, COULEURS_MAX = 1000;

// Plus on veut de fonctions, plus l'image de départ doit être fine.
function tailleSource(cible){ return cible > 700 ? 1536 : (cible > 200 ? 1024 : 512); }

function creerCanvas(taille){
  const cv = document.createElement("canvas");
  cv.width = taille; cv.height = taille;
  return cv;
}

function contexteVide(cv){
  const ctx = cv.getContext("2d", { willReadFrequently: true });
  ctx.clearRect(0, 0, cv.width, cv.height);
  return ctx;
}

function dessinerEmoji(ctx, emoji, taille){
  ctx.save();
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillStyle = "#111";
  let px = Math.round(taille*0.74);
  ctx.font = px + "px " + POLICE_EMOJI;
  const l = ctx.measureText(emoji).width;
  if (l > taille*0.92) { px = Math.round(px*taille*0.9/l); ctx.font = px + "px " + POLICE_EMOJI; }
  ctx.fillText(emoji, taille/2, taille/2);
  ctx.restore();
}

function dessinerTexte(ctx, texte, taille){
  ctx.save();
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillStyle = "#111";
  const mots = texte.split(/\s+/).filter(Boolean);
  const lignes = [];
  let ligne = "";
  for (const m of mots){
    const essai = ligne ? ligne + " " + m : m;
    if (essai.length > 9 && ligne){ lignes.push(ligne); ligne = m; } else ligne = essai;
  }
  if (ligne) lignes.push(ligne);
  const plusLong = lignes.reduce((a,b) => a.length >= b.length ? a : b, "");
  let px = Math.round(taille*0.8);
  ctx.font = "bold " + px + 'px Georgia,"Times New Roman",serif';
  const l = Math.max(ctx.measureText(plusLong).width, 1);
  px = Math.min(px, Math.round(px*taille*0.86/l), Math.round(taille*0.9/lignes.length));
  ctx.font = "bold " + px + 'px Georgia,"Times New Roman",serif';
  const h = px*1.12;
  const y0 = taille/2 - (lignes.length-1)*h/2;
  lignes.forEach((t, i) => ctx.fillText(t, taille/2, y0 + i*h));
  ctx.restore();
}

// Les emojis sont-ils vraiment dessinés sur cet appareil ?
let _emojiOk = null;
function emojiDisponible(){
  if (_emojiOk !== null) return _emojiOk;
  try {
    const masque = (txt) => {
      const cv = creerCanvas(64);
      const ctx = contexteVide(cv);
      dessinerEmoji(ctx, txt, 64);
      const d = ctx.getImageData(0,0,64,64).data;
      const m = new Uint8Array(64*64);
      let n = 0;
      for (let i = 0; i < 64*64; i++){ m[i] = d[i*4+3] > 100 ? 1 : 0; n += m[i]; }
      return { m: m, n: n };
    };
    const a = masque("🏠");          // maison
    const b = masque("􏿽");          // caractère inexistant -> carré vide
    if (a.n < 40) { _emojiOk = false; return _emojiOk; }
    let inter = 0, union = 0;
    for (let i = 0; i < a.m.length; i++){
      if (a.m[i] && b.m[i]) inter++;
      if (a.m[i] || b.m[i]) union++;
    }
    _emojiOk = union === 0 ? false : (inter/union) < 0.8;
  } catch (e){ _emojiOk = false; }
  return _emojiOk;
}

/* --- Séparation fond / dessin --- */
function masqueAvantPlan(data, w, h){
  const n = w*h;
  const fg = new Uint8Array(n);
  let transp = 0;
  for (let i = 0; i < n; i++) if (data[i*4+3] < 128) transp++;
  if (transp > n*0.02){
    for (let i = 0; i < n; i++) fg[i] = data[i*4+3] >= 128 ? 1 : 0;
    return fg;
  }
  // Image opaque : le fond est la couleur des bords
  const bords = [];
  for (let x = 0; x < w; x += 4){ bords.push([data[x*4], data[x*4+1], data[x*4+2]]);
    const j = ((h-1)*w + x)*4; bords.push([data[j], data[j+1], data[j+2]]); }
  for (let y = 0; y < h; y += 4){ const a = (y*w)*4, b = (y*w + w-1)*4;
    bords.push([data[a], data[a+1], data[a+2]]); bords.push([data[b], data[b+1], data[b+2]]); }
  const med = k => { const v = bords.map(c => c[k]).sort((p,q) => p-q); return v[Math.floor(v.length/2)] || 0; };
  const fond = [med(0), med(1), med(2)];
  for (let i = 0; i < n; i++){
    const c = [data[i*4], data[i*4+1], data[i*4+2]];
    fg[i] = distanceCouleur(c, fond) > 3200 ? 1 : 0;
  }
  return fg;
}

/* --- Couleurs dominantes (k-moyennes allégé) --- */
function couleursDominantes(data, fg, n, k){
  const ech = [];
  const pas = Math.max(1, Math.floor(n/6000));
  for (let i = 0; i < n; i += pas) if (fg[i]) ech.push([data[i*4], data[i*4+1], data[i*4+2]]);
  if (!ech.length) return [];
  k = Math.min(k, ech.length);
  const cent = [ech[0].slice()];
  while (cent.length < k){                       // init « le plus loin »
    let best = null, bestD = -1;
    for (let i = 0; i < ech.length; i += Math.max(1, Math.floor(ech.length/400))){
      let d = Infinity;
      for (const c of cent) d = Math.min(d, distanceCouleur(ech[i], c));
      if (d > bestD){ bestD = d; best = ech[i]; }
    }
    if (!best) break;
    cent.push(best.slice());
  }
  for (let it = 0; it < 10; it++){
    const som = cent.map(() => [0,0,0,0]);
    for (const p of ech){
      let bi = 0, bd = Infinity;
      for (let i = 0; i < cent.length; i++){ const d = distanceCouleur(p, cent[i]); if (d < bd){ bd = d; bi = i; } }
      som[bi][0] += p[0]; som[bi][1] += p[1]; som[bi][2] += p[2]; som[bi][3]++;
    }
    for (let i = 0; i < cent.length; i++)
      if (som[i][3]) cent[i] = [som[i][0]/som[i][3], som[i][1]/som[i][3], som[i][2]/som[i][3]];
  }
  return cent;
}

/* --- Les calques de couleur ---
   Jusqu'à 16 couleurs : k-moyennes, qui trouve les mieux les teintes
   dominantes. Au-delà (jusqu'à 1000 calques) : histogramme d'un cube RGB,
   la seule méthode qui tienne le coup en temps de calcul. */
function calquesHistogramme(data, fg, n, k, total){
  const cleDe = (r, g, b) => ((r >> 3) << 10) | ((g >> 3) << 5) | (b >> 3);
  const cases = new Map();
  for (let i = 0; i < n; i++){
    if (!fg[i]) continue;
    const r = data[i*4], g = data[i*4+1], b = data[i*4+2];
    const cle = cleDe(r, g, b);
    let e = cases.get(cle);
    if (!e){ e = { n:0, r:0, g:0, b:0, cle:cle }; cases.set(cle, e); }
    e.n++; e.r += r; e.g += g; e.b += b;
  }
  const liste = Array.from(cases.values()).sort((a, b) => b.n - a.n);
  liste.forEach(e => { e.moy = [e.r/e.n, e.g/e.n, e.b/e.n]; });
  const seuil = Math.max(20, total*0.00004);
  const candidats = liste.filter(e => e.n >= seuil);
  const fusion = k <= 64 ? Math.max(0, 520 - k*6) : 0;
  let gardes = [];
  for (const e of candidats){
    if (gardes.length >= k) break;
    if (fusion && gardes.some(g => distanceCouleur(e.moy, g.moy) < fusion)) continue;
    gardes.push(e);
  }
  if (!gardes.length) gardes = liste.slice(0, 1);
  const rang = new Map();
  gardes.forEach((e, j) => rang.set(e.cle, j));
  const vers = new Map();
  for (const e of liste){
    if (rang.has(e.cle)){ vers.set(e.cle, rang.get(e.cle)); continue; }
    let bi = 0, bd = Infinity;
    for (let j = 0; j < gardes.length; j++){
      const d = distanceCouleur(e.moy, gardes[j].moy);
      if (d < bd){ bd = d; bi = j; }
    }
    vers.set(e.cle, bi);
  }
  const larg = Math.round(Math.sqrt(n));
  const masques = gardes.map(e => ({ masque: new Uint8Array(n), couleur: e.moy, taille: 0,
                                     boite: [larg, larg, -1, -1] }));
  for (let i = 0; i < n; i++){
    if (!fg[i]) continue;
    const j = vers.get(cleDe(data[i*4], data[i*4+1], data[i*4+2]));
    if (j === undefined) continue;
    const m = masques[j];
    m.masque[i] = 1; m.taille++;
    etendreBoite(m.boite, i % larg, (i/larg)|0);
  }
  return masques.filter(m => m.taille > 0);
}

function calquesMoyennes(data, fg, n, k, total){
  const brut = couleursDominantes(data, fg, n, k);
  // on fusionne les couleurs trop proches : sinon l'anticrénelage des bords
  // crée de faux calques et chaque trait serait tracé deux ou trois fois.
  const cent = [];
  const fusion = Math.max(0, 2200 - k*80);
  for (const c of brut){
    let proche = false;
    for (const g of cent) if (distanceCouleur(c, g) < fusion){ proche = true; break; }
    if (!proche) cent.push(c);
  }
  const plusProche = (p, liste) => {
    let bi = 0, bd = Infinity;
    for (let j = 0; j < liste.length; j++){ const d = distanceCouleur(p, liste[j]); if (d < bd){ bd = d; bi = j; } }
    return bi;
  };
  const compte = cent.map(() => 0);
  for (let i = 0; i < n; i++){
    if (!fg[i]) continue;
    compte[plusProche([data[i*4], data[i*4+1], data[i*4+2]], cent)]++;
  }
  const seuilCalque = Math.max(total*0.015, 40);
  let gardes = cent.filter((c, j) => compte[j] >= seuilCalque);
  if (!gardes.length){
    let bj = 0;
    for (let j = 1; j < cent.length; j++) if (compte[j] > compte[bj]) bj = j;
    gardes = [cent[bj]];
  }
  const larg = Math.round(Math.sqrt(n));
  const masques = gardes.map(c => ({ masque: new Uint8Array(n), couleur: c, taille: 0,
                                     boite: [larg, larg, -1, -1] }));
  for (let i = 0; i < n; i++){
    if (!fg[i]) continue;
    const bi = plusProche([data[i*4], data[i*4+1], data[i*4+2]], gardes);
    const m = masques[bi];
    m.masque[i] = 1; m.taille++;
    etendreBoite(m.boite, i % larg, (i/larg)|0);
  }
  return masques;
}

function etendreBoite(b, x, y){
  if (x < b[0]) b[0] = x;
  if (y < b[1]) b[1] = y;
  if (x > b[2]) b[2] = x;
  if (y > b[3]) b[3] = y;
}

function calquesCouleur(data, fg, n, k, total){
  if (k <= 1) return [{ masque: fg, couleur: null, taille: total, boite: null }];
  return k <= 16 ? calquesMoyennes(data, fg, n, k, total) : calquesHistogramme(data, fg, n, k, total);
}

/* --- Étape 1 : de l'image aux contours (le plus coûteux, fait une seule fois) --- */
function preparerContours(ctx, taille, opts){
  const img = ctx.getImageData(0, 0, taille, taille);
  const data = img.data;
  const n = taille*taille;
  const fg = masqueAvantPlan(data, taille, taille);

  let bx0 = taille, by0 = taille, bx1 = -1, by1 = -1, total = 0;
  for (let y = 0; y < taille; y++) for (let x = 0; x < taille; x++)
    if (fg[y*taille + x]){ total++;
      if (x < bx0) bx0 = x; if (x > bx1) bx1 = x;
      if (y < by0) by0 = y; if (y > by1) by1 = y; }
  if (total < 30) return { morceaux: [], vide: true, calques: 0, unite: 1 };

  const bw = Math.max(bx1-bx0+1, 1), bh = Math.max(by1-by0+1, 1);
  const unite = (opts.hauteur || 10) / Math.max(bw, bh);   // un pixel, en unités du repère
  const cx = bx0 + bw/2, cy = by0 + bh/2;
  const versRepere = q => [(q[0]-cx)*unite, (cy-q[1])*unite];

  const calques = calquesCouleur(data, fg, n, borne(opts.couleurs || 1, 1, COULEURS_MAX), total);
  const echelle = taille/512;
  const lisse = taille >= 1400 ? 3 : 2;
  const mini = Math.max(12, Math.round(14*echelle));
  const morceaux = [];
  for (const cq of calques){
    if (cq.boite && (cq.boite[2] - cq.boite[0] < 2 || cq.boite[3] - cq.boite[1] < 2)) continue;
    for (const poly of extraireContours(cq.masque, taille, taille, cq.boite)){
      if (poly.pts.length < mini) continue;
      if (poly.ferme && largeurMoyenne(poly.pts) < 2.5) continue;   // ruban d'anticrénelage
      morceaux.push({
        pts: lisser(poly.pts, lisse, poly.ferme).map(versRepere),
        taille: poly.pts.length,
        col: cq.couleur ? rgbHex(lisibleSurFonce(cq.couleur)) : null
      });
    }
  }
  morceaux.sort((a, b) => b.taille - a.taille);
  return { morceaux: morceaux, unite: unite, calques: calques.length, vide: !morceaux.length };
}

/* --- Étape 2 : les contours deviennent des équations ---
   Un contour reste indivisible : on n'en garde jamais la moitié, sinon le
   dessin aurait des trous (une étoile à qui il manque une branche). */
function ajusterMorceaux(morceaux, tol, plafond){
  const groupes = [];
  let total = 0;
  for (const m of morceaux){
    if (total >= plafond) break;
    const cs = [];
    for (const c of polyligneVersCourbes(m.pts, tol)){
      if (!c) continue;
      c.col = m.col;
      cs.push(c);
    }
    if (!cs.length) continue;
    groupes.push(cs);
    total += cs.length;
  }
  return groupes;
}

/* Assemble les contours. On ne jette JAMAIS un contour pour tomber pile sur
   le compte demandé : sacrifier le deuxième œil d'un chat pour gagner six
   fonctions, c'est un dessin faux. Le nombre visé est approché en réglant la
   finesse, pas en coupant des morceaux ; seul un débordement énorme arrête. */
function assembler(groupes, cible){
  const out = [];
  for (const g of groupes){
    if (out.length && out.length + g.length > cible*1.5) break;
    out.push.apply(out, g);
  }
  return out;
}

/* --- Étape 3 : ménage — paramètres écrits = paramètres tracés, pas de
   doublon (deux calques voisins tracent deux fois la même frontière),
   pas de courbe plus petite qu'un pixel. --- */
function nettoyerCourbes(liste, unite, vus){
  const grille = Math.max(unite*2.2, 1e-6);
  vus = vus || new Set();
  const out = [];
  for (const brute of liste){
    if (!brute) continue;
    const c = normaliserCourbe(brute);
    if (!courbeValide(c)) continue;
    if (c.fam !== "cercle" && Math.abs(c.dom[1] - c.dom[0]) < unite*1.5) continue;
    const pts = echantillonsCourbe(c, 6).filter(Boolean);
    if (pts.length < 2) continue;
    // quatre grilles décalées : deux tracés séparés d'un pixel tombent
    // forcément dans la même case pour l'une d'elles.
    const cles = [];
    for (const dx of [0, 0.5]) for (const dy of [0, 0.5]){
      cles.push(c.fam + "#" + pts.map(q =>
        Math.round(q[0]/grille + dx) + "," + Math.round(q[1]/grille + dy)).join(";"));
    }
    if (cles.some(k => vus.has(k))) continue;
    cles.forEach(k => vus.add(k));
    out.push(c);
  }
  return out;
}

/* --- Le passage pixels -> courbes, piloté par le NOMBRE DE FONCTIONS voulu --- */
function vectoriserContexte(ctx, taille, opts){
  const cible = borne(Math.round(opts.cible || 250), CIBLE_MIN, CIBLE_MAX);
  const prep = preparerContours(ctx, taille, opts);
  if (prep.vide) return { courbes: [], vide: true, calques: 0, essais: 0 };

  const echelle = taille/512;
  // En dessous d'un demi-pixel, on n'ajoute plus du détail mais du bruit :
  // c'est la limite physique de l'image de départ.
  const tolMin = 0.45*prep.unite;
  let tol = Math.max(borne(2.6*Math.pow(120/cible, 0.55), 0.06, 7)*echelle*prep.unite, tolMin);
  let best = null, essais = 0;
  for (; essais < 9; essais++){
    const vus = new Set();   // partagé : deux calques voisins ne tracent pas deux fois la même frontière
    const groupes = ajusterMorceaux(prep.morceaux, tol, Math.round(cible*3) + 30)
      .map(g => nettoyerCourbes(g, prep.unite, vus)).filter(g => g.length);
    const cs = assembler(groupes, cible);
    if (!best || Math.abs(cs.length - cible) < Math.abs(best.length - cible)) best = cs;
    if (cs.length < cible*0.9){
      if (tol <= tolMin*1.001) break;          // on ne peut pas faire plus fin
      tol = Math.max(tol*0.55, tolMin);
    }
    else if (cs.length > cible*1.1) tol *= 1.45;
    else break;
  }
  return { courbes: best, vide: best.length === 0, calques: prep.calques, essais: essais + 1 };
}

// Dessine un mot dans un canvas : son emoji si l'appareil en a un, sinon le mot écrit
function canvasMot(mot, taille){
  taille = taille || 512;
  const cv = creerCanvas(taille);
  const ctx = contexteVide(cv);
  const emo = emojiPour(mot);
  if (emo && emojiDisponible()){ dessinerEmoji(ctx, emo, taille); cv.source = "emoji"; }
  else { dessinerTexte(ctx, mot, taille); cv.source = "texte"; }
  return cv;
}

// Trace un mot puis le vectorise
function vectoriserMot(mot, opts){
  const taille = tailleSource(opts.cible || 250);
  const cv = canvasMot(mot, taille);
  const r = vectoriserContexte(cv.getContext("2d", { willReadFrequently: true }), taille, opts);
  r.source = cv.source;
  return r;
}

// Réduit une source déjà dessinée à la taille voulue (jamais d'agrandissement :
// on ne gagne aucun détail à étirer des pixels).
function canvasAjuste(src, taille){
  if (src.width <= taille) return src;
  const cv = creerCanvas(taille);
  const ctx = contexteVide(cv);
  ctx.drawImage(src, 0, 0, taille, taille);
  return cv;
}

function vectoriserSource(src, opts){
  const cv = canvasAjuste(src, tailleSource(opts.cible || 250));
  const r = vectoriserContexte(cv.getContext("2d", { willReadFrequently: true }), cv.width, opts);
  return r;
}

// cherche un emoji en tolérant les pluriels
function emojiPour(mot){
  const m = normaliser(mot);
  if (EMOJIS[m]) return EMOJIS[m];
  if (m.endsWith("x") && EMOJIS[m.slice(0,-1)]) return EMOJIS[m.slice(0,-1)];
  if (m.endsWith("s") && EMOJIS[m.slice(0,-1)]) return EMOJIS[m.slice(0,-1)];
  return null;
}

/* ---------- 7b. Modèles paramétriques faits main ----------------------
   Pour les sujets courants, des équations écrites à la main : peu
   nombreuses, très lisibles — parfaites pour Desmos ou pour un cours.
------------------------------------------------------------------------ */

function mSeg(x1,y1,x2,y2,col){ const c = droiteEntre([x1,y1],[x2,y2]); if (c) c.col = col; return c; }
function mVert(x,y0,y1,col){ return courbe("constante",{c:x},"y",[Math.min(y0,y1),Math.max(y0,y1)],col); }
function mHoriz(y,x0,x1,col){ return courbe("constante",{c:y},"x",[Math.min(x0,x1),Math.max(x0,x1)],col); }
function mArc(h,k,r,s,x0,x1,col){ return courbe("arc",{h:h,k:k,r:r,s:s},"x",[x0,x1],col); }
function mCercle(h,k,r,col){ return courbe("cercle",{h:h,k:k,r:r},"x",[h-r,h+r],col); }
function mParab(a,h,k,x0,x1,col){ return courbe("parabole",{a:a,h:h,k:k},"x",[x0,x1],col); }
function mAbs(a,h,k,x0,x1,col){ return courbe("absolue",{a:a,h:h,k:k},"x",[x0,x1],col); }
function mEll(h,k,rx,ry,s,col){ return courbe("ellipse",{h:h,k:k,rx:rx,ry:ry,s:s},"x",[h-rx,h+rx],col); }
function mSinY(A,w,ph,k,y0,y1,col){ return courbe("sinus",{A:A,w:w,ph:ph,k:k},"y",[y0,y1],col); }
function mSinX(A,w,ph,k,x0,x1,col){ return courbe("sinus",{A:A,w:w,ph:ph,k:k},"x",[x0,x1],col); }
function mExpY(a,b,h,k,y0,y1,col){ return courbe("expo",{a:a,b:b,h:h,k:k},"y",[y0,y1],col); }
function rect(x0,y0,x1,y1,col){
  return [mHoriz(y0,x0,x1,col), mHoriz(y1,x0,x1,col), mVert(x0,y0,y1,col), mVert(x1,y0,y1,col)];
}
