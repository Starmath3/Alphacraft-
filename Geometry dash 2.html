                ctx.beginPath(); ctx.moveTo(fx, 0); ctx.lineTo(fx - 120, canvas.height); ctx.stroke();
                let dotY = ((x + scrX * 2.2) % canvas.height);
                let dotX = fx - (120 * (dotY / canvas.height));
                ctx.fillStyle = "rgba(220, 220, 220, 0.5)";
                ctx.fillRect(dotX - 1, dotY - 1, 3, 3);
            }
            break;
    }

    if (progressPct >= 10) {
        ctx.fillStyle = "rgba(255, 255, 255, 0.15)";
        for (let i = 0; i < 8; i++) {
            let sx = (i * 170 - parallaxScrollX * 0.3) % canvas.width;
            if (sx < 0) sx += canvas.width;
            ctx.fillRect(sx, 30 + (i * 22) % 120, 2, 2);
        }
    }

    ctx.strokeStyle = "rgba(220, 220, 220, 0.08)";
    ctx.lineWidth = 1.5;
    let groundYPos = (GROUND_ROW * CELL_SIZE) + cameraY;
    for (let y = 0; y < groundYPos; y += 40) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(canvas.width, y);
        ctx.stroke();
    }
}


// ===== PORTAIL : 1 case de large, 3 de haut, inspiré de Geometry Dash =====
function dessinerPortail(x, y, tile) {
    const W = CELL_SIZE, H = CELL_SIZE * 3;
    const cx = x + W / 2, cy = y + H / 2;
    const teinte = tile === 4 ? "#39ff8f" : "#ff4fd8";   // flèche / cube
    const sombre = tile === 4 ? "#06301c" : "#360a2c";
    const t = Date.now() * 0.003;

    ctx.save();

    // halo
    ctx.shadowBlur = 22;
    ctx.shadowColor = teinte;

    // anneau extérieur (ovale allongé, comme dans le vrai jeu)
    const rx = W / 2 - 3, ry = H / 2 - 4;
    ctx.beginPath();
    ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
    ctx.lineWidth = 5;
    ctx.strokeStyle = teinte;
    ctx.stroke();

    // intérieur sombre
    ctx.shadowBlur = 0;
    const grad = ctx.createRadialGradient(cx, cy, 2, cx, cy, ry);
    grad.addColorStop(0, teinte);
    grad.addColorStop(0.35, sombre);
    grad.addColorStop(1, "rgba(0,0,0,0.85)");
    ctx.beginPath();
    ctx.ellipse(cx, cy, rx - 3, ry - 3, 0, 0, Math.PI * 2);
    ctx.fillStyle = grad;
    ctx.globalAlpha = 0.92;
    ctx.fill();
    ctx.globalAlpha = 1;

    // tourbillon interne
    ctx.strokeStyle = "rgba(255,255,255,0.55)";
    ctx.lineWidth = 1.5;
    for (let i = 0; i < 3; i++) {
        const p = ((t + i * 0.66) % 1);
        ctx.globalAlpha = 0.6 * (1 - p);
        ctx.beginPath();
        ctx.ellipse(cx, cy, (rx - 4) * p, (ry - 5) * p, 0, 0, Math.PI * 2);
        ctx.stroke();
    }
    ctx.globalAlpha = 1;

    // liseré intérieur clair
    ctx.strokeStyle = "rgba(255,255,255,0.75)";
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.ellipse(cx, cy, rx - 3, ry - 3, 0, 0, Math.PI * 2);
    ctx.stroke();

    // socles haut et bas
    ctx.fillStyle = teinte;
    ctx.shadowBlur = 10;
    ctx.shadowColor = teinte;
    ctx.beginPath();
    ctx.moveTo(cx - 9, y + 2); ctx.lineTo(cx + 9, y + 2);
    ctx.lineTo(cx + 5, y + 8); ctx.lineTo(cx - 5, y + 8);
    ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(cx - 9, y + H - 2); ctx.lineTo(cx + 9, y + H - 2);
    ctx.lineTo(cx + 5, y + H - 8); ctx.lineTo(cx - 5, y + H - 8);
    ctx.closePath(); ctx.fill();

    ctx.restore();
}

// ===== POSE ET EFFACEMENT DANS L'ÉDITEUR =====
let portailEnAttente = null;
let portailMode = "cube";
let portailGravite = false;

function ouvrirFenetrePortail(col, row) {
    portailEnAttente = { col, row: Math.min(row, ROWS - 3) };
    majFenetrePortail();
    document.getElementById("portalDialog").style.display = "flex";
}
function setPortalMode(m) { portailMode = m; majFenetrePortail(); }
function setPortalGravity(g) { portailGravite = g; majFenetrePortail(); }

function majFenetrePortail() {
    document.getElementById("pd-cube").className = "perso-tab" + (portailMode === "cube" ? " active-tab" : "");
    document.getElementById("pd-wave").className = "perso-tab" + (portailMode === "wave" ? " active-tab" : "");
    document.getElementById("pd-grav-off").className = "perso-tab" + (portailGravite ? "" : " active-tab");
    document.getElementById("pd-grav-on").className = "perso-tab" + (portailGravite ? " active-tab" : "");
    const pv = document.getElementById("pd-preview");
    if (!pv) return;
    const pc = pv.getContext("2d");
    pc.clearRect(0, 0, pv.width, pv.height);
    const sauve = ctx;
    try {
        dessinerPortailSur(pc, (pv.width - CELL_SIZE) / 2, (pv.height - CELL_SIZE * 3) / 2,
                           portailMode === "wave" ? 4 : 5);
    } catch (e) {}
}
// même rendu, sur un contexte quelconque
function dessinerPortailSur(c2, x, y, tile) {
    const memo = ctx;
    ctx = c2;
    dessinerPortail(x, y, tile);
    ctx = memo;
}

function confirmerPortail() {
    if (portailEnAttente) {
        const { col, row } = portailEnAttente;
        const type = portailMode === "wave" ? 4 : 5;
        for (let k = 0; k < 3; k++) map[col][row + k] = type;
    }
    annulerPortail();
}
function annulerPortail() {
    portailEnAttente = null;
    document.getElementById("portalDialog").style.display = "none";
}

// la gomme retire le portail entier
function effacerCellule(col, row) {
    const v = map[col][row];
    if (v === 4 || v === 5) {
        let r0 = row;
        while (r0 > 0 && map[col][r0 - 1] === v) r0--;
        while (r0 < ROWS && map[col][r0] === v) { map[col][r0] = 0; r0++; }
    } else {
        map[col][row] = 0;
    }
}

function drawGrid(offsetX) {
    const startCol = Math.floor(offsetX / CELL_SIZE);
    const endCol = startCol + Math.ceil(canvas.width / CELL_SIZE) + 1;

    for (let c = startCol; c < endCol; c++) {
        if (c >= currentCols) break;
        for (let r = 0; r < ROWS; r++) {
            const tile = map[c][r];
            const xPos = (c * CELL_SIZE) - offsetX;
            const yPos = (r * CELL_SIZE) + cameraY;

            if (mode === "EDIT") {
                ctx.strokeStyle = "rgba(255,255,255,0.03)";
                ctx.lineWidth = 1;
                ctx.strokeRect(xPos, yPos, CELL_SIZE, CELL_SIZE);
            }

            if (tile === 1) { 
                let blockGrad = ctx.createLinearGradient(xPos, yPos, xPos, yPos + CELL_SIZE);
                blockGrad.addColorStop(0, colors.block);
                blockGrad.addColorStop(1, "#021c2e");
                ctx.fillStyle = blockGrad;
                ctx.fillRect(xPos, yPos, CELL_SIZE, CELL_SIZE);
                
                ctx.strokeStyle = "#ffffff";
                ctx.lineWidth = 1.5;
                ctx.strokeRect(xPos + 1.5, yPos + 1.5, CELL_SIZE - 3, CELL_SIZE - 3);
                
                ctx.strokeStyle = "rgba(255,255,255,0.12)";
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(xPos + 6, yPos + 6); ctx.lineTo(xPos + CELL_SIZE - 6, yPos + CELL_SIZE - 6);
                ctx.moveTo(xPos + CELL_SIZE - 6, yPos + 6); ctx.lineTo(xPos + 6, yPos + CELL_SIZE - 6);
                ctx.stroke();

                ctx.fillStyle = "rgba(0, 243, 255, 0.2)";
                ctx.fillRect(xPos + 11, yPos + 11, CELL_SIZE - 22, CELL_SIZE - 22);
            } 
            else if (tile === 2) { 
                let spikeGrad = ctx.createLinearGradient(xPos, yPos, xPos, yPos + CELL_SIZE);
                spikeGrad.addColorStop(0, "#ffffff");
                spikeGrad.addColorStop(0.2, colors.spike);
                spikeGrad.addColorStop(1, "#2b0010");
                
                ctx.fillStyle = spikeGrad;
                ctx.beginPath();
                ctx.moveTo(xPos + 1, yPos + CELL_SIZE);
                ctx.lineTo(xPos + CELL_SIZE / 2, yPos + 1);
                ctx.lineTo(xPos + CELL_SIZE - 1, yPos + CELL_SIZE);
                ctx.closePath();
                ctx.fill();

                ctx.strokeStyle = "rgba(255,255,255,0.5)";
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(xPos + CELL_SIZE / 2, yPos + 1);
                ctx.lineTo(xPos + CELL_SIZE / 2, yPos + CELL_SIZE);
                ctx.stroke();
            } 
            else if (tile === 3) { 
                ctx.fillStyle = (c + r) % 2 === 0 ? "#00f3ff" : "#0a0c16";
                ctx.fillRect(xPos, yPos, CELL_SIZE, CELL_SIZE);
                ctx.strokeStyle = "rgba(0, 243, 255, 0.4)";
                ctx.strokeRect(xPos, yPos, CELL_SIZE, CELL_SIZE);
            }
            else if (tile === 4 || tile === 5) {
                // un portail occupe 1 colonne sur 3 cases : on ne dessine qu'au sommet
                if (r === 0 || map[c][r - 1] !== tile) dessinerPortail(xPos, yPos, tile);
            }
        }
    }

    let groundYPos = (GROUND_ROW * CELL_SIZE) + cameraY;
    let groundGrad = ctx.createLinearGradient(0, groundYPos, 0, canvas.height);
    groundGrad.addColorStop(0, "#11152b");
    groundGrad.addColorStop(1, "#030408");
    ctx.fillStyle = groundGrad;
    ctx.fillRect(0, groundYPos, canvas.width, canvas.height);

    ctx.strokeStyle = "#00f3ff";
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(0, groundYPos);
    ctx.lineTo(canvas.width, groundYPos);
    ctx.stroke();

    ctx.strokeStyle = "rgba(0, 243, 255, 0.15)";
    ctx.lineWidth = 2;
    let groundScroll = (mode === "PLAY" ? worldX : editorScrollX) % 30;
    for (let gx = -groundScroll; gx < canvas.width; gx += 30) {
        ctx.beginPath();
        ctx.moveTo(gx, groundYPos);
        ctx.lineTo(gx, groundYPos + 12);
        ctx.stroke();
    }
}

function drawPlayer() {
    ctx.save();
    ctx.translate(player.x + player.size / 2, player.y + player.size / 2 + cameraY);
    ctx.rotate(player.angle);

    // Effet Néon ajouté sur le joueur
    const isWave = (player.mode === "wave");
    const mainColor = isWave ? colors.wave : colors.player;
    ctx.shadowBlur = 15;
    ctx.shadowColor = mainColor;

    let pGrad = ctx.createLinearGradient(-player.size / 2, -player.size / 2, player.size / 2, player.size / 2);
    pGrad.addColorStop(0, "#ffffff");
    pGrad.addColorStop(0.25, mainColor);
    pGrad.addColorStop(1, isWave ? shadeColor(mainColor, -0.72) : "#4d3300");

    if (isWave) {
        drawWaveArrow(ctx, currentWaveSkin, player.size, pGrad, mainColor);
    } else {
        renderPlayerShape(ctx, currentPlayerShape, player.size, pGrad, mainColor);
    }

    ctx.shadowBlur = 0; // Reset

    ctx.restore();
}

function shadeColor(hex, amount) {
    const h = hex.replace("#", "");
    if (h.length !== 6) return hex;
    let r = parseInt(h.substring(0, 2), 16);
    let g = parseInt(h.substring(2, 4), 16);
    let b = parseInt(h.substring(4, 6), 16);
    const f = (v) => {
        const nv = amount < 0 ? v * (1 + amount) : v + (255 - v) * amount;
        return Math.max(0, Math.min(255, Math.round(nv))).toString(16).padStart(2, "0");
    };
    return `#${f(r)}${f(g)}${f(b)}`;
}

function drawWaveArrow(targetCtx, skinIndex, size, fillStyle, accentColor) {
    const skin = WAVE_SKINS[skinIndex] || WAVE_SKINS[0];
    const h = size / 2;

    if (skin.s === "chevron") {
        targetCtx.strokeStyle = accentColor;
        targetCtx.lineWidth = Math.max(2, size * 0.09);
        targetCtx.lineCap = "round";
        targetCtx.lineJoin = "round";
        targetCtx.beginPath();
        targetCtx.moveTo(h * 0.35, -h * 0.7);
        targetCtx.lineTo(h * 0.95, 0);
        targetCtx.lineTo(h * 0.35, h * 0.7);
        targetCtx.stroke();
        targetCtx.beginPath();
        targetCtx.moveTo(-h * 0.35, -h * 0.6);
        targetCtx.lineTo(h * 0.2, 0);
        targetCtx.lineTo(-h * 0.35, h * 0.6);
        targetCtx.stroke();
        targetCtx.strokeStyle = "#ffffff";
        targetCtx.lineWidth = Math.max(1, size * 0.03);
        targetCtx.beginPath();
        targetCtx.moveTo(-h * 0.9, -h * 0.4);
        targetCtx.lineTo(-h * 0.45, 0);
        targetCtx.lineTo(-h * 0.9, h * 0.4);
        targetCtx.stroke();
        return;
    }

    const trace = (scale) => {
        targetCtx.beginPath();
        skin.p.forEach((pt, i) => {
            const x = pt[0] * h * scale, y = pt[1] * h * scale;
            if (i === 0) targetCtx.moveTo(x, y); else targetCtx.lineTo(x, y);
        });
        targetCtx.closePath();
    };

    if (skin.s === "outline") {
        trace(1);
        targetCtx.strokeStyle = accentColor;
        targetCtx.lineWidth = Math.max(2, size * 0.085);
        targetCtx.stroke();
        trace(0.5);
        targetCtx.strokeStyle = "#ffffff";
        targetCtx.lineWidth = Math.max(1, size * 0.035);
        targetCtx.stroke();
        return;
    }

    trace(1);
    targetCtx.fillStyle = fillStyle;
    targetCtx.fill();

    if (skin.s === "accent") {
        targetCtx.strokeStyle = accentColor;
        targetCtx.lineWidth = Math.max(1.5, size * 0.06);
    } else {
        targetCtx.strokeStyle = "#ffffff";
        targetCtx.lineWidth = Math.max(1.2, size * 0.045);
    }
    targetCtx.stroke();

    if (skin.s === "core") {
        trace(0.42);
        targetCtx.fillStyle = "rgba(0,0,0,0.55)";
        targetCtx.fill();
        targetCtx.strokeStyle = "rgba(255,255,255,0.8)";
        targetCtx.lineWidth = Math.max(1, size * 0.03);
        targetCtx.stroke();
    }
}

function drawUI() {
    let finishCol = currentCols - 12;
    const finishX = finishCol * CELL_SIZE;
    
    let displayProgress = 0;
    if (gameState === "CLEAR") {
        displayProgress = 100;
    } else {
        let maxDist = finishX - player.x;
        displayProgress = Math.min(Math.floor((worldX / maxDist) * 100), 100);
        if (displayProgress < 0) displayProgress = 0;
        if (displayProgress === 100 && gameState !== "CLEAR") displayProgress = 99; 
    }

    if (!practiceMode && (gameState === "PLAYING" || gameState === "CLEAR")) {
        saveRecord(currentLevelIndex, displayProgress);
    }

    ctx.fillStyle = "rgba(255, 255, 255, 0.04)";
    ctx.beginPath();
    ctx.roundRect(canvas.width / 2 - 150, 15, 300, 8, 4);
    ctx.fill();
    
    ctx.fillStyle = "#00f3ff";
    ctx.beginPath();
    ctx.roundRect(canvas.width / 2 - 150, 15, (displayProgress / 100) * 300, 8, 4);
    ctx.fill();
    
    ctx.font = "bold 13px 'Segoe UI'";
    ctx.textAlign = "center";
    ctx.fillStyle = "#ffffff";
    ctx.fillText(`${displayProgress}%`, canvas.width / 2, 38);

    ctx.textAlign = "left";
    ctx.fillStyle = "#69739c";
    ctx.fillText("NIVEAU : ", 25, 25);
    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 14px 'Segoe UI'";
    ctx.fillText(`${LEVEL_NAMES[currentLevelIndex].toUpperCase()}`, 85, 25);
    
    ctx.font = "bold 12px 'Segoe UI'";
    ctx.fillStyle = "rgba(255,255,255,0.35)";
    ctx.fillText(`TENTATIVE ${attempts}`, 25, 45);

    if (practiceMode) {
        ctx.fillStyle = "#00ff66";
        ctx.fillText("MODE ENTRAÎNEMENT", 25, 63);
    }
    if (player.mode === "wave") {
        ctx.fillStyle = colors.wave;
        ctx.fillText(`FLÈCHE : ${WAVE_SKINS[currentWaveSkin].n.toUpperCase()}`, 25, practiceMode ? 81 : 63);
    }
    
    ctx.textAlign = "right";
    ctx.fillStyle = "#ffaa00";
    ctx.fillText(`MEILLEUR RECORD : ${getRecord(currentLevelIndex)}%`, canvas.width - 25, 25);

    if (mode === "PLAY") {
        ctx.textAlign = "center";
        if (gameState === "START") {
            ctx.font = "bold 17px 'Segoe UI'";
            ctx.fillStyle = "#00f3ff";
            ctx.fillText("CLIQUEZ OU BARRE ESPACE POUR CONTRÔLER LE COMPACTEUR", canvas.width / 2, canvas.height / 2 - 20);
        } else if (gameState === "GAMEOVER") {
            ctx.font = "bold 20px 'Segoe UI'";
            ctx.fillStyle = "#ff0055";
            ctx.fillText("CRASH !", canvas.width / 2, canvas.height / 2 - 10);
            ctx.font = "14px 'Segoe UI'";
            ctx.fillStyle = "#ffffff";
            ctx.fillText(
                practiceMode && checkpoint
                    ? "Reprise au point de contrôle..."
                    : "Relance automatique... (ou touchez / espace)",
                canvas.width / 2, canvas.height / 2 + 15
            );
        } else if (gameState === "CLEAR") {
            ctx.font = "bold 24px 'Segoe UI'";
            ctx.fillStyle = "#00ff66";
            ctx.fillText("NIVEAU COMPLÉTÉ ! 🎉", canvas.width / 2, canvas.height / 2);
        }
        
        if (isPaused) {
            ctx.fillStyle = "rgba(2,3,7,0.65)";
            ctx.fillRect(0,0,canvas.width,canvas.height);
            ctx.font = "bold 32px 'Segoe UI'";
            ctx.fillStyle = "#ffaa00";
            ctx.textAlign = "center";
            ctx.fillText("PAUSE", canvas.width / 2, canvas.height / 2);
        }
    } else {
        ctx.fillStyle = "#565f89";
        ctx.font = "12px 'Segoe UI'";
        ctx.textAlign = "left";
        ctx.fillText("⚙️ CONFIGURATEUR : Glissez de gauche à droite pour tracer. Sauvegardez pour acter.", 25, canvas.height - 15);
    }
}

function setMode(newMode) {
    mode = newMode;
    document.getElementById("btn-play").classList.toggle("active", mode === "PLAY");
    document.getElementById("btn-edit").classList.toggle("active", mode === "EDIT");
    document.getElementById("editor-tools").style.display = mode === "EDIT" ? "flex" : "none";
    if (mode === "EDIT") {
        gameState = "START";
        worldX = 0;
        cameraY = 0;
        if(isPaused) togglePause();
    } else {
        resetGame();
    }
}

function setTool(tool) {
    currentTool = tool;
    document.getElementById("tool-block").classList.toggle("active", tool === "BLOCK");
    document.getElementById("tool-spike").classList.toggle("active", tool === "SPIKE");
    document.getElementById("tool-erase").classList.toggle("active", tool === "ERASE");
    document.getElementById("tool-portal").classList.toggle("active", tool === "PORTAL");
}

function gameLoop() {
    updatePhysics();

    let finishCol = currentCols - 12;
    const finishX = finishCol * CELL_SIZE;
    let maxDist = finishX - player.x;
    let currentMultiplierMax = LEVEL_MULTIPLIERS[currentLevelIndex] * 100;
    
    let runProgressPct = 0;
    if (gameState === "CLEAR") {
        runProgressPct = currentMultiplierMax;
    } else {
        runProgressPct = maxDist > 0 ? (worldX / maxDist) * currentMultiplierMax : 0;
    }

    if (runProgressPct > currentMultiplierMax) {
        runProgressPct = currentMultiplierMax;
    }

    handleAgitationPhysics(runProgressPct);

    if (gameState === "GAMEOVER") {
        updateParticles();
        if (!isPaused && !anyMenuOpen() && performance.now() - deathTime > autoRestartDelay) {
            resetGame(true);
        }
    }

    ctx.save();
    ctx.translate(shakeX, shakeY);

    drawBackground(runProgressPct);

    if (mode === "PLAY") {
        drawGrid(worldX);
        drawCheckpointFlag();
        drawWaveTrail();
        if (gameState !== "GAMEOVER") drawPlayer();
        drawParticles();
    } else {
        drawGrid(editorScrollX);
        ctx.save();
        ctx.globalAlpha = 0.25;
        drawPlayer();
        ctx.restore();
    }

    drawUI();
    
    ctx.restore(); 
    
    requestAnimationFrame(gameLoop);
}

loadSettings();
updateSwatchButtons();
document.getElementById("btn-sound").classList.toggle("toggle-on", soundOn);
document.getElementById("btn-sound").innerText = soundOn ? "🔊 Son" : "🔇 Muet";
loadMapData(currentLevelIndex);
gameLoop();
</script>
