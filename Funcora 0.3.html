// mot -> emoji, construit une fois au démarrage. Les petits mots de liaison
// (« pomme DE terre », « arc EN ciel ») soudent leurs voisins : sans ça,
// « terre » finirait par désigner une patate.
const LIAISONS = ["de", "d", "a", "au", "aux", "en", "la", "le", "du", "des", "et", "avec"];
// Un adjectif ou un mot trop courant ne doit pas devenir le nom d'un dessin :
// sans ça « rouge » finirait par désigner un poisson et « grand » un papi.
const MOTS_FAIBLES = ["grand", "grande", "petit", "petite", "gros", "grosse", "beau", "belle",
  "vieux", "vieille", "nouveau", "rouge", "vert", "verte", "bleu", "bleue", "jaune", "orange",
  "rose", "violet", "noir", "noire", "blanc", "blanche", "gris", "grise", "marron", "brun",
  "or", "argent", "tropical", "americain", "douce", "composee", "morte", "brillante", "ancien",
  "murale", "de", "des", "le", "la", "les", "du", "a", "au", "aux", "en", "et", "avec", "d"];

const EMOJIS = (function(){
  const table = {};
  const poser = (nom, emo) => {
    const n = normaliser(nom);
    if (n && !table[n]) table[n] = emo;
  };
  for (const ligne of LEXIQUE){
    const bouts = ligne.split(" ").filter(Boolean);
    const emo = bouts[0];
    const mots = bouts.slice(1);
    const groupes = [];
    for (let i = 0; i < mots.length; i++){
      if (LIAISONS.indexOf(mots[i]) >= 0 && groupes.length && i + 1 < mots.length){
        groupes[groupes.length - 1] += " " + mots[i] + " " + mots[i + 1];
        i++;
      } else groupes.push(mots[i]);
    }
    for (const g of groupes) if (MOTS_FAIBLES.indexOf(g) < 0) poser(g, emo);
    // « grand pere », « pere noel » : les paires de mots comptent aussi
    for (let i = 0; i + 1 < mots.length; i++)
      if (MOTS_FAIBLES.indexOf(mots[i + 1]) < 0) poser(mots[i] + " " + mots[i + 1], emo);
    if (groupes.length > 1) poser(mots.join(" "), emo);   // le nom complet de la ligne
  }
  return table;
})();

/* Cherche l'emoji d'un sujet : le mot exact, puis ses formes au singulier,
   puis en laissant tomber les mots en trop (« un elephant rose » -> elephant). */
function emojiSimple(m){
  if (!m) return null;
  if (EMOJIS[m]) return EMOJIS[m];
  const formes = [];
  if (m.endsWith("aux")) formes.push(m.slice(0, -3) + "al", m.slice(0, -3) + "eau");
  if (m.endsWith("x") || m.endsWith("s")) formes.push(m.slice(0, -1));
  for (const f of formes) if (EMOJIS[f]) return EMOJIS[f];
  return null;
}

function emojiPour(mot){
  const m = normaliser(mot);
  const direct = emojiSimple(m);
  if (direct) return direct;
  const mots = m.split(" ").filter(Boolean);
  if (mots.length < 2) return null;
  // du groupe de mots le plus long au plus court
  for (let taille = mots.length - 1; taille >= 1; taille--)
    for (let d = 0; d + taille <= mots.length; d++){
      const e = emojiSimple(mots.slice(d, d + taille).join(" "));
      if (e) return e;
    }
  return null;
}

/* ---------- 7b. Modèles paramétriques faits main ----------------------
   Pour les sujets courants, des équations écrites à la main : peu
   nombreuses, très lisibles — parfaites pour Desmos ou pour un cours.
------------------------------------------------------------------------ */

function mSeg(x1,y1,x2,y2,col){ const c = droiteEntre([x1,y1],[x2,y2]); if (c) c.col = col; return c; }
function mVert(x,y0,y1,col){ return courbe("constante",{c:x},"y",[Math.min(y0,y1),Math.max(y0,y1)],col); }
function mHoriz(y,x0,x1,col){ return courbe("constante",{c:y},"x",[Math.min(x0,x1),Math.max(x0,x1)],col); }
function mArc(h,k,r,s,x0,x1,col){ return courbe("arc",{h:h,k:k,r:r,s:s},"x",[x0,x1],col); }
function mCercle(h,k,r,col){ return courbe("cercle",{h:h,k:k,r:r},"x",[h-r,h+r],col); }
function mParab(a,h,k,x0,x1,col){ return courbe("parabole",{a:a,h:h,k:k},"x",[x0,x1],col); }
function mAbs(a,h,k,x0,x1,col){ return courbe("absolue",{a:a,h:h,k:k},"x",[x0,x1],col); }
function mEll(h,k,rx,ry,s,col){ return courbe("ellipse",{h:h,k:k,rx:rx,ry:ry,s:s},"x",[h-rx,h+rx],col); }
function mSinY(A,w,ph,k,y0,y1,col){ return courbe("sinus",{A:A,w:w,ph:ph,k:k},"y",[y0,y1],col); }
function mSinX(A,w,ph,k,x0,x1,col){ return courbe("sinus",{A:A,w:w,ph:ph,k:k},"x",[x0,x1],col); }
function mExpY(a,b,h,k,y0,y1,col){ return courbe("expo",{a:a,b:b,h:h,k:k},"y",[y0,y1],col); }
function rect(x0,y0,x1,y1,col){
  return [mHoriz(y0,x0,x1,col), mHoriz(y1,x0,x1,col), mVert(x0,y0,y1,col), mVert(x1,y0,y1,col)];
}

/* Chaque courbe d'un modèle a un niveau : 1 la silhouette, 2 les éléments
   normaux, 3 la finition. On empile les niveaux tant qu'on tient dans le
   nombre de fonctions demandé — c'est ce qui fait servir le curseur en mode
   Formules. */
function niv(liste, n){ liste.forEach(c => { if (c) c.niv = n; }); return liste; }

const NIVEAU_PIECE = { mur:1, toit:1, tronc:1, coque:1, porte:2, fenetre:2, cheminee:2,
  roue:2, oreille:2, oeil:2, rayon:2, feuille:2, tige:2, queue:2, aile:2, bec:2,
  fumee:3, hublot:3, flamme:3, moustache:3, poignee:3, decor:3, rayure:3, bougie:3 };

function courbesModele(cle, opts, cible){
  const m = MODELES[cle];
  if (!m) return [];
  const brut = m.f(opts || {}).filter(Boolean);
  brut.forEach(c => { if (!c.niv) c.niv = NIVEAU_PIECE[c.part] || 1; });
  const but = cible || 250;
  const silhouette = brut.filter(c => c.niv === 1);
  const base = brut.filter(c => c.niv <= 2);
  const finition = brut.filter(c => c.niv === 3);
  // très peu de fonctions demandées : la silhouette seule, si elle se tient
  if (but < base.length*0.75 && silhouette.length >= 4) return silhouette;
  if (finition.length && base.length + finition.length <= but*1.3) return base.concat(finition);
  return base.length ? base : brut;
}

function totalModele(cle, opts){
  const m = MODELES[cle];
  return m ? m.f(opts || {}).filter(Boolean).length : 0;
}

function modelePour(mot){
  const m = normaliser(mot);
  for (const cle in MODELES) if (MODELES[cle].mots.indexOf(m) >= 0) return cle;
  const sing = m.replace(/s$/,"");
  for (const cle in MODELES) if (MODELES[cle].mots.indexOf(sing) >= 0) return cle;
  return null;
}

/* ---------- 8. La scène : plusieurs objets, placés ensemble ------------ */

function tag(liste, nom){ liste.forEach(c => { if (c) c.part = nom; }); return liste; }

function echantillonsCourbe(c, n){
  const out = [];
  if (c.fam === "cercle"){
    const N = Math.max(n, 28);
    for (let i = 0; i <= N; i++){
      const a = i*2*Math.PI/N;
      out.push([c.p.h + c.p.r*Math.cos(a), c.p.k + c.p.r*Math.sin(a)]);
    }
    return out;
  }
  const t0 = Math.min(c.dom[0], c.dom[1]), t1 = Math.max(c.dom[0], c.dom[1]);
  const serre = (c.fam === "arc" || c.fam === "ellipse");
  const N = Math.max(2, n|0);
  for (let i = 0; i <= N; i++){
    const u = i/N;
    const t = serre ? (t0+t1)/2 + (t1-t0)/2*Math.sin(Math.PI*(u-0.5)) : t0 + (t1-t0)*u;
    const v = evaluer(c, t);
    if (!isFinite(v)){ out.push(null); continue; }
    out.push(c.axe === "x" ? [t, v] : [v, t]);
  }
  return out;
}

function bboxListe(liste){
  let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
  // au-delà de quelques milliers de courbes, un échantillon suffit à cadrer
  const pas = Math.max(1, Math.floor(liste.length/2000));
  for (let i = 0; i < liste.length; i += pas){
    const c = liste[i];
    if (!c) continue;
    for (const p of echantillonsCourbe(c, 24)){
      if (!p) continue;
      if (p[0] < x0) x0 = p[0]; if (p[0] > x1) x1 = p[0];
      if (p[1] < y0) y0 = p[1]; if (p[1] > y1) y1 = p[1];
    }
  }
  if (!isFinite(x0)) return null;
  return { x0:x0, x1:x1, y0:y0, y1:y1, w: Math.max(x1-x0, 1e-6), h: Math.max(y1-y0, 1e-6) };
}

const MOTS_CIEL = ["soleil","lune","nuage","nuages","etoile","etoiles","oiseau","avion","arc en ciel","eclair","planete","fusee"];

const scene = {
  objets: [],
  mode: "formules",
  graine: 0,           // change à chaque « Regénérer » : une autre image
  cible: 250,          // nombre de fonctions visé (10 à 10 000)
  couleurs: 12,        // nombre de calques de couleur (1 à 100)
  historique: [],
  demande: ""
};

let _idObjet = 1;

function creerObjet(mot, type, source){
  return {
    id: _idObjet++,
    mot: mot,
    type: type || "mot",
    src: source || null,
    mode: scene.mode,
    cible: scene.cible,
    couleurs: scene.couleurs,
    opts: {},
    retirees: [],
    palette: false,
    couleurForcee: null,
    t: { s: 1, dx: 0, dy: 0, mir: false, rot: 0 },
    man: { s: 1, dx: 0, dy: 0 },   // ce que l'utilisateur a corrigé à la main
    ciel: false,
    info: "",
    base: []
  };
}

function regenererBase(o){
  const reg = { cible: o.cible, couleurs: o.couleurs, hauteur: 10 };
  if (o.type === "image" || o.type === "dessin"){
    const r = vectoriserSource(o.src, reg);
    o.base = r.courbes; o.info = o.type; o.ciel = false; o.calques = r.calques;
    o.detail = (r.contours || 0) + " contours, " + (r.calques || 0) + " calques" +
      (r.sature ? ", saturé" : "") + (r.cran ? ", image affinée" : "");
    return;
  }
  const cle = modelePour(o.mot);
  o.modele = cle;
  o.ciel = cle ? !!MODELES[cle].ciel : MOTS_CIEL.indexOf(normaliser(o.mot)) >= 0;
  if (o.mode === "formules" && cle){
    o.base = courbesModele(cle, o.opts, o.cible);
    o.maxModele = totalModele(cle, o.opts);
    o.info = "formules";
    return;
  }
  if (o.mode === "tracage" && cle && !emojiPour(o.mot) && !emojiDisponible()){
    o.base = courbesModele(cle, o.opts, o.cible);
    o.maxModele = totalModele(cle, o.opts);
    o.info = "formules";
    return;
  }
  const r = vectoriserMot(o.mot, reg);
  if (r.courbes.length){
    o.base = r.courbes;
    o.info = r.source;
    o.calques = r.calques;
    o.detail = (r.contours || 0) + " contours, " + (r.calques || 0) + " calques" +
      (r.sature ? ", saturé" : "") + (r.cran ? ", image affinée" : "");
  } else if (cle){
    o.base = MODELES[cle].f(o.opts).filter(Boolean);
    o.info = "formules";
  } else {
    o.base = []; o.info = "vide";
  }
}

function courbesObjet(o){
  const base = o.base.filter(c => c && !c.supprime && o.retirees.indexOf(c.part) < 0);
  const identite = o.t.s === 1 && !o.t.dx && !o.t.dy && !o.t.mir && !o.t.rot;
  if (identite && base.length > 30000){
    // mode Max : recopier un million de courbes doublerait la mémoire pour rien
    for (const c of base){
      c.src = c;
      if (o.couleurForcee) c.col = o.couleurForcee;
    }
    return base;
  }
  const sortie = [];
  for (const origine of base){
    const c = normaliserCourbe(transformerCourbe(origine, o.t));
    if (!courbeValide(c)) continue;
    c.src = origine;                 // pour pouvoir masquer ou supprimer depuis la liste
    c.cache = !!origine.cache;
    if (o.couleurForcee) c.col = o.couleurForcee;
    else if (o.palette || !c.col) c.col = PALETTE[sortie.length % PALETTE.length];
    sortie.push(c);
  }
  return sortie;
}

function courbesScene(){
  // push.apply fait exploser la pile passé une centaine de milliers d'éléments
  if (scene.objets.length === 1) return courbesObjet(scene.objets[0]);
  const out = [];
  for (const o of scene.objets){
    const liste = courbesObjet(o);
    for (let i = 0; i < liste.length; i++) out.push(liste[i]);
  }
  return out;
}

// Place les objets : les uns à côté des autres sur le sol, le décor en haut
// Le placement automatique, puis par-dessus les corrections demandées
function appliquerPlacement(o, s0, dx0, dy0){
  if (!o.man) o.man = { s: 1, dx: 0, dy: 0 };
  o.t.s = arrondi(s0*o.man.s, 3);
  o.t.dx = arrondi(dx0 + o.man.dx, 2);
  o.t.dy = arrondi(dy0*o.man.s + o.man.dy, 2);
}

/* Où poser un objet accroché à un autre : sur la tête, dedans, dessous… */
function ancrer(o, cible){
  const b = bboxListe(o.base.filter(c => c && !c.supprime));
  const bc = bboxListe(cible.base.filter(c => c && !c.supprime));
  if (!b || !bc) return false;
  const T = cible.t;
  const cx0 = bc.x0*T.s + T.dx, cx1 = bc.x1*T.s + T.dx;
  const cy0 = bc.y0*T.s + T.dy, cy1 = bc.y1*T.s + T.dy;
  const larg = cx1 - cx0, haut = cy1 - cy0, cxm = (cx0 + cx1)/2;
  const prop = { sur: 0.32, sous: 0.3, dans: 0.45, devant: 0.55, derriere: 0.8, tient: 0.28 };
  const p = prop[o.relation.type] || 0.35;
  const s = arrondi(Math.max(p*larg/b.w, 0.02), 3);
  o.t.s = s;
  const pose = (x, y) => { o.t.dx = arrondi(x - b.x0*s, 2); o.t.dy = arrondi(y - b.y0*s, 2); };
  const demi = b.w*s/2;
  switch (o.relation.type){
    case "sur":      pose(cxm - demi, cy1 - b.h*s*0.12); break;
    case "sous":     pose(cxm - demi, cy0 - b.h*s*0.88); break;
    case "dans":     pose(cxm - demi, cy0 + haut/2 - b.h*s/2); break;
    case "devant":   pose(cxm - demi + larg*0.1, cy0); break;
    case "derriere": pose(cxm - demi - larg*0.18, cy0 + haut*0.25); break;
    case "tient":    pose(cx1 - demi*0.4, cy0 + haut*0.35); break;
    default:         pose(cxm - demi, cy1); break;
  }
  return true;
}

function placerScene(){
  const attaches = scene.objets.filter(o => o.relation && scene.objets[o.relation.cible]);
  const libres = scene.objets.filter(o => attaches.indexOf(o) < 0);
  const sol = libres.filter(o => !o.ciel);
  const ciel = libres.filter(o => o.ciel);
  // un seul objet en mode formules : on garde ses coordonnées d'origine,
  // les équations restent avec des nombres ronds.
  if (scene.objets.length === 1 && scene.objets[0].info === "formules"){
    appliquerPlacement(scene.objets[0], 1, 0, 0);
    return;
  }
  if (!sol.length && !ciel.length) return;
  let curseur = 0;
  sol.forEach((o, i) => {
    const b = bboxListe(o.base.filter(c => c && o.retirees.indexOf(c.part) < 0));
    if (!b){ appliquerPlacement(o, 1, 0, 0); return; }
    const hCible = i === 0 ? 9 : 6.5;
    // l'échelle se calcule sur la taille d'origine : enlever une cheminée
    // ne doit pas faire grossir toute la maison.
    if (!o.ref || o.refInfo !== o.info){ o.ref = b; o.refInfo = o.info; }
    const s = arrondi(Math.min(hCible/o.ref.h, 12/o.ref.w), 2);
    o.pos = { s: s, dx: arrondi(curseur - b.x0*s, 1), dy: arrondi(-b.y0*s, 1) };
    curseur += b.w*s + 1.3;
  });
  const largeur = Math.max(curseur - 1.3, 6);
  sol.forEach(o => { if (o.pos) appliquerPlacement(o, o.pos.s, arrondi(o.pos.dx - largeur/2, 1), o.pos.dy); });
  // les objets accrochés se placent après leur cible (et en chaîne si besoin)
  for (let passe = 0; passe < 4; passe++){
    let reste = false;
    for (const o of attaches){
      if (o._ancre) continue;
      const cible = scene.objets[o.relation.cible];
      if (cible.relation && !cible._ancre && attaches.indexOf(cible) >= 0){ reste = true; continue; }
      o._ancre = ancrer(o, cible);
      if (!o._ancre) o._ancre = true;
    }
    if (!reste) break;
  }
  attaches.forEach(o => { o._ancre = false; });

  ciel.forEach((o, i) => {
    const b = bboxListe(o.base.filter(c => c && o.retirees.indexOf(c.part) < 0));
    if (!b){ appliquerPlacement(o, 1, 0, 10); return; }
    if (!o.ref || o.refInfo !== o.info){ o.ref = b; o.refInfo = o.info; }
    const s = arrondi(Math.min(4.4/o.ref.h, 5.5/o.ref.w), 2);
    const n = ciel.length;
    const cx = (i + 1)/(n + 1)*largeur - largeur/2 + largeur*0.12;
    appliquerPlacement(o, s, arrondi(cx - (b.x0 + b.w/2)*s, 1), arrondi(10.2 - b.y0*s, 1));
  });
}

function memoriser(){
  const copie = scene.objets.map(o => {
    const c = Object.assign({}, o);
    c.base = null;
    c.t = Object.assign({}, o.t);
    c.man = Object.assign({}, o.man || { s:1, dx:0, dy:0 });
    c.opts = Object.assign({}, o.opts);
    c.retirees = o.retirees.slice();
    return c;
  });
  scene.historique.push({ objets: copie, mode: scene.mode, cible: scene.cible, couleurs: scene.couleurs, demande: scene.demande });
  if (scene.historique.length > 30) scene.historique.shift();
}

function annulerDerniere(){
  if (scene.historique.length < 1) return false;
  const e = scene.historique.pop();
  scene.objets = e.objets;
  scene.mode = e.mode; scene.cible = e.cible; scene.couleurs = e.couleurs; scene.demande = e.demande;
  scene.objets.forEach(regenererBase);
  return true;
}

/* ---------- Analyse de la demande ------------------------------------- */

const MOTS_INUTILES = ["dessine","dessiner","dessin","trace","tracer","fais","faire","moi","genere","generer",
  "cree","creer","montre","montrer","je","veux","voudrais","peux","tu","stp","s","il","te","plait","please",
  "un","une","des","le","la","les","du","de","d","l","au","aux","mon","ma","mes","ce","cette"];

function nettoyerSujet(p){
  const mots = p.trim().split(/\s+/).filter(Boolean);
  while (mots.length && MOTS_INUTILES.indexOf(mots[0]) >= 0) mots.shift();
  return mots.join(" ").trim();
}

/* « une pomme sur un chat » : deux sujets ET une relation. C'est elle qui
   permet de fusionner les deux dessins au lieu de les poser côte à côte. */
const RELATIONS = [
  ["au dessus de", "sur"], ["par dessus", "sur"], ["qui porte", "sur"], ["sur", "sur"],
  ["en dessous de", "sous"], ["sous", "sous"],
  ["a l interieur de", "dans"], ["dedans", "dans"], ["dans", "dans"],
  ["a cote de", "cote"], ["a cote", "cote"],
  ["devant", "devant"], ["derriere", "derriere"], ["qui tient", "tient"],
  ["ainsi que", "et"], ["avec", "et"], ["puis", "et"], ["et", "et"], ["plus", "et"]
];

function analyserDemande(txt){
  let reste = " " + normaliser(txt).replace(/[,+]/g, " et ") + " ";
  const sujets = [];
  let garde = 0;
  while (reste.trim() && garde++ < 8){
    let trouve = null;
    for (const [marque, type] of RELATIONS){
      const i = reste.indexOf(" " + marque + " ");
      if (i >= 0 && (!trouve || i < trouve.i)) trouve = { i: i, type: type, saut: marque.length + 2 };
    }
    if (!trouve){
      const m = nettoyerSujet(reste);
      if (m) sujets.push({ mot: m, rel: null });
      break;
    }
    const gauche = nettoyerSujet(reste.slice(0, trouve.i));
    if (gauche) sujets.push({ mot: gauche, rel: trouve.type });
    reste = " " + reste.slice(trouve.i + trouve.saut) + " ";
  }
  return sujets;
}

// « un chat bleu » : le mot de couleur sort du sujet et devient la couleur du tracé
function extraireCouleur(sujet){
  const mots = normaliser(sujet).split(" ").filter(Boolean);
  if (mots.length < 2) return { mot: mots.join(" "), col: null };
  let col = null;
  const restants = [];
  for (const m of mots){
    const sing = m.replace(/s$/, "");
    const c = COULEURS_MOTS[m] || COULEURS_MOTS[sing];
    if (c && !col && restants.length + 1 < mots.length + 1){ col = c; continue; }
    restants.push(m);
  }
  return { mot: (restants.length ? restants : mots).join(" "), col: col };
}

function construireScene(demande){
  const sujets = analyserDemande(demande);
  if (!sujets.length) return { ok: false, message: "Écris ce que tu veux dessiner, par exemple « une maison »." };
  scene.demande = demande;
  const liste = sujets.slice(0, 6);
  scene.objets = liste.map(sujet => {
    const d = extraireCouleur(sujet.mot);
    const o = creerObjet(d.mot || sujet.mot, "mot");
    if (d.col){ o.couleurForcee = d.col; o.couleurDemandee = true; }
    o.graine = scene.graine;
    return o;
  });
  // « pomme SUR chat » : la pomme s'accroche au chat, elle ne se pose pas au sol
  liste.forEach((sujet, i) => {
    const suivant = scene.objets[i+1];
    if (!suivant || !sujet.rel || sujet.rel === "et" || sujet.rel === "cote") return;
    scene.objets[i].relation = { type: sujet.rel, cible: i + 1 };
  });
  return { ok: true, sujets: sujets };
}

function ajouterObjetMot(mot){
  const o = creerObjet(mot, "mot");
  o.mode = scene.mode; o.cible = cibleParObjet(scene.objets.length + 1); o.couleurs = scene.couleurs;
  regenererBase(o);
  if (!o.base.length) return null;
  scene.objets.push(o);
  placerScene();
  return o;
}

function objetDepuisSource(nom, type, canvas){
  const o = creerObjet(nom, type, canvas);
  o.mode = "tracage"; o.cible = scene.cible; o.couleurs = scene.couleurs;   // une image = un seul objet
  regenererBase(o);
  return o;
}

/* ---------- 9. Les reproches : corriger le dessin en français ---------- */

const PIECES = {
  toit:["toit","toiture"], cheminee:["cheminee"], fumee:["fumee"], porte:["porte"],
  fenetre:["fenetre","fenetres","vitre","vitres"], mur:["mur","murs"], roue:["roue","roues"],
  hublot:["hublot"], flamme:["flamme","flammes","feu"], moustache:["moustache","moustaches"],
  oreille:["oreille","oreilles"], oeil:["oeil","yeux"], tronc:["tronc"], rayon:["rayon","rayons"],
  feuille:["feuille","feuilles","feuillage"], tige:["tige"], queue:["queue"]
};

const COULEURS_MOTS = {
  rouge:"#e2564d", bleu:"#2d70f5", bleue:"#2d70f5", vert:"#3ec46d", verte:"#3ec46d",
  jaune:"#f2c744", orange:"#f08a35", violet:"#c07cf5", violette:"#c07cf5", rose:"#f27a9b",
  blanc:"#e8edf7", blanche:"#e8edf7", noir:"#8a94ab", gris:"#9aa6bf", grise:"#9aa6bf",
  marron:"#c08a55", brun:"#c08a55", cyan:"#48c7d0", turquoise:"#48c7d0"
};

function trouverPiece(n){
  for (const cle in PIECES) for (const m of PIECES[cle])
    if (new RegExp("\\b" + m + "\\b").test(n)) return cle;
  return null;
}

function trouverObjet(n){
  for (const o of scene.objets){
    const m = normaliser(o.mot);
    if (m && new RegExp("\\b" + m.replace(/[.*+?^${}()|[\]\\]/g,"") + "\\b").test(n)) return o;
  }
  return null;
}

function objetPrincipal(){ return scene.objets.length ? scene.objets[0] : null; }

function appliquerReproche(txt){
  const n = normaliser(txt);
  if (!n) return { ok:false, message:"Dis-moi ce qui ne va pas." };

  if (/\b(annule|annuler|retour|reviens|undo|avant)\b/.test(n)){
    if (annulerDerniere()) return { ok:true, message:"C'est annulé, on revient au dessin d'avant." };
    return { ok:false, message:"Il n'y a rien à annuler." };
  }

  memoriser();
  const cible = trouverObjet(n) || objetPrincipal();
  if (!cible) return { ok:false, message:"Il n'y a encore rien à corriger : demande d'abord un dessin." };
  const piece = trouverPiece(n);
  const tous = /\b(tout|tous|toute|entier|dessin|scene)\b/.test(n);
  const vises = tous ? scene.objets : [cible];
  const modele = cible.modele && MODELES[cible.modele];
  const options = (modele && modele.options) || [];
  const nomCible = cible.mot;

  const grand = /\b(plus (grand|gros|grande|large|haut|haute|long|longue)|agrandis|agrandir|grossis|trop petit|trop petite|minuscule|plus grand)\b/.test(n);
  const petit = /\b(plus (petit|petite|fin|mince|bas|basse|court|courte)|reduis|reduire|diminue|retrecis|trop grand|trop grande|trop gros|enorme)\b/.test(n);
  const facteurTexte = n.match(/\b(?:fois|x|\*)\s*([0-9]+(?:[.,][0-9]+)?)/);
  let facteur = grand ? 1.35 : (petit ? 1/1.35 : 1);
  if (facteurTexte){
    const v = parseFloat(facteurTexte[1].replace(",", "."));
    if (isFinite(v) && v > 0.05 && v < 20) facteur = petit ? 1/v : v;
  }
  if (/\b(deux fois plus (grand|gros))\b/.test(n)) facteur = 2;
  if (/\b(deux fois plus (petit|petite))\b/.test(n)) facteur = 0.5;

  /* --- enlever --- */
  if (/\b(enleve|enlever|supprime|supprimer|retire|retirer|vire|sans|cache)\b/.test(n)){
    if (piece){
      if (options.indexOf(piece) >= 0){ cible.opts[piece] = false; regenererBase(cible); placerScene();
        return { ok:true, message:"D'accord, j'enlève " + piece + " sur " + nomCible + "." }; }
      let trouve = false;
      for (const o of vises){
        if (o.base.some(c => c && c.part === piece)){ o.retirees.push(piece); trouve = true; }
      }
      if (trouve){ placerScene(); return { ok:true, message:"C'est enlevé : " + piece + "." }; }
      return { ok:false, message:"Je ne trouve pas « " + piece + " » dans ce dessin." };
    }
    const objVise = trouverObjet(n);
    if (objVise && scene.objets.length > 1){
      scene.objets = scene.objets.filter(o => o !== objVise);
      placerScene();
      return { ok:true, message:"J'ai retiré " + objVise.mot + " de la scène." };
    }
    return { ok:false, message:"Précise ce que j'enlève : « enlève la cheminée », « enlève le sapin »." };
  }

  /* --- ajouter --- */
  if (/\b(ajoute|ajouter|rajoute|mets|met|mettre|avec un|avec une)\b/.test(n)){
    if (piece && options.indexOf(piece) >= 0){
      const v = cible.opts[piece];
      cible.opts[piece] = (typeof v === "number") ? v + 1 : true;
      regenererBase(cible); placerScene();
      return { ok:true, message:"J'ajoute " + piece + " sur " + nomCible + "." };
    }
    if (piece && cible.retirees.indexOf(piece) >= 0){
      cible.retirees = cible.retirees.filter(p => p !== piece);
      placerScene();
      return { ok:true, message:"Je remets " + piece + "." };
    }
    const apres = n.replace(/^.*\b(ajoute|ajouter|rajoute|mets|met|mettre)\b/, "");
    const sujet = nettoyerSujet(apres);
    if (sujet){
      const o = ajouterObjetMot(sujet);
      if (o) return { ok:true, message:"J'ajoute " + sujet + " à la scène." };
      return { ok:false, message:"Je n'arrive pas à tracer « " + sujet + " »." };
    }
    return { ok:false, message:"Dis-moi quoi ajouter : « ajoute un soleil »." };
  }

  /* --- pièce paramétrable (toit plus pointu, porte plus grande...) --- */
  if (piece && (grand || petit || /\bpointu|plat|pentu|haut\b/.test(n))){
    if (options.indexOf(piece) >= 0){
      const actuel = typeof cible.opts[piece] === "number" ? cible.opts[piece] : 1;
      let f = facteur;
      if (/\bpointu|pentu\b/.test(n)) f = 1.3;
      if (/\bplat\b/.test(n)) f = 0.75;
      cible.opts[piece] = borne(actuel*f, 0.2, 4);
      regenererBase(cible); placerScene();
      return { ok:true, message:"Voilà : " + piece + " " + (f >= 1 ? "plus grand" : "plus petit") + " sur " + nomCible + "." };
    }
    // sinon : on agrandit juste cette pièce, autour de son centre
    let touche = 0;
    for (const o of vises){
      const morceaux = o.base.filter(c => c && c.part === piece);
      if (!morceaux.length) continue;
      const b = bboxListe(morceaux);
      if (!b) continue;
      const cx = (b.x0+b.x1)/2, cy = (b.y0+b.y1)/2;
      const remplace = morceaux.map(c => {
        let r = deplacer(c, -cx, -cy);
        r = agrandir(r, facteur);
        r = deplacer(r, cx, cy);
        r.part = c.part; r.col = c.col;
        return r;
      });
      let k = 0;
      o.base = o.base.map(c => (c && c.part === piece) ? remplace[k++] : c);
      touche++;
    }
    if (touche){ placerScene(); return { ok:true, message:(facteur >= 1 ? "J'agrandis " : "Je réduis ") + piece + "." }; }
    return { ok:false, message:"Je ne trouve pas « " + piece + " » dans ce dessin." };
  }

  /* --- taille globale --- */
  if (grand || petit || (facteurTexte && facteur !== 1)){
    vises.forEach(o => { o.man.s = borne(o.man.s*facteur, 0.15, 8); });
    placerScene();
    return { ok:true, message:(facteur >= 1 ? "J'agrandis " : "Je réduis ") + (tous ? "tout le dessin" : nomCible) + "." };
  }

  /* --- déplacement --- */
  const pas = 2.2;
  let bouge = null;
  if (/\b(a gauche|vers la gauche|plus a gauche|gauche)\b/.test(n)) bouge = [-pas, 0];
  else if (/\b(a droite|vers la droite|plus a droite|droite)\b/.test(n)) bouge = [pas, 0];
  else if (/\b(plus haut|monte|vers le haut|en haut|remonte)\b/.test(n)) bouge = [0, pas];
  else if (/\b(plus bas|descend|vers le bas|en bas|baisse)\b/.test(n)) bouge = [0, -pas];
  else if (/\b(au milieu|au centre|centre|recentre)\b/.test(n)) bouge = "centre";
  if (bouge === "centre"){
    scene.objets.forEach(o => { o.man = { s: o.man.s, dx: 0, dy: 0 }; });
    placerScene();
    return { ok:true, message:"Tout est recentré." };
  }
  if (bouge){
    vises.forEach(o => { o.man.dx += bouge[0]; o.man.dy += bouge[1]; });
    placerScene();
    return { ok:true, message:"Déplacé " + (bouge[0] < 0 ? "à gauche" : bouge[0] > 0 ? "à droite" : bouge[1] > 0 ? "vers le haut" : "vers le bas") + "." };
  }

  /* --- retournement / rotation --- */
  if (/\b(retourne|miroir|inverse|autre sens|symetrique)\b/.test(n)){
    vises.forEach(o => { o.t.mir = !o.t.mir; });
    placerScene();
    return { ok:true, message:"Retourné comme dans un miroir." };
  }
  if (/\b(tourne|pivote|rotation|couche|penche)\b/.test(n)){
    const sens = /\b(gauche|antihoraire)\b/.test(n) ? 3 : 1;
    vises.forEach(o => { o.t.rot = (o.t.rot + sens) % 4; });
    placerScene();
    return { ok:true, message:"J'ai fait tourner d'un quart de tour." };
  }

  /* --- niveau de détail / mode --- */
  if (/\b(plus de detail|plus de details|plus precis|plus fin|plus ressemblant|plus realiste|mieux|vrai dessin|plus beau)\b/.test(n)){
    let change = false;
    const avant = scene.cible;
    if (scene.mode === "formules"){   // les modèles tout faits ne peuvent pas être plus détaillés
      scene.mode = "tracage"; change = true;
    } else if (scene.cible < CIBLE_MAX){
      scene.cible = borne(Math.round(scene.cible*2), CIBLE_MIN, CIBLE_MAX); change = true;
    }
    scene.objets.forEach(o => { o.mode = scene.mode; o.cible = cibleParObjet(); regenererBase(o); });
    placerScene();
    majCurseurs();
    return { ok:change, message: change
      ? "Plus de détails : environ " + scene.cible + " fonctions" + (scene.mode === "tracage" && avant === scene.cible ? ", en mode traçage" : "") + "."
      : "C'est déjà le maximum : " + CIBLE_MAX + " fonctions." };
  }
  if (/\b(moins de detail|moins de fonctions|trop de fonctions|simplifie|plus simple|trop complique|allege)\b/.test(n)){
    let change = false;
    if (/\b(fonctions|simple|simplifie)\b/.test(n) && scene.mode === "tracage" && scene.cible <= CIBLE_MIN*2){
      scene.mode = "formules"; change = true;
    } else if (scene.cible > CIBLE_MIN){
      scene.cible = borne(Math.round(scene.cible/2), CIBLE_MIN, CIBLE_MAX); change = true;
    }
    scene.objets.forEach(o => { o.mode = scene.mode; o.cible = cibleParObjet(); regenererBase(o); });
    placerScene();
    majCurseurs();
    return { ok:change, message: change
      ? (scene.mode === "formules" ? "Version plus simple : mode formules."
                                   : "Version plus simple : environ " + scene.cible + " fonctions.")
      : "C'est déjà le plus simple." };
  }
  if (/\b(formules?|equations simples|pour desmos|propre)\b/.test(n)){
    scene.mode = "formules";
    scene.objets.forEach(o => { o.mode = "formules"; regenererBase(o); });
    placerScene();
    return { ok:true, message:"Mode formules : peu d'équations, bien lisibles." };
  }
  if (/\b(tracage|trace le vrai|photo|image reelle)\b/.test(n)){
    scene.mode = "tracage";
    scene.objets.forEach(o => { o.mode = "tracage"; regenererBase(o); });
    placerScene();
    return { ok:true, message:"Mode traçage : beaucoup plus de fonctions, beaucoup plus ressemblant." };
  }

  /* --- couleurs --- */
  if (/\bnoir et blanc\b/.test(n)){
    scene.couleurs = 1;
    majCurseurs();
    scene.objets.forEach(o => { o.couleurs = 1; o.palette = false; o.couleurForcee = "#e8edf7"; regenererBase(o); });
    placerScene();
    return { ok:true, message:"Tout en blanc sur fond sombre." };
  }
  if (/\b(arc en ciel|toutes les couleurs|colore|coloree|multicolore)\b/.test(n)){
    vises.forEach(o => { o.palette = true; o.couleurForcee = null; });
    return { ok:true, message:"Chaque fonction a maintenant sa couleur." };
  }
  if (/\bplus de couleurs\b/.test(n)){
    scene.couleurs = borne(Math.round(scene.couleurs*2) + 1, 1, COULEURS_MAX);
    scene.objets.forEach(o => { o.couleurs = scene.couleurs; o.couleurForcee = null; o.palette = false; regenererBase(o); });
    placerScene();
    majCurseurs();
    return { ok:true, message:"Plus de couleurs : " + scene.couleurs + " calques." };
  }
  if (/\bmoins de couleurs\b/.test(n)){
    scene.couleurs = borne(Math.round(scene.couleurs/2), 1, COULEURS_MAX);
    scene.objets.forEach(o => { o.couleurs = scene.couleurs; o.couleurForcee = null; o.palette = false; regenererBase(o); });
    placerScene();
    majCurseurs();
    return { ok:true, message:"Moins de couleurs : " + scene.couleurs + " calques." };
  }
  for (const mot in COULEURS_MOTS){
    if (new RegExp("\\b" + mot + "\\b").test(n)){
      vises.forEach(o => { o.couleurForcee = COULEURS_MOTS[mot]; o.palette = false; });
      return { ok:true, message:"Tracé en " + mot + "." };
    }
  }

  return { ok:false, message:"Je n'ai pas compris. Essaie : « plus grand », « à gauche », « plus de détails », « enlève la cheminée », « ajoute un soleil », « en rouge », « annule »." };
}

/* ---------- 10. Le repère et le panneau des équations ----------------- */

const cvGraphe = document.getElementById("graphe");
let ctxG = cvGraphe.getContext("2d");
let tailleRendu = null;      // quand on dessine ailleurs que dans la page (export PNG)
let limiteAnim = null;       // animation : on ne trace que les n premières fonctions
const elEtat = document.getElementById("etat");
const elListe = document.getElementById("liste");
const elPagination = document.getElementById("pagination");
const elCompteur = document.getElementById("compteur");
const elJournal = document.getElementById("journal");

let COURBES = [];
let COURBE_SURVOL = null;
let page = 0;
const PAR_PAGE = 200;
let vue = { cx: 0, cy: 5, ppu: 32 };

function redimensionner(){
  const r = cvGraphe.getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  cvGraphe.width = Math.max(1, Math.round(r.width*dpr));
  cvGraphe.height = Math.max(1, Math.round(r.height*dpr));
  ctxG.setTransform(dpr, 0, 0, dpr, 0, 0);
  dessiner();
}

function largeurVue(){ return tailleRendu ? tailleRendu[0] : cvGraphe.width / (Math.min(window.devicePixelRatio || 1, 2)); }
function hauteurVue(){ return tailleRendu ? tailleRendu[1] : cvGraphe.height / (Math.min(window.devicePixelRatio || 1, 2)); }
function versEcranX(x){ return largeurVue()/2 + (x - vue.cx)*vue.ppu; }
function versEcranY(y){ return hauteurVue()/2 - (y - vue.cy)*vue.ppu; }
function versRepereX(px){ return vue.cx + (px - largeurVue()/2)/vue.ppu; }
function versRepereY(py){ return vue.cy - (py - hauteurVue()/2)/vue.ppu; }

function pasGrille(){
  const brut = 80/vue.ppu;
  const p = Math.pow(10, Math.floor(Math.log10(brut)));
  for (const m of [1, 2, 5, 10]) if (p*m >= brut) return p*m;
  return p*10;
}

function dessinerGrille(){
  const W = largeurVue(), H = hauteurVue();
  const pas = pasGrille();
  const x0 = versRepereX(0), x1 = versRepereX(W), y0 = versRepereY(H), y1 = versRepereY(0);
  ctxG.lineWidth = 1;
  ctxG.strokeStyle = "#2a3244";
  ctxG.beginPath();
  for (let x = Math.ceil(x0/pas)*pas; x <= x1; x += pas){
    const px = Math.round(versEcranX(x)) + 0.5;
    ctxG.moveTo(px, 0); ctxG.lineTo(px, H);
  }
  for (let y = Math.ceil(y0/pas)*pas; y <= y1; y += pas){
    const py = Math.round(versEcranY(y)) + 0.5;
    ctxG.moveTo(0, py); ctxG.lineTo(W, py);
  }
  ctxG.stroke();
  // axes
  ctxG.strokeStyle = "#7d8aa5";
  ctxG.lineWidth = 1.4;
  ctxG.beginPath();
  const py0 = Math.round(versEcranY(0)) + 0.5, px0 = Math.round(versEcranX(0)) + 0.5;
  ctxG.moveTo(0, py0); ctxG.lineTo(W, py0);
  ctxG.moveTo(px0, 0); ctxG.lineTo(px0, H);
  ctxG.stroke();
  // graduations
  ctxG.fillStyle = "#9aa6bf";
  ctxG.font = "11px system-ui,sans-serif";
  ctxG.textAlign = "center"; ctxG.textBaseline = "top";
  for (let x = Math.ceil(x0/pas)*pas; x <= x1; x += pas){
    if (Math.abs(x) < pas/2) continue;
    ctxG.fillText(nb(x, 2), versEcranX(x), borne(py0 + 4, 4, H - 16));
  }
  ctxG.textAlign = "right"; ctxG.textBaseline = "middle";
  for (let y = Math.ceil(y0/pas)*pas; y <= y1; y += pas){
    if (Math.abs(y) < pas/2) continue;
    ctxG.fillText(nb(y, 2), borne(px0 - 6, 26, W - 4), versEcranY(y));
  }
}

let MODE_LOURD = false;        // au-delà de 30 000 courbes : pas de cache, image figée
let bitmapCache = null;
let redessinDifferé = null;

function echantillonsAffichage(c){
  if (MODE_LOURD){
    const n = c.fam === "cercle" ? 20 : borne(Math.round(Math.abs(c.dom[1]-c.dom[0])*vue.ppu/4), 4, 40);
    return echantillonsCourbe(c, n);
  }
  if (c._ppu === vue.ppu && c._ech) return c._ech;
  let n;
  if (c.fam === "cercle") n = borne(Math.round(2*Math.PI*c.p.r*vue.ppu/5), 32, 400);
  else n = borne(Math.round(Math.abs(c.dom[1]-c.dom[0])*vue.ppu/3), 12, 320);
  c._ech = echantillonsCourbe(c, n);
  c._ppu = vue.ppu;
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const p of c._ech){
    if (!p) continue;
    if (p[0] < x0) x0 = p[0]; if (p[0] > x1) x1 = p[0];
    if (p[1] < y0) y0 = p[1]; if (p[1] > y1) y1 = p[1];
  }
  c._bb = isFinite(x0) ? [x0, y0, x1, y1] : null;
  return c._ech;
}

// Trace une courbe dans le chemin en cours
function ajouterChemin(c, W, H){
  const pts = echantillonsAffichage(c);
  let leve = true;
  for (const p of pts){
    if (!p){ leve = true; continue; }
    const px = versEcranX(p[0]), py = versEcranY(p[1]);
    if (px < -4000 || px > W + 4000 || py < -4000 || py > H + 4000){ leve = true; continue; }
    if (leve){ ctxG.moveTo(px, py); leve = false; } else ctxG.lineTo(px, py);
  }
}

/* Dix mille courbes, c'est dix mille appels de tracé si on s'y prend mal.
   On regroupe donc par couleur (une centaine au plus) et on saute tout ce
   qui ne touche pas l'écran. */
function dessinerCourbes(liste){
  const W = largeurVue(), H = hauteurVue();
  const xmin = versRepereX(0), xmax = versRepereX(W);
  const ymin = versRepereY(H), ymax = versRepereY(0);
  ctxG.lineWidth = 2.1;
  ctxG.lineJoin = "round"; ctxG.lineCap = "round";
  const groupes = new Map();
  for (const c of (liste || COURBES)){
    if (c.cache) continue;
    if (!MODE_LOURD){
      echantillonsAffichage(c);
      const bb = c._bb;
      if (!bb) continue;
      if (bb[2] < xmin || bb[0] > xmax || bb[3] < ymin || bb[1] > ymax) continue;
    }
    const col = c.col || "#2d70f5";
    let g = groupes.get(col);
    if (!g){ g = []; groupes.set(col, g); }
    g.push(c);
  }
  groupes.forEach((liste, col) => {
    ctxG.strokeStyle = col;
    ctxG.beginPath();
    for (const c of liste) ajouterChemin(c, W, H);
    ctxG.stroke();
  });
  if (COURBE_SURVOL && !COURBE_SURVOL.cache){
    ctxG.strokeStyle = "#ffffff";
    ctxG.lineWidth = 4;
    ctxG.beginPath();
    ajouterChemin(COURBE_SURVOL, W, H);
    ctxG.stroke();
    ctxG.lineWidth = 2.1;
  }
}

function dessinerTout(){
  ctxG.clearRect(0, 0, largeurVue(), hauteurVue());
  ctxG.fillStyle = "#1b2130";
  ctxG.fillRect(0, 0, largeurVue(), hauteurVue());
  dessinerGrille();
  dessinerCourbes(limiteAnim === null ? null : COURBES.slice(0, limiteAnim));
}

/* Avec des dizaines de milliers de courbes, on ne redessine pas à chaque
   déplacement : on garde une image figée qu'on fait glisser, et on relance le
   vrai tracé quand la main s'arrête. */
function dessiner(){
  if (!MODE_LOURD || tailleRendu){ dessinerTout(); return; }
  const W = largeurVue(), H = hauteurVue();
  if (bitmapCache && bitmapCache.ppu === vue.ppu && bitmapCache.cx === vue.cx && bitmapCache.cy === vue.cy){
    ctxG.drawImage(bitmapCache.canvas, 0, 0, W, H);
    return;
  }
  if (bitmapCache){
    // aperçu : on décale et met à l'échelle l'image précédente
    const k = vue.ppu/bitmapCache.ppu;
    const dx = (bitmapCache.cx - vue.cx)*vue.ppu, dy = (vue.cy - bitmapCache.cy)*vue.ppu;
    ctxG.fillStyle = "#1b2130";
    ctxG.fillRect(0, 0, W, H);
    ctxG.save();
    ctxG.translate(W/2 + dx, H/2 + dy);
    ctxG.scale(k, k);
    ctxG.drawImage(bitmapCache.canvas, -W/2, -H/2, W, H);
    ctxG.restore();
    if (redessinDifferé) clearTimeout(redessinDifferé);
    redessinDifferé = setTimeout(() => { redessinDifferé = null; figerImage(); }, 260);
    return;
  }
  figerImage();
}

function figerImage(){
  const W = largeurVue(), H = hauteurVue();
  const cv = document.createElement("canvas");
  cv.width = Math.max(1, Math.round(W)); cv.height = Math.max(1, Math.round(H));
  const memoCtx = ctxG, memoTaille = tailleRendu;
  ctxG = cv.getContext("2d"); tailleRendu = [W, H];
  try { dessinerTout(); } finally { ctxG = memoCtx; tailleRendu = memoTaille; }
  bitmapCache = { canvas: cv, cx: vue.cx, cy: vue.cy, ppu: vue.ppu };
  ctxG.drawImage(cv, 0, 0, W, H);
}

/* --- L'image PNG : la vue courante redessinée en double résolution --- */
function exporterPNG(){
  const W = largeurVue(), H = hauteurVue(), k = 2;
  const cv = document.createElement("canvas");
  cv.width = Math.round(W*k); cv.height = Math.round(H*k);
  const ctx = cv.getContext("2d");
  ctx.setTransform(k, 0, 0, k, 0, 0);
  const memoCtx = ctxG, memoTaille = tailleRendu, memoSurvol = COURBE_SURVOL;
  ctxG = ctx; tailleRendu = [W, H]; COURBE_SURVOL = null;
  try { dessiner(); } finally { ctxG = memoCtx; tailleRendu = memoTaille; COURBE_SURVOL = memoSurvol; }
  const fini = (ok, url) => {
    if (ok) journal("Image enregistrée : " + COURBES.length + " fonctions en PNG.", "app");
    else if (url){ window.open(url, "_blank"); journal("Le téléchargement est bloqué ici : j'ai ouvert l'image dans un onglet, fais un clic droit pour l'enregistrer.", "app", true); }
    else journal("Je n'arrive pas à fabriquer l'image sur cet appareil.", "app", true);
  };
  try {
    cv.toBlob(blob => {
      if (!blob){ fini(false, null); return; }
      const url = URL.createObjectURL(blob);
      try {
        const a = document.createElement("a");
        if (typeof a.download !== "string"){ fini(false, url); return; }
        a.href = url;
        a.download = "funcora-" + (scene.demande || "dessin").replace(/[^a-z0-9]+/gi, "-").slice(0, 30) + ".png";
        document.body.appendChild(a);
        a.click();
        a.remove();
        fini(true);
      } catch (e){ fini(false, url); }
      setTimeout(() => URL.revokeObjectURL(url), 8000);
    }, "image/png");
  } catch (e){ fini(false, null); }
}

/* --- Le mode Max : 10 000, 100 000, un million ---------------------------
   Ici on ne répartit plus un budget : on pousse la machine. Le calcul se fait
   par lots pour que la page respire, le bouton Arrêter coupe, et le compte
   annoncé à la fin est le vrai. */
let maxEnCours = false, ANNULER = false;

function majBoutonsMax(){
  const stop = document.getElementById("btnStopMax");
  if (stop) stop.hidden = !maxEnCours;
  document.querySelectorAll(".palier").forEach(b => { b.disabled = maxEnCours; });
}

function lancerMax(cible){
  if (maxEnCours) return;
  const o = scene.objets[0];
  if (!o){ journal("Demande d'abord un dessin, ensuite je le pousse au maximum.", "app", true); return; }
  const memoire = navigator.deviceMemory || 8;
  if (cible >= 1000000 && memoire < 4){
    journal("Cette machine annonce " + memoire + " Go de mémoire : un million de fonctions la ferait tomber. Essaie 100 k.", "app", true);
    return;
  }
  maxEnCours = true; ANNULER = false;
  majBoutonsMax();
  nouveauLoader("Mode Max : " + cible.toLocaleString("fr-FR") + " fonctions");
  const t0 = performance.now();
  const taille = tailleMax(cible);
  let prep = null, iContour = 0, tolMin = 0;
  let eImage = null, eContours = null, eAjuste = null;
  const courbes = [];

  const finir = (coupe) => {
    maxEnCours = false;
    majBoutonsMax();
    if (eAjuste) etapeFin(eAjuste, !coupe, courbes.length.toLocaleString("fr-FR") + " équations" +
      (coupe ? " (arrêté)" : ""));
    const eMenage = etapeDebut("Je vérifie et je range");
    const propres = nettoyerCourbes(courbes, prep ? prep.unite : 0.01, null, true);
    etapeFin(eMenage, true, propres.length.toLocaleString("fr-FR") + " gardées");
    o.base = propres;
    o.t = { s: 1, dx: 0, dy: 0, mir: false, rot: 0 };
    o.man = { s: 1, dx: 0, dy: 0 };
    o.info = o.info === "formules" ? "tracage" : o.info;
    scene.cible = Math.min(cible, CIBLE_MAX);
    majTout(true);
    const ms = Math.round(performance.now() - t0);
    const n = COURBES.length;
    etat("Max : " + n.toLocaleString("fr-FR") + " fonctions en " + (ms/1000).toFixed(1) + " s");
    fermerLoader(12000);
    journal((coupe ? "Arrêté à " : "Mode Max : ") + n.toLocaleString("fr-FR") + " fonctions sur les " +
      cible.toLocaleString("fr-FR") + " demandées, en " + (ms/1000).toFixed(1) + " s" +
      (n < cible*0.9 && !coupe ? " — le dessin n'avait pas plus de détail à donner, même en " +
        taille + " px : c'est son maximum, pas celui de la machine." : ".") +
      " Desmos ne digérera pas ça d'un coup : utilise le .txt ou les lots de 200.", "app");
  };

  const lot = () => {
    if (ANNULER){ finir(true); return; }
    if (!prep){
      const cv = (o.type === "mot") ? canvasMot(o.mot, taille) : canvasAjuste(o.src, taille);
      etapeFin(eImage, true, cv.width + " × " + cv.width + " pixels");
      eContours = etapeDebut("Je suis tous les contours, toutes les couleurs");
      const ctx = cv.getContext("2d", { willReadFrequently: true });
      // en mode Max, on prend toutes les couleurs : chaque calque apporte ses contours
      prep = preparerContours(ctx, cv.width, { cible: cible, couleurs: COULEURS_MAX, hauteur: 10, max: true });
      tolMin = prep.reg.plancher*prep.unite;
      etapeFin(eContours, prep.morceaux.length > 0,
        prep.morceaux.length.toLocaleString("fr-FR") + " contours, " + prep.calques + " calques");
      eAjuste = etapeDebut("J'ajuste au maximum");
      etat("Max : " + prep.morceaux.length + " contours trouvés en " + taille + " px, j'ajuste…");
      setTimeout(lot, 0);
      return;
    }
    const fin = Math.min(prep.morceaux.length, iContour + 30);
    for (; iContour < fin && courbes.length < cible; iContour++){
      const m = prep.morceaux[iContour];
      for (const c of polyligneVersCourbes(m.pts, tolMin, { rapide: true, coins: false })){
        if (!c) continue;
        c.col = m.col;
        courbes.push(c);
      }
    }
    if (iContour >= prep.morceaux.length || courbes.length >= cible){ finir(false); return; }
    etat("Max : " + courbes.length.toLocaleString("fr-FR") + " fonctions… (" +
      iContour + "/" + prep.morceaux.length + " contours)");
    if (eAjuste) eAjuste.el.querySelector(".ms").textContent =
      courbes.length.toLocaleString("fr-FR") + " · " + Math.round(iContour/prep.morceaux.length*100) + " %";
    setTimeout(lot, 0);
  };
  eImage = etapeDebut("Je prépare une image de départ très fine");
  etat("Max : je prépare une image de " + taille + " × " + taille + "…");
  setTimeout(lot, 0);
}

/* --- L'animation : les fonctions apparaissent une à une --- */
let animation = null;
function arreterAnimation(){
  if (animation) cancelAnimationFrame(animation);
  animation = null;
  limiteAnim = null;
  const b = document.getElementById("btnRejouer");
  if (b) b.textContent = "Rejouer";
  dessiner();
}

function rejouerTrace(){
  if (animation){ arreterAnimation(); return; }
  if (!COURBES.length){ journal("Demande d'abord un dessin.", "app", true); return; }
  const total = COURBES.length;
  const pas = Math.max(1, Math.round(total/110));      // environ deux secondes
  const b = document.getElementById("btnRejouer");
  if (b) b.textContent = "Arrêter";
  limiteAnim = 0;
  const image = () => {
    limiteAnim = Math.min(total, limiteAnim + pas);
    dessiner();
    if (limiteAnim >= total){ arreterAnimation(); return; }
    animation = requestAnimationFrame(image);
  };
  animation = requestAnimationFrame(image);
}

function recadrer(){
  const b = bboxListe(COURBES);
  if (!b){ vue = { cx: 0, cy: 5, ppu: 32 }; dessiner(); return; }
  const W = largeurVue(), H = hauteurVue();
  const marge = 0.12;
  vue.ppu = borne(Math.min(W/(b.w*(1+marge*2)), H/(b.h*(1+marge*2))), 1, 400);
  vue.cx = (b.x0 + b.x1)/2;
  vue.cy = (b.y0 + b.y1)/2;
  COURBES.forEach(c => { c._ech = null; });
  dessiner();
}

/* --- panneau des équations --- */

function majPanneau(){
  const n = COURBES.length;
  const masquees = COURBES.filter(c => c.cache).length;
  elCompteur.innerHTML = "<b>" + n + "</b> fonction" + (n > 1 ? "s" : "") +
    (masquees ? ", " + masquees + " masquée" + (masquees > 1 ? "s" : "") : "");
  const pages = Math.max(1, Math.ceil(n/PAR_PAGE));
  if (page >= pages) page = pages - 1;
  const debut = page*PAR_PAGE, fin = Math.min(n, debut + PAR_PAGE);
  const frag = document.createDocumentFragment();
  for (let i = debut; i < fin; i++){
    const c = COURBES[i];
    const d = document.createElement("div");
    d.className = "eq" + (c.cache ? " masquee" : "");
    const past = document.createElement("span");
    past.className = "pastille";
    past.style.background = c.col || "#2d70f5";
    const f = document.createElement("span");
    f.className = "form";
    const txt = texteEquation(c, "uni");
    const coupe = txt.indexOf(" {");
    if (coupe > 0){
      f.appendChild(document.createTextNode(txt.slice(0, coupe)));
      const dom = document.createElement("span");
      dom.className = "dom";
      dom.textContent = txt.slice(coupe);
      f.appendChild(dom);
    } else f.textContent = txt;
    const actions = document.createElement("span");
    actions.className = "actes";
    const oeil = document.createElement("button");
    oeil.className = "ico";
    oeil.title = c.cache ? "Remontrer cette courbe" : "Masquer cette courbe";
    oeil.textContent = c.cache ? "◌" : "◉";
    oeil.onclick = e => {
      e.stopPropagation();
      if (c.src) c.src.cache = !c.src.cache;
      c.cache = !c.cache;
      dessiner();
      majPanneau();
    };
    const gomme = document.createElement("button");
    gomme.className = "ico";
    gomme.title = "Supprimer cette équation";
    gomme.textContent = "\u2715";
    gomme.onclick = e => {
      e.stopPropagation();
      memoriser();
      if (c.src) c.src.supprime = true;
      COURBE_SURVOL = null;
      majTout(false);
    };
    actions.appendChild(oeil); actions.appendChild(gomme);
    d.appendChild(past); d.appendChild(f); d.appendChild(actions);
    d.onmouseenter = () => { COURBE_SURVOL = c; dessiner(); };
    d.onmouseleave = () => { if (COURBE_SURVOL === c){ COURBE_SURVOL = null; dessiner(); } };
    frag.appendChild(d);
  }
  elListe.innerHTML = "";
  elListe.appendChild(frag);
  elListe.scrollTop = 0;
  majBoutonCopie();
  elPagination.innerHTML = "";
  if (pages > 1){
    const prec = document.createElement("button");
    prec.textContent = "◀";
    prec.disabled = page === 0;
    prec.onclick = () => { page--; majPanneau(); };
    const suiv = document.createElement("button");
    suiv.textContent = "▶";
    suiv.disabled = page >= pages - 1;
    suiv.onclick = () => { page++; majPanneau(); };
    const txt = document.createElement("span");
    txt.textContent = "équations " + (debut+1) + " à " + fin + " sur " + n;
    elPagination.appendChild(prec); elPagination.appendChild(txt); elPagination.appendChild(suiv);
  } else if (n){
    const txt = document.createElement("span");
    txt.textContent = "toutes les équations sont affichées";
    elPagination.appendChild(txt);
  }
}

const LOT_COPIE = 200;
let lotCopie = 0;

function formatChoisi(){
  const el = document.getElementById("format");
  return el && el.value === "texte" ? "texte" : "latex";
}

// N'exporte que des équations relues et vérifiées : ce qui part dans Desmos
// redonne exactement la courbe affichée. La relecture ne porte que sur le lot
// demandé — vérifier dix mille lignes à chaque clic ne servirait à rien.
function courbesVisibles(){ return COURBES.filter(c => !c.cache); }

function equationsExport(style, debut, fin){
  const source = courbesVisibles();
  const d = debut || 0, f = (fin === undefined || fin === null) ? source.length : fin;
  const lignes = [];
  let refus = 0;
  for (let i = d; i < Math.min(f, source.length); i++){
    const v = verifierCourbe(source[i], style);
    if (v.ok) lignes.push(v.txt); else refus++;
  }
  return { lignes: lignes, refus: refus, total: source.length };
}

function texteExport(style){ return equationsExport(style || formatChoisi()).lignes.join("\n"); }

function majBoutonCopie(){
  const b = document.getElementById("btnCopier");
  const tout = document.getElementById("btnCopierTout");
  if (!b) return;
  const n = courbesVisibles().length;
  if (n <= LOT_COPIE){
    lotCopie = 0;
    b.textContent = "Copier pour Desmos";
    if (tout) tout.hidden = true;
    return;
  }
  if (tout) tout.hidden = false;
  if (lotCopie*LOT_COPIE >= n) lotCopie = 0;
  const debut = lotCopie*LOT_COPIE + 1, fin = Math.min(n, (lotCopie + 1)*LOT_COPIE);
  b.textContent = (lotCopie === 0 ? "Copier " : "Lot suivant ") + debut + "\u2013" + fin;
}

function copierTexte(texte, fini){
  if (navigator.clipboard && navigator.clipboard.writeText)
    navigator.clipboard.writeText(texte).then(() => fini(true), () => fini(copierRepli(texte)));
  else fini(copierRepli(texte));
}

/* À ces volumes le presse-papier ne suit plus : on écrit un fichier. */
function telechargerEquations(){
  const style = formatChoisi();
  const visibles = courbesVisibles();
  if (!visibles.length){ journal("Il n'y a encore aucune équation.", "app", true); return; }
  const morceaux = [];
  const lot = 5000;
  for (let i = 0; i < visibles.length; i += lot){
    const bout = [];
    for (let j = i; j < Math.min(i + lot, visibles.length); j++) bout.push(texteEquation(visibles[j], style));
    morceaux.push(bout.join("\n") + "\n");
  }
  // on relit un échantillon : tout relire prendrait des minutes à un million
  let ko = 0;
  const pas = Math.max(1, Math.floor(visibles.length/300));
  let testees = 0;
  for (let i = 0; i < visibles.length; i += pas){ testees++; if (!verifierCourbe(visibles[i], style).ok) ko++; }
  try {
    const blob = new Blob(morceaux, { type: "text/plain;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "funcora-" + visibles.length + "-fonctions.txt";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 8000);
    journal("Fichier écrit : " + visibles.length.toLocaleString("fr-FR") + " équations " +
      (style === "latex" ? "en LaTeX" : "en texte simple") + " (" + (ko ? ko + " douteuses sur " + testees + " relues" : testees + " relues au hasard, toutes justes") + ").", "app", ko > 0);
  } catch (e){
    journal("Impossible d'écrire le fichier ici : " + e.message, "app", true);
  }
}

function copierPourDesmos(tout){
  const style = formatChoisi();
  const total = courbesVisibles().length;
  if (!total){ journal("Il n'y a encore aucune équation à copier.", "app", true); return; }
  let debut = 0, fin = total, parLot = false;
  if (!tout && total > LOT_COPIE){
    debut = lotCopie*LOT_COPIE;
    if (debut >= total){ debut = 0; lotCopie = 0; }
    fin = Math.min(total, debut + LOT_COPIE);
    parLot = true;
  }
  const r = equationsExport(style, debut, fin);
  if (!r.lignes.length){ journal("Aucune équation n'a passé la relecture dans ce lot.", "app", true); return; }
  copierTexte(r.lignes.join("\n"), ok => {
    if (!ok){ journal("Copie impossible ici : sélectionne les équations dans la liste.", "app", true); return; }
    const nom = style === "latex" ? "en LaTeX" : "en texte simple";
    let msg = parLot
      ? "Lot copié " + nom + " : équations " + (debut + 1) + " à " + fin + " sur " + total +
        ". Colle-les dans Desmos, puis reclique pour le lot suivant."
      : "J'ai copié " + r.lignes.length + " équations " + nom + " : colle-les dans Desmos, une par ligne.";
    if (r.refus) msg += " (" + r.refus + " écartée" + (r.refus > 1 ? "s" : "") + " : je ne les ai pas relues correctement.)";
    journal(msg, "app");
    if (parLot) lotCopie = fin >= total ? 0 : lotCopie + 1;
    majBoutonCopie();
  });
}

function copierRepli(texte){
  try {
    const ta = document.createElement("textarea");
    ta.value = texte;
    ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    const ok = document.execCommand("copy");
    document.body.removeChild(ta);
    return ok;
  } catch (e){ return false; }
}

function etat(txt){ elEtat.textContent = txt; }

/* --- Le loader : ce que Funcora est en train de faire, étape par étape --- */
let ETAPES = [];
const elLoader = document.getElementById("loader");
const elEtapes = document.getElementById("etapesListe");

function nouveauLoader(titre){
  ETAPES = [];
  elLoader.hidden = false;
  elEtapes.innerHTML = "";
  const h = document.createElement("h3");
  h.textContent = titre || "Ce que je fais";
  elEtapes.appendChild(h);
}

function etapeDebut(texte){
  const e = { texte: texte, t0: performance.now(), etat: "encours" };
  e.el = document.createElement("div");
  e.el.className = "etape encours";
  e.el.innerHTML = "<span class=\"marque\">\u2022</span><span class=\"txt\"></span><span class=\"ms\"></span>";
  e.el.querySelector(".txt").textContent = texte;
  elEtapes.appendChild(e.el);
  elLoader.hidden = false;
  elLoader.scrollTop = elLoader.scrollHeight;
  ETAPES.push(e);
  return e;
}

function etapeFin(e, ok, detail){
  if (!e) return;
  e.etat = ok ? "ok" : "rate";
  e.ms = Math.round(performance.now() - e.t0);
  e.el.className = "etape " + e.etat;
  e.el.querySelector(".marque").textContent = ok ? "\u2713" : "\u2717";
  const txt = e.el.querySelector(".txt");
  txt.textContent = e.texte;
  if (detail){
    const d = document.createElement("span");
    d.className = "det";
    d.textContent = " — " + detail;
    txt.appendChild(d);
  }
  e.el.querySelector(".ms").textContent = e.ms >= 1000 ? (e.ms/1000).toFixed(1) + " s" : e.ms + " ms";
  elLoader.scrollTop = elLoader.scrollHeight;
}

// une étape déjà terminée, pour les constats immédiats
function etapeFaite(texte, detail, ok){
  const e = etapeDebut(texte);
  etapeFin(e, ok !== false, detail);
  return e;
}

function fermerLoader(delai){
  setTimeout(() => { if (!maxEnCours) elLoader.hidden = true; }, delai || 6000);
}

function majTout(recadre){
  if (animation) arreterAnimation();
  COURBES = courbesScene();
  COURBE_SURVOL = null;
  MODE_LOURD = COURBES.length > 30000;
  bitmapCache = null;
  page = 0;
  if (recadre) recadrer(); else dessiner();
  majPanneau();
}

function descriptionScene(){
  const parts = scene.objets.map(o => {
    const src = o.info === "formules" ? "formules" : (o.info === "emoji" ? "traçage" :
      (o.info === "texte" ? "texte tracé" : o.info));
    return o.mot + " (" + src + ")";
  });
  return parts.join(", ");
}

/* Les gros calculs sont découpés : la page reprend la main entre deux
   morceaux, donc le bandeau d'état avance au lieu de rester figé. */
function enChaine(taches, fin){
  let i = 0;
  const pas = () => {
    if (i >= taches.length){ if (fin) fin(); return; }
    const t = taches[i++];
    try { t(); } catch (e){ console.error(e); }
    setTimeout(pas, 0);
  };
  setTimeout(pas, 0);
}

// Le curseur Détail donne le nombre de fonctions du DESSIN : quand la scène
// compte plusieurs objets, chacun en reçoit sa part.
function cibleParObjet(nb){
  return Math.max(CIBLE_MIN, Math.round(scene.cible/Math.max(1, nb || scene.objets.length || 1)));
}

function tachesCalcul(objets, intitule){
  const taches = [];
  objets.forEach((o, i) => {
    let e = null;
    taches.push(() => {
      etat(intitule + " « " + o.mot + " » " + (i+1) + "/" + objets.length + "…");
      e = etapeDebut("Je suis les contours de « " + o.mot + " » et j'ajuste");
    });
    taches.push(() => {
      o.mode = scene.mode; o.cible = cibleParObjet(objets.length); o.couleurs = scene.couleurs;
      regenererBase(o);
      etapeFin(e, o.base.length > 0, o.base.length + " fonctions" + (o.detail ? " · " + o.detail : ""));
    });
  });
  return taches;
}

/* Va chercher une image pour chaque sujet, avant tout calcul. Chaque tentative
   apparaît dans le loader — y compris quand elle échoue. */
function preparerSources(objets, fin){
  if (scene.mode === "formules"){ fin(); return; }
  if (!RESEAU_POSSIBLE){
    etapeFaite("Je regarde si je peux chercher sur internet",
      "page ouverte en local : Chrome l'interdit, je prends ma bibliothèque", false);
    fin(); return;
  }
  let i = 0;
  const suite = () => {
    if (i >= objets.length){ fin(); return; }
    const o = objets[i++];
    if (o.type !== "mot" || o.src){ suite(); return; }
    const e = etapeDebut("Je cherche un dessin de « " + o.mot + " »");
    chercherDessin(o.mot, (o.graine || 0), (res, err) => {
      if (res){
        o.src = res.canvas; o.type = "image"; o.credit = res;
        etapeFin(e, true, res.titre + " · " + res.licence +
          (res.traduit ? " (cherché en anglais : « " + res.traduit + " »)" : "") +
          " · " + res.nombre + " résultats");
      } else {
        etapeFin(e, false, (err || "rien trouvé") + " — je prends ma bibliothèque");
      }
      suite();
    });
  };
  suite();
}

function decrireSujets(){
  const cibles = {};
  scene.objets.forEach(o => { if (o.relation) cibles[o.relation.cible] = true; });
  const mots = { sur: "sur", sous: "sous", dans: "dans", devant: "devant",
                 derriere: "derrière", tient: "tenu par" };
  return scene.objets.map((o, i) => {
    if (o.relation){
      const cible = scene.objets[o.relation.cible];
      return o.mot + " " + (mots[o.relation.type] || "avec") + " " + (cible ? cible.mot : "?");
    }
    return cibles[i] ? null : o.mot;      // déjà nommé par la relation
  }).filter(Boolean).join(", ");
}

// Les images de Commons sont libres mais demandent qu'on cite leur auteur
function citerSources(){
  const sources = scene.objets.filter(o => o.credit)
    .map(o => o.credit.titre + " (" + o.credit.auteur + ", " + o.credit.licence + ")");
  if (sources.length)
    journal("Dessins trouvés sur Wikimedia Commons : " + sources.join(" · ") + ".", "app");
}

function tracerDemande(txt, silencieux, fin){
  const t0 = performance.now();
  nouveauLoader("Ce que je fais");
  const eLire = etapeDebut("Je lis ta demande");
  const r = construireScene(txt);
  if (!r.ok){
    etapeFin(eLire, false, r.message);
    etat("Rien à tracer.");
    journal(r.message, "app", true);
    if (fin) fin(false);
    return false;
  }
  etapeFin(eLire, true, decrireSujets() + " · " + scene.cible + " fonctions visées");
  etat("Je calcule les fonctions…");
  preparerSources(scene.objets, () => {
  enChaine(tachesCalcul(scene.objets, "Je calcule"), () => {
  scene.objets = scene.objets.filter(o => o.base.length);
  if (!scene.objets.length){
    etat("Rien à tracer.");
    journal("Je n'arrive pas à tracer ça. Essaie un autre mot, ou importe une image.", "app", true);
    if (fin) fin(false);
    return;
  }
  const eComp = etapeDebut("Je compose la scène");
  placerScene();
  majTout(true);
  etapeFin(eComp, true, scene.objets.length > 1 ? decrireSujets() : "cadrée");
  const eVerif = etapeDebut("Je relis les équations");
  const ech = Math.max(1, Math.floor(COURBES.length/200));
  let lues = 0, fausses = 0;
  for (let i = 0; i < COURBES.length; i += ech){ lues++; if (!verifierCourbe(COURBES[i], "latex").ok) fausses++; }
  etapeFin(eVerif, fausses === 0, fausses ? fausses + " douteuses sur " + lues : lues + " relues, toutes justes");
  const ms = Math.round(performance.now() - t0);
  etat(descriptionScene() + " — " + COURBES.length + " fonctions en " + ms + " ms");
  fermerLoader(9000);
  if (!silencieux){
    journal("Voilà " + descriptionScene() + " : " + COURBES.length + " fonctions. Tu peux me faire des reproches en dessous.", "app");
    prevenirSiPeu();
    citerSources();
    const ecrits = scene.objets.filter(o => o.info === "texte").map(o => o.mot);
    if (ecrits.length)
      journal("Je ne connais pas de dessin pour « " + ecrits.join(" », « ") +
        " » : j'ai tracé le mot écrit. Importe une image ou dessine-le à la main pour le vrai dessin.", "app");
  }
  if (fin) fin(true);
  });
  });
  return true;
}

// Le dessin de départ n'a parfois pas assez de matière pour la cible demandée
function prevenirSiPeu(){
  if (!scene.objets.length) return;
  if (scene.mode === "formules"){
    const part = cibleParObjet();
    const courts = scene.objets.filter(o => o.maxModele && o.maxModele < part*0.6);
    if (courts.length)
      journal("Les modèles faits main de « " + courts.map(o => o.mot).join(" », « ") +
        " » n'ont pas plus de " + courts.map(o => o.maxModele).join(" / ") +
        " équations. Passe en Traçage si tu en veux davantage.", "app");
    return;
  }
  const part = cibleParObjet();
  const maigres = scene.objets.filter(o => o.base.length < part*0.7);
  if (!maigres.length) return;
  journal("Je vise " + scene.cible + " fonctions (" + part + " par objet), mais « " + maigres.map(o => o.mot).join(" », « ") +
    " » n'en donne que " + maigres.map(o => o.base.length).join(" / ") +
    " : le dessin de départ n'a pas plus de détails à offrir. Monte les couleurs pour en avoir davantage.", "app");
}

function regenererTout(fin){
  if (!scene.objets.length){ if (fin) fin(); return; }
  enChaine(tachesCalcul(scene.objets, "Je recalcule"), () => {
    placerScene();
    majTout(false);
    etat(descriptionScene() + " — " + COURBES.length + " fonctions");
    prevenirSiPeu();
    if (fin) fin();
  });
}

function construireExemples(){

    b.className = "puce";
    b.textContent = ex;
    b.onclick = () => { document.getElementById("demande").value = ex; lancerTrace(); };
    box.appendChild(b);
  });
}

function lancerTrace(){

/* --- souris et doigts sur le repère --- */
(function interactionsGraphe(){
  let attrape = false, dernier = null, pincee = null;
  cvGraphe.addEventListener("pointerdown", e => {
    attrape = true; dernier = [e.clientX, e.clientY];
    cvGraphe.classList.add("attrape");
    cvGraphe.setPointerCapture(e.pointerId);
  });
  cvGraphe.addEventListener("pointermove", e => {
    if (!attrape || !dernier) return;
    const dx = e.clientX - dernier[0], dy = e.clientY - dernier[1];
    dernier = [e.clientX, e.clientY];
    vue.cx -= dx/vue.ppu; vue.cy += dy/vue.ppu;
    dessiner();
  });
  const fin = e => { attrape = false; dernier = null; cvGraphe.classList.remove("attrape"); };
  cvGraphe.addEventListener("pointerup", fin);
  cvGraphe.addEventListener("pointercancel", fin);
  cvGraphe.addEventListener("wheel", e => {
    e.preventDefault();
    zoomer(Math.pow(0.999, e.deltaY), e.clientX, e.clientY);
  }, { passive: false });
  cvGraphe.addEventListener("touchmove", e => {
    if (e.touches.length !== 2) return;
    e.preventDefault();
    const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
    if (pincee) zoomer(d/pincee, (e.touches[0].clientX + e.touches[1].clientX)/2, (e.touches[0].clientY + e.touches[1].clientY)/2);
    pincee = d;
  }, { passive: false });
  cvGraphe.addEventListener("touchend", () => { pincee = null; });
})();

function zoomer(facteur, clientX, clientY){
  const r = cvGraphe.getBoundingClientRect();
  const px = (clientX === undefined ? r.width/2 : clientX - r.left);
  const py = (clientY === undefined ? r.height/2 : clientY - r.top);
  const ax = versRepereX(px), ay = versRepereY(py);
  vue.ppu = borne(vue.ppu*facteur, 1.5, 600);
  vue.cx = ax - (px - largeurVue()/2)/vue.ppu;
  vue.cy = ay + (py - hauteurVue()/2)/vue.ppu;
  COURBES.forEach(c => { c._ech = null; });
  dessiner();
}

/* Curseurs de 10 à 1000 : échelle logarithmique, pour régler finement
   en bas (10, 12, 15…) comme en haut (700, 850, 1000). */
function valeurCurseur(pos, min, max){
  const v = min*Math.pow(max/min, borne(pos, 0, 100)/100);
  if (v < 20) return Math.round(v);
  const p = Math.pow(10, Math.floor(Math.log10(v)) - 1);
  return Math.round(Math.round(v/p)*p);
}
function positionCurseur(val, min, max){
  return borne(Math.round(100*Math.log(borne(val, min, max)/min)/Math.log(max/min)), 0, 100);
}

const elDetail = document.getElementById("detail"), elDetailVal = document.getElementById("detailVal");
const elCoul = document.getElementById("couleurs"), elCoulVal = document.getElementById("couleursVal");

function majCurseurs(){
  elDetail.value = positionCurseur(scene.cible, CIBLE_MIN, CIBLE_MAX);
  elDetailVal.textContent = scene.cible;
  elCoul.value = positionCurseur(scene.couleurs, 1, COULEURS_MAX);
  elCoulVal.textContent = scene.couleurs;
}

elDetail.oninput = () => { elDetailVal.textContent = valeurCurseur(+elDetail.value, CIBLE_MIN, CIBLE_MAX); };
elDetail.onchange = () => {
  scene.cible = valeurCurseur(+elDetail.value, CIBLE_MIN, CIBLE_MAX);
  elDetailVal.textContent = scene.cible;
  if (!scene.objets.length) return;
  memoriser();
  if (scene.mode === "formules"){
    journal("Le curseur Détail ne sert qu'en mode Traçage : les modèles tout faits ont un nombre d'équations fixe.", "app", true);
    return;
  }
  etat("Je recalcule…");
  regenererTout();
};

elCoul.oninput = () => { elCoulVal.textContent = valeurCurseur(+elCoul.value, 1, COULEURS_MAX); };
elCoul.onchange = () => {
  scene.couleurs = valeurCurseur(+elCoul.value, 1, COULEURS_MAX);
  elCoulVal.textContent = scene.couleurs;
  if (!scene.objets.length) return;
  memoriser();
  scene.objets.forEach(o => { o.couleurForcee = null; o.palette = false; });
  if (scene.mode === "formules"){
    journal("Le curseur Couleurs ne sert qu'en mode Traçage.", "app", true);
    return;
  }
  etat("Je recalcule…");
  regenererTout(() => {
    const vus = scene.objets.map(o => o.calques || 0).reduce((a, b) => Math.max(a, b), 0);
    if (vus && vus < scene.couleurs*0.8)
      journal(scene.couleurs + " calques demandés, " + vus + " seulement : le dessin de départ ne contient pas plus de couleurs.", "app");
  });
};

});

/* --- dessin à la main --- */
const modal = document.getElementById("modalDessin");
const toile = document.getElementById("toile");
const ctxToile = toile.getContext("2d", { willReadFrequently: true });
function viderToile(){
  ctxToile.fillStyle = "#ffffff";
  ctxToile.fillRect(0, 0, toile.width, toile.height);
  ctxToile.strokeStyle = "#111318";
  ctxToile.lineWidth = 9;
  ctxToile.lineJoin = "round"; ctxToile.lineCap = "round";
}
viderToile();
(function dessinLibre(){
  let trace = false, prec = null;
  const pos = e => {
    const r = toile.getBoundingClientRect();
    return [(e.clientX - r.left)*toile.width/r.width, (e.clientY - r.top)*toile.height/r.height];
  };
  toile.addEventListener("pointerdown", e => {
    trace = true; prec = pos(e); toile.setPointerCapture(e.pointerId);
    ctxToile.beginPath(); ctxToile.moveTo(prec[0], prec[1]); ctxToile.lineTo(prec[0]+0.01, prec[1]); ctxToile.stroke();
  });
  toile.addEventListener("pointermove", e => {
    if (!trace) return;
    const p = pos(e);
    ctxToile.beginPath(); ctxToile.moveTo(prec[0], prec[1]); ctxToile.lineTo(p[0], p[1]); ctxToile.stroke();
    prec = p;
  });
  const fin = () => { trace = false; prec = null; };
  toile.addEventListener("pointerup", fin);
  toile.addEventListener("pointercancel", fin);
})();
