<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NutriGenius AI 26.1.6.8 - PRO KITCHEN EDITION</title>
    <style>
        :root { --bg: #f0f4f8; --card: white; --text: #2c3e50; --primary: #009245; --accent: #e67e22; }
        .dark-mode { --bg: #1a1a1a; --card: #2d2d2d; --text: #f0f4f8; --primary: #27ae60; --accent: #d35400; }
        
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); text-align: center; padding: 20px; transition: 0.3s; margin: 0; }
        .container { background: var(--card); padding: 25px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); display: inline-block; width: 100%; max-width: 900px; text-align: left; }
        
        #loader-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(5px); z-index: 9999;
            flex-direction: column; justify-content: center; align-items: center; color: white;
        }
        .spinner { width: 60px; height: 60px; border: 6px solid rgba(255,255,255,0.2); border-top: 6px solid var(--primary); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Style du pourcentage */
        #loading-percentage { font-size: 2em; font-weight: bold; color: white; margin-bottom: 10px; }

        .header-ui { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; gap: 10px; flex-wrap: wrap; }
        .dark-toggle { cursor: pointer; background: var(--primary); color: white; padding: 8px 15px; border-radius: 20px; font-size: 0.8em; font-weight: bold; }
        
        h1 { margin: 0; color: var(--primary); }
        .input-group { margin-bottom: 15px; background: rgba(0,0,0,0.03); padding: 15px; border-radius: 12px; }
        .row { display: flex; gap: 10px; margin-bottom: 10px; }
        .input-field, .select-box { width: 100%; padding: 12px; border-radius: 10px; border: 2px solid #e0e0e0; background: var(--card); color: var(--text); }
        
        .checkbox-group { display: flex; align-items: center; gap: 10px; font-weight: bold; color: var(--primary); cursor: pointer; margin: 15px 0; }
        
        .btn { width: 100%; padding: 15px; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; color: white; background: var(--primary); font-size: 1.1em; transition: 0.2s; }
        .btn:hover { filter: brightness(1.1); transform: translateY(-2px); }
        
        .btn-sm { padding: 8px 12px; font-size: 0.75em; margin: 4px 2px; border: none; border-radius: 8px; cursor: pointer; color: white; font-weight: bold; }
        .btn-replace { background: var(--accent); }
        .btn-recipe { background: #3498db; }
        .btn-variant { background: #8e44ad; }

        .day-box { background: var(--card); padding: 20px; margin-bottom: 25px; border-radius: 15px; border-left: 12px solid var(--primary); box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        .meal-section { margin-top: 15px; padding-top: 10px; border-top: 1px dashed rgba(127, 140, 141, 0.3); }
        .details-content { display: none; font-size: 0.95em; margin-top: 12px; background: rgba(0,0,0,0.04); padding: 20px; border-radius: 10px; line-height: 1.6; border-left: 4px solid #3498db; }
        
        .macro-box { background: var(--primary); color: white; padding: 10px; border-radius: 8px; margin-top: 10px; font-size: 0.9em; }

        .shopping-list { background: #e8f5e9; border: 2px dashed var(--primary); padding: 20px; border-radius: 15px; margin: 25px 0; color: #1b5e20; }
        .shopping-item { display: inline-block; background: white; padding: 6px 14px; margin: 5px; border-radius: 20px; font-size: 0.85em; font-weight: bold; border: 1px solid #c3e6cb; }
        .cal-float { float: right; background: var(--primary); color: white; padding: 5px 15px; border-radius: 12px; font-size: 0.95em; font-weight: bold; }

        .goog-te-gadget-simple { border-radius: 10px !important; padding: 5px !important; border: 1px solid #ccc !important; background: var(--card) !important; }
        .goog-te-banner-frame.skiptranslate { display: none !important; } 
        body { top: 0px !important; }

        @media print { .no-print, .btn-sm { display: none !important; } .details-content { display: block !important; border: none; background: none; } }
    </style>
</head>
<body onload="chargerProfil()">

<div id="loader-overlay">
    <div class="spinner"></div>
    <div id="loading-percentage">0%</div>
    <div style="font-size: 1.3em;">Génération de votre menu... 👨‍🍳</div>
</div>

<div class="container">
    <div class="header-ui">
        <h1>NutriGenius AI 🥗</h1>
        <div id="google_translate_element"></div>
        <div class="dark-toggle no-print" onclick="toggleDark()">🌓 Mode Sombre</div>
    </div>

    <div class="no-print">
        <div class="input-group">
            <div class="row">
                <input type="number" id="age" class="input-field" placeholder="Age" oninput="sauvegarderProfil()">
                <select id="sexe" class="input-field" onchange="sauvegarderProfil()">
                    <option value="H">Homme</option>
                    <option value="F">Femme</option>
                </select>
            </div>
            <div class="row">
                <input type="number" id="poids" class="input-field" placeholder="Poids (kg)" oninput="sauvegarderProfil()">
                <input type="number" id="taille" class="input-field" placeholder="Taille (cm)" oninput="sauvegarderProfil()">
            </div>
        </div>
        <select id="select-duree" class="select-box">
            <option value="1">🥗 Menu du Jour</option>
            <option value="7">📅 Menu de la Semaine</option>
            <option value="30">📊 Menu du Mois</option>
            <option value="365">🗓️ Menu de l'année</option>
        </select>
        <label class="checkbox-group">
            <input type="checkbox" id="check-veg" onchange="sauvegarderProfil()"> 🥦 Mode Végétarien
        </label>
        <button class="btn" onclick="lancer()">GÉNÉRER MON PLAN NUTRITIONNEL</button>
    </div>

    <div id="resultat"><div id="content-area"></div></div>
</div>

<script>
    // Liste des 100+ langues ajoutées
    const supportedLanguages = "en,es,it,de,pt,zh-CN,hi,fr,ar,bn,ru,ja,pa,mr,te,tr,ko,vi,ta,ur,id,pl,uk,th,gu,kn,ml,my,sw,yo,ha,fa,ro,nl,am,az,ha,ig,yo,zu,ceb,tl,mg,ny,sn,st,xh,ht,qu,ay,gn,as,or,sd,ne,si,km,lo,ms,kk,uz,tk,ky,tg,ka,hy,be,mk,bg,sr,hr,bs,sl,sk,cs,hu,fi,et,lv,lt,el,sq,af,is,ga,cy,eu,ca,gl,ps,ku,sd,ug,uz,ky,mn,my,km,lo,ne,am,ti,om,lg,ln,ak";

    const db = {
        petitDej: [
            { n: "Omelette Soufflée Master 🍳", c: 380, v: true, i: ["4 Oeufs", "Oignons verts", "Curcuma", "Beurre"],
                variantes: [
                    { t: "Classique Aérienne", r: ["1. Blancs en neige.", "2. Mélanger aux jaunes.", "3. Cuire 8min."], ntr: "Protéines: 22g | Glucides: 4g | Lipides: 24g", tip: "Ne pas retourner." },
                    { t: "Brouillée Créole", r: ["1. Battre les oeufs.", "2. Frire oignons.", "3. Remuer."], ntr: "Protéines: 21g | Glucides: 3g | Lipides: 23g", tip: "Garder baveux." },
                    { t: "Muffins au Four", r: ["1. Moules huilés.", "2. Enfourner 15min."], ntr: "Protéines: 24g | Glucides: 5g | Lipides: 18g", tip: "Pratique." },
                    { t: "Roulée Japonaise", r: ["1. Fines couches.", "2. Rouler."], ntr: "Protéines: 20g | Glucides: 6g | Lipides: 20g", tip: "Texture ferme." },
                    { t: "Version Fromage", r: ["1. Ajouter emmental.", "2. Plier."], ntr: "Protéines: 28g | Glucides: 4g | Lipides: 32g", tip: "Calcium ++." }
                ]
            },
            { n: "Bowl Skyr & Fruits Péi 🥭", c: 310, v: true, i: ["200g Skyr", "Mangue", "Graines de lin", "Miel"],
                variantes: [
                    { t: "Énergie Matinale", r: ["1. Mixez mangue.", "2. Mélanger Skyr."], ntr: "Protéines: 25g | Glucides: 35g | Lipides: 5g", tip: "Probiotiques." },
                    { t: "Crunchy Noisettes", r: ["1. Noisettes concassées.", "2. Miel."], ntr: "Protéines: 26g | Glucides: 38g | Lipides: 12g", tip: "Focus mental." },
                    { t: "Smoothie Bowl", r: ["1. Tout mixer.", "2. Boire froid."], ntr: "Protéines: 22g | Glucides: 40g | Lipides: 4g", tip: "Express." },
                    { t: "Façon Trifle", r: ["1. Étages alternés.", "2. Frais."], ntr: "Protéines: 24g | Glucides: 36g | Lipides: 6g", tip: "Esthétique." },
                    { t: "Version Gingembre", r: ["1. Râper gingembre.", "2. Mélanger."], ntr: "Protéines: 25g | Glucides: 34g | Lipides: 5g", tip: "Immunité." }
                ]
            },
            { n: "Pancakes à la Banane 🥞", c: 350, v: true, i: ["2 Bananes", "2 Oeufs", "Avoine", "Cannelle"],
                variantes: [
                    { t: "Sans Farine", r: ["1. Écraser bananes.", "2. Mélanger.", "3. Poêler."], ntr: "Protéines: 15g | Glucides: 45g | Lipides: 8g", tip: "Fondant." },
                    { t: "Protidiques", r: ["1. Ajouter 30g de whey."], ntr: "Protéines: 35g | Glucides: 40g | Lipides: 9g", tip: "Sportif." },
                    { t: "Choco", r: ["1. Pépites chocolat noir."], ntr: "Protéines: 14g | Glucides: 52g | Lipides: 15g", tip: "Gourmand." },
                    { t: "Peanut Butter", r: ["1. Napper de beurre cacahuète."], ntr: "Protéines: 18g | Glucides: 46g | Lipides: 18g", tip: "Énergie." },
                    { t: "Blueberry", r: ["1. Ajouter myrtilles."], ntr: "Protéines: 15g | Glucides: 48g | Lipides: 9g", tip: "Antioxydant." }
                ]
            }
        ],
        dejeuner: [
            { n: "Carry Poulet Grand-Mère 🍗", c: 620, v: false, i: ["Poulet", "Tomates", "Oignons", "Gingembre", "Curcuma"],
                variantes: [
                    { t: "Traditionnel", r: ["1. Roussir viande.", "2. Épices.", "3. Mijoter."], ntr: "Protéines: 52g | Glucides: 12g | Lipides: 22g", tip: "Sans eau." },
                    { t: "Light", r: ["1. Four.", "2. Sans huile."], ntr: "Protéines: 55g | Glucides: 8g | Lipides: 12g", tip: "Minceur." }
                ]
            },
            { n: "Rougail Saucisses 🥘", c: 710, v: false, i: ["Saucisses fumées", "Tomates", "Oignons", "Gingembre"],
                variantes: [
                    { t: "Authentique", r: ["1. Bouillir.", "2. Frire.", "3. Tomates."], ntr: "Protéines: 40g | Glucides: 15g | Lipides: 45g", tip: "Dégraisser." }
                ]
            }
        ],
        diner: [
            { n: "Dahl de Lentilles Corail 🍛", c: 510, v: true, i: ["Lentilles", "Lait coco", "Cumin", "Citron"],
                variantes: [
                    { t: "Onctueux", r: ["1. Mixer.", "2. Coco."], ntr: "Protéines: 26g | Glucides: 58g | Lipides: 18g", tip: "Apaisant." }
                ]
            }
        ]
    };

    let planningGlobal = [];

    function toggleDark() { document.body.classList.toggle('dark-mode'); }

    function lancer() {
        if (!document.getElementById('age').value) return alert("Veuillez entrer votre Age !");
        
        const overlay = document.getElementById('loader-overlay');
        const percentTxt = document.getElementById('loading-percentage');
        
        overlay.style.display = "flex";
        let progress = 0;
        percentTxt.innerText = "0%";

        // Animation du pourcentage en entiers
        const interval = setInterval(() => {
            progress += 5; 
            if (progress > 100) progress = 100;
            percentTxt.innerText = progress + "%";
            if (progress >= 100) clearInterval(interval);
        }, 55);

        setTimeout(() => { 
            genererPlanning(); 
            overlay.style.display = "none";
        }, 1200);
    }

    function genererPlanning() {
        const jours = parseInt(document.getElementById('select-duree').value);
        const isVeg = document.getElementById('check-veg').checked;
        const poolP = isVeg ? db.petitDej.filter(x => x.v) : db.petitDej;
        const poolM = isVeg ? db.dejeuner.filter(x => x.v) : db.dejeuner;
        const poolD = isVeg ? db.diner.filter(x => x.v) : db.diner;

        planningGlobal = [];
        for (let i = 0; i < jours; i++) {
            planningGlobal.push({
                p: JSON.parse(JSON.stringify(poolP[Math.floor(Math.random() * poolP.length)])),
                m: JSON.parse(JSON.stringify(poolM[Math.floor(Math.random() * poolM.length)])),
                d: JSON.parse(JSON.stringify(poolD[Math.floor(Math.random() * poolD.length)])),
                vP: 0, vM: 0, vD: 0
            });
        }
        afficherMenu();
    }

    function remplacerRepas(jIdx, type) {
        const isVeg = document.getElementById('check-veg').checked;
        const categorie = type === 'p' ? db.petitDej : (type === 'm' ? db.dejeuner : db.diner);
        const pool = isVeg ? categorie.filter(x => x.v) : categorie;
        if (pool.length <= 1) return;
        let nouveauPlat;
        const platActuelNom = planningGlobal[jIdx][type].n;
        do { nouveauPlat = pool[Math.floor(Math.random() * pool.length)]; } while (nouveauPlat.n === platActuelNom);
        planningGlobal[jIdx][type] = JSON.parse(JSON.stringify(nouveauPlat));
        planningGlobal[jIdx]['v' + type.toUpperCase()] = 0; 
        afficherMenu();
    }

    function changerVariante(jIdx, type) {
        let key = 'v' + type.toUpperCase();
        let plat = planningGlobal[jIdx][type];
        planningGlobal[jIdx][key] = (planningGlobal[jIdx][key] + 1) % plat.variantes.length;
        afficherMenu();
    }

    function toggleDetails(id) {
        const el = document.getElementById(id);
        el.style.display = (el.style.display === 'block') ? 'none' : 'block';
    }

    function afficherMenu() {
        let html = "";
        planningGlobal.forEach((jour, idx) => {
            if (idx % 7 === 0) {
                let listIng = new Set();
                let fin = Math.min(idx + 7, planningGlobal.length);
                for(let k=idx; k<fin; k++) {
                    [planningGlobal[k].p, planningGlobal[k].m, planningGlobal[k].d].forEach(r => r.i.forEach(ing => listIng.add(ing)));
                }
                html += `<div class="shopping-list"><b>🛒 LISTE DE COURSES (Semaine ${Math.floor(idx/7)+1})</b><br>${Array.from(listIng).map(n => `<span class="shopping-item">${n}</span>`).join('')}</div>`;
            }
            html += `<div class="day-box"><span class="cal-float">${jour.p.c + jour.m.c + jour.d.c} kcal</span><h3>JOUR ${idx + 1}</h3>${renderMeal(idx, 'p', '☀️ Petit-Déjeuner', jour.p, jour.vP)}${renderMeal(idx, 'm', '🥗 Déjeuner', jour.m, jour.vM)}${renderMeal(idx, 'd', '🌙 Dîner', jour.d, jour.vD)}</div>`;
        });
        document.getElementById('content-area').innerHTML = html;
    }

    function renderMeal(jIdx, type, label, meal, vIdx) {
        const id = `det-${jIdx}-${type}`;
        const v = meal.variantes[vIdx];
        return `<div class="meal-section"><b>${label} :</b> ${meal.n} <small>(${v.t})</small><br>🛒 Ingrédients : ${meal.i.join(', ')}<div class="no-print"><button class="btn-sm btn-replace" onclick="remplacerRepas(${jIdx}, '${type}')">🔄 Changer</button><button class="btn-sm btn-variant" onclick="changerVariante(${jIdx}, '${type}')">✨ Variante</button><button class="btn-sm btn-recipe" onclick="toggleDetails('${id}')">📖 Recette</button></div><div id="${id}" class="details-content"><b>👨‍🍳 PRÉPARATION :</b><br>${v.r.map((step, i) => `<b>${i+1}.</b> ${step}`).join('<br>')}<div class="macro-box">📊 <b>Valeurs :</b><br>${v.ntr}</div></div></div>`;
    }

    function sauvegarderProfil() {
        const p = { age: document.getElementById('age').value, poids: document.getElementById('poids').value, taille: document.getElementById('taille').value, sexe: document.getElementById('sexe').value, veg: document.getElementById('check-veg').checked };
        localStorage.setItem('NutriGenius_V9_FINAL', JSON.stringify(p));
    }

    function chargerProfil() {
        const s = localStorage.getItem('NutriGenius_V9_FINAL');
        if (s) {
            const d = JSON.parse(s);
            document.getElementById('age').value = d.age || "";
            document.getElementById('poids').value = d.poids || "";
            document.getElementById('taille').value = d.taille || "";
            document.getElementById('sexe').value = d.sexe || "H";
            document.getElementById('check-veg').checked = d.veg || false;
        }
    }

    // --- GOOGLE TRANSLATE ---
    function googleTranslateElementInit() {
      new google.translate.TranslateElement({
        pageLanguage: 'fr',
        layout: google.translate.TranslateElement.InlineLayout.SIMPLE,
        autoDisplay: false
      }, 'google_translate_element');
    }
</script>
<script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
</body>
</html>
