<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Minicraft 4.0</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#87ceeb;
  font-family:"Trebuchet MS",Verdana,Arial,sans-serif;user-select:none}
img{image-rendering:pixelated;image-rendering:crisp-edges}
#game{display:block;width:100vw;height:100vh;touch-action:none}

/* ---------- HUD ---------- */
#crosshair{position:fixed;left:50%;top:50%;width:20px;height:20px;transform:translate(-50%,-50%);pointer-events:none;z-index:5;opacity:.75}
#crosshair:before,#crosshair:after{content:"";position:absolute;background:#fff;mix-blend-mode:difference}
#crosshair:before{width:2px;height:20px;left:9px;top:0}
#crosshair:after{height:2px;width:20px;left:0;top:9px}

#bottomHud{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);z-index:6;display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:none}
#bars{display:flex;justify-content:space-between;width:100%;padding:0 2px}
.bar{display:flex;gap:1px}
.pip{width:16px;height:16px}
#hotbar{display:flex;gap:2px;background:#00000066;padding:3px;border:2px solid #1a1a1a;border-radius:3px;pointer-events:auto}
.slot{width:46px;height:46px;background:#8b8b8b;border-top:2px solid #5a5a5a;border-left:2px solid #5a5a5a;
  border-right:2px solid #fdfdfd;border-bottom:2px solid #fdfdfd;position:relative;display:flex;
  align-items:center;justify-content:center;cursor:pointer;touch-action:manipulation}
#hotbar .slot.sel{outline:3px solid #fff;outline-offset:1px;z-index:2}
.slot img{width:36px;height:36px;pointer-events:none}
.cnt{position:absolute;right:2px;bottom:0;color:#fff;font-weight:bold;font-size:14px;
  text-shadow:1.5px 1.5px 0 #3f3f3f;pointer-events:none}
.dur{position:absolute;left:3px;right:3px;bottom:2px;height:3px;background:#000;pointer-events:none}
.dur i{display:block;height:100%;background:#3fdb3f}
#itemName{color:#fff;font-size:15px;text-shadow:2px 2px 0 #000;height:20px;opacity:0;transition:opacity .4s}

/* ---------- Écrans ---------- */
#menu{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(#4fa4e8,#a8dcff);padding:16px;overflow:auto}
.card{width:min(430px,94vw);padding:24px 20px;background:#1e1e1eee;border:4px solid #000;
  box-shadow:0 0 0 4px #5a5a5a,0 14px 40px #0007;text-align:center;color:#fff}
.card h1{margin:0 0 4px;font-size:34px;text-shadow:3px 3px 0 #3f3f3f;letter-spacing:1px}
.card p{margin:0 0 16px;color:#bbb;font-size:14px}
.mcbtn{display:block;width:100%;margin:8px 0;padding:13px;border:2px solid #000;font-size:17px;
  font-weight:bold;cursor:pointer;background:#6b6b6b;color:#fff;text-shadow:2px 2px 0 #3f3f3f;
  box-shadow:inset -2px -3px 0 #4a4a4a,inset 2px 2px 0 #9a9a9a}
.mcbtn:hover{background:#7d8fa0}
.mcbtn:active{box-shadow:inset 2px 3px 0 #4a4a4a}
.mcbtn.on{background:#3d8b3d;box-shadow:inset -2px -3px 0 #2a5f2a,inset 2px 2px 0 #6fbf6f}
.row{display:flex;gap:8px}
.row .mcbtn{flex:1}
.note{margin-top:14px;font-size:11px;color:#888;line-height:1.5}

/* ---------- GUI inventaire ---------- */
#gui{display:none;position:fixed;inset:0;z-index:30;background:#00000099;
  align-items:center;justify-content:center;overflow:auto;padding:8px}
.win{background:#c6c6c6;border:4px solid #000;box-shadow:inset 3px 3px 0 #fff,inset -3px -3px 0 #555,0 8px 30px #000a;
  padding:12px;max-width:96vw}
.win h2{margin:0 0 8px;font-size:19px;color:#3f3f3f;text-align:left}
.grid{display:grid;gap:2px;justify-content:center}
.gslot{width:42px;height:42px;background:#8b8b8b;border-top:2px solid #373737;border-left:2px solid #373737;
  border-right:2px solid #fff;border-bottom:2px solid #fff;position:relative;display:flex;align-items:center;
  justify-content:center;cursor:pointer;touch-action:manipulation}
.gslot img{width:34px;height:34px;pointer-events:none}
.gslot.res{background:#9b9b9b}
.craftbox{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:10px}
.arrow{font-size:26px;color:#3f3f3f}
.sep{height:8px}
.tabs{display:flex;gap:4px;margin-bottom:8px;flex-wrap:wrap}
.tab{padding:6px 12px;background:#8b8b8b;border:2px solid #373737;cursor:pointer;font-size:13px;font-weight:bold;color:#eee}
.tab.on{background:#c6c6c6;color:#222}
#cursorItem{position:fixed;width:38px;height:38px;pointer-events:none;z-index:60;display:none;
  transform:translate(-50%,-50%)}
#cursorItem img{width:100%;height:100%}
#cursorItem .cnt{font-size:13px}
.hint{font-size:11px;color:#555;text-align:center;margin-top:8px;line-height:1.5}
.recipes{display:flex;flex-wrap:wrap;gap:3px;max-height:190px;overflow:auto;justify-content:center;padding:2px}
.recipes .gslot.dim{opacity:.35}
#furnaceFire{width:26px;height:26px;background:#3f3f3f;position:relative;overflow:hidden}
#furnaceFire i{position:absolute;left:0;bottom:0;width:100%;background:#ffb02e}
#smeltBar{width:56px;height:14px;background:#3f3f3f;position:relative;overflow:hidden}
#smeltBar i{display:block;height:100%;width:0;background:#e0e0e0}
.closeX{float:right;background:#8b8b8b;border:2px solid #373737;width:28px;height:26px;cursor:pointer;
  font-weight:bold;color:#fff;line-height:1}

/* ---------- Mobile ---------- */
#mob{display:none;position:fixed;inset:0;z-index:7;pointer-events:none}
#joy{position:absolute;left:18px;bottom:24px;width:120px;height:120px;border-radius:50%;
  background:#ffffff2e;border:3px solid #ffffff77;pointer-events:auto;touch-action:none}
#stick{position:absolute;left:36px;top:36px;width:46px;height:46px;border-radius:50%;background:#ffffffaa}
.mbtn{position:absolute;border-radius:50%;border:2px solid #ffffffcc;background:#00000077;color:#fff;
  font-size:24px;font-weight:bold;pointer-events:auto;touch-action:none;display:flex;align-items:center;justify-content:center}
#bJump{right:20px;bottom:30px;width:66px;height:66px}
#bBreak{right:98px;bottom:108px;width:64px;height:64px;font-size:22px}
#bPlace{right:16px;bottom:118px;width:64px;height:64px}
#bSneak{left:150px;bottom:30px;width:54px;height:54px;font-size:19px}
#bSprint{left:150px;bottom:94px;width:54px;height:54px;font-size:19px}
#bInv{right:16px;top:16px;width:52px;height:52px;font-size:22px}
.mbtn.act{background:#ffffffbb;color:#000}
#debug{position:fixed;top:6px;left:6px;color:#fff;font:12px/1.5 monospace;text-shadow:1px 1px 0 #000;z-index:8;display:none;pointer-events:none}
#toast{position:fixed;top:14%;left:50%;transform:translateX(-50%);color:#fff;background:#000000aa;
  padding:8px 16px;font-size:14px;z-index:9;opacity:0;transition:opacity .3s;pointer-events:none;text-align:center}
#dmg{position:fixed;inset:0;background:#a00;opacity:0;pointer-events:none;z-index:4;transition:opacity .25s}
#water{position:fixed;inset:0;background:#2450b8;opacity:0;pointer-events:none;z-index:3;transition:opacity .2s}
@media (pointer:coarse){.gslot{width:38px;height:38px}.gslot img{width:30px;height:30px}.slot{width:40px;height:40px}.slot img{width:32px;height:32px}}
</style>
</head>
<body>

<canvas id="game"></canvas>
<div id="water"></div>
<div id="dmg"></div>
<div id="crosshair"></div>
<div id="debug"></div>
<div id="toast"></div>

<div id="bottomHud">
  <div id="itemName"></div>
  <div id="bars"><div class="bar" id="healthBar"></div><div class="bar" id="foodBar"></div></div>
  <div id="hotbar"></div>
</div>

<div id="mob">
  <div id="joy"><div id="stick"></div></div>
  <button class="mbtn" id="bJump">⤒</button>
  <button class="mbtn" id="bBreak">⛏</button>
  <button class="mbtn" id="bPlace">＋</button>
  <button class="mbtn" id="bSneak">⇩</button>
  <button class="mbtn" id="bSprint">»</button>
  <button class="mbtn" id="bInv">▤</button>
</div>

<div id="gui"></div>
<div id="cursorItem"></div>

<div id="menu">
  <div class="card">
    <h1>⛏ MINICRAFT</h1>
    <p>Version 4.0 — moteur voxel, lumière, craft complet</p>
    <div class="row">
      <button class="mcbtn on" id="mSurvival">Survie</button>
      <button class="mcbtn" id="mCreative">Créatif</button>
    </div>
    <div class="sep"></div>
    <button class="mcbtn" id="mPhone">📱 Jouer sur téléphone</button>
    <button class="mcbtn" id="mPC">💻 Jouer sur ordinateur</button>
    <div class="note">
      <b>PC :</b> ZQSD/WASD bouger · Espace sauter · Maj accroupi · Ctrl courir ·
      Clic G casser · Clic D poser · E inventaire · 1-9 barre · F3 infos · G créatif<br>
      <b>Mobile :</b> joystick, glisser pour regarder, boutons à droite.
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script>
"use strict";
/* =========================================================================
   1. UTILITAIRES
   ========================================================================= */
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function mulberry(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;

/* Bruit de valeur 2D lissé (pour le terrain) */
function makeNoise2(seed){
  const p=new Uint8Array(512),r=mulberry(seed);
  const perm=[...Array(256).keys()];
  for(let i=255;i>0;i--){const j=Math.floor(r()*(i+1));[perm[i],perm[j]]=[perm[j],perm[i]]}
  for(let i=0;i<512;i++)p[i]=perm[i&255];
  const f=t=>t*t*t*(t*(t*6-15)+10);
  const g=(h,x,y)=>((h&1)?-x:x)+((h&2)?-y:y);
  return function(x,y){
    const X=Math.floor(x)&255,Y=Math.floor(y)&255;
    x-=Math.floor(x);y-=Math.floor(y);
    const u=f(x),v=f(y);
    const a=p[X]+Y,b=p[X+1]+Y;
    return lerp(lerp(g(p[a],x,y),g(p[b],x-1,y),u),
                lerp(g(p[a+1],x,y-1),g(p[b+1],x-1,y-1),u),v);
  };
}

/* =========================================================================
   2. ATLAS DE TEXTURES 16x16 (dessinées en pixel-art)
   ========================================================================= */
const TS=16, ACOLS=16, APX=ACOLS*TS;
const atlasCv=document.createElement("canvas");
atlasCv.width=atlasCv.height=APX;
const actx=atlasCv.getContext("2d");
const tileIndex={}, tileCanvas={};
let tileCount=0;

function T(name,fn){
  const c=document.createElement("canvas");c.width=c.height=TS;
  const x=c.getContext("2d");
  x.imageSmoothingEnabled=false;
  fn(x,mulberry(hash(name)));
  const idx=tileCount++;
  tileIndex[name]=idx;tileCanvas[name]=c;
  actx.drawImage(c,(idx%ACOLS)*TS,Math.floor(idx/ACOLS)*TS);
  return idx;
}
function fill(x,c){x.fillStyle=c;x.fillRect(0,0,TS,TS)}
function px(x,c,a,b,w,h){x.fillStyle=c;x.fillRect(a,b,w||1,h||1)}
function speck(x,r,cols,n,big){
  for(let i=0;i<n;i++){
    const a=Math.floor(r()*TS),b=Math.floor(r()*TS);
    const s=(big&&r()<.25)?2:1;
    px(x,cols[Math.floor(r()*cols.length)],a,b,s,s);
  }
}
/* Motif de briques générique */
function bricks(x,base,mortar,dark,rows,off){
  fill(x,base);
  for(let y=0;y<TS;y+=rows){px(x,mortar,0,y,TS,1)}
  for(let y=0,i=0;y<TS;y+=rows,i++){
    const s=(i%2)*Math.floor(TS/2)+off;
    for(let k=0;k<2;k++){const cx=(s+k*Math.floor(TS/2)+TS)%TS;px(x,mortar,cx,y,1,rows)}
  }
  for(let y=1;y<TS;y+=rows)px(x,dark,0,y,TS,1);
}
/* Minerai : pierre + pépites */
function ore(x,r,c1,c2,c3){
  fill(x,"#7d7d7d");speck(x,r,["#8f8f8f","#6b6b6b","#999","#727272"],40,true);
  const blobs=[[3,3],[10,4],[5,10],[11,11],[8,7]];
  for(const [a,b] of blobs){
    if(r()<.18)continue;
    const w=1+Math.floor(r()*2),h=1+Math.floor(r()*2);
    px(x,c3,a-1,b-1,w+2,h+2);px(x,c1,a,b,w+1,h+1);px(x,c2,a,b,1,1);
  }
}

/* --- Terre / herbe --- */
T("dirt",(x,r)=>{fill(x,"#866043");speck(x,r,["#9a7050","#74513a","#a07a58","#6b4a34"],46,true)});
T("grass_top",(x,r)=>{fill(x,"#78ad4e");speck(x,r,["#6b9d44","#8abd5c","#5f8f3c","#94c766"],60,true)});
T("grass_side",(x,r)=>{
  fill(x,"#866043");speck(x,r,["#9a7050","#74513a","#6b4a34"],36,true);
  px(x,"#78ad4e",0,0,TS,4);
  for(let i=0;i<TS;i++){const d=3+Math.floor(r()*3);px(x,"#78ad4e",i,4,1,d-3);
    if(r()<.5)px(x,"#6b9d44",i,Math.floor(r()*4),1,1)}
});
T("snow",(x,r)=>{fill(x,"#f2fbfb");speck(x,r,["#e3eef0","#ffffff","#dbe7ea"],40,true)});
T("grass_snow_side",(x,r)=>{
  fill(x,"#866043");speck(x,r,["#9a7050","#74513a"],30,true);
  px(x,"#f2fbfb",0,0,TS,4);
  for(let i=0;i<TS;i++)px(x,"#f2fbfb",i,4,1,Math.floor(r()*3));
});
T("sand",(x,r)=>{fill(x,"#dbd0a0");speck(x,r,["#e8dcae","#cdc191","#f0e6bd","#c2b688"],48,true)});
T("sandstone_top",(x,r)=>{fill(x,"#e2d7a8");speck(x,r,["#d5c99a","#eee2b6"],30)});
T("sandstone_side",(x,r)=>{
  fill(x,"#e2d7a8");speck(x,r,["#d5c99a","#eee2b6"],26);
  px(x,"#c9bd8e",0,4,TS,1);px(x,"#c9bd8e",0,9,TS,1);px(x,"#c9bd8e",0,14,TS,1);
  px(x,"#f2e8bd",0,5,TS,1);
});
T("gravel",(x,r)=>{fill(x,"#7f7c7a");speck(x,r,["#6a6664","#948f8c","#585452","#a09b98"],70,true)});
T("clay",(x,r)=>{fill(x,"#a4a8b8");speck(x,r,["#9296a6","#b4b8c8"],36,true)});

/* --- Pierres --- */
T("stone",(x,r)=>{fill(x,"#7d7d7d");speck(x,r,["#8f8f8f","#6b6b6b","#999999","#727272"],52,true)});
T("cobblestone",(x,r)=>{
  fill(x,"#6e6e6e");
  const cells=[[0,0,7,5],[8,0,7,7],[0,6,5,5],[6,6,4,4],[11,8,4,7],[0,12,6,4],[6,11,4,5]];
  for(const [a,b,w,h] of cells){
    const t=["#8a8a8a","#7d7d7d","#949494","#717171"][Math.floor(r()*4)];
    px(x,t,a,b,w,h);
    for(let i=0;i<6;i++)px(x,r()<.5?"#5f5f5f":"#9d9d9d",a+Math.floor(r()*w),b+Math.floor(r()*h),1,1);
    px(x,"#585858",a,b,w,1);
  }
});
T("mossy",(x,r)=>{
  fill(x,"#6b7360");
  const cells=[[0,0,7,5],[8,0,7,7],[0,6,5,5],[6,6,4,4],[11,8,4,7],[0,12,6,4],[6,11,4,5]];
  for(const [a,b,w,h] of cells){px(x,["#7f8a6e","#728063","#8a9578"][Math.floor(r()*3)],a,b,w,h);
    for(let i=0;i<5;i++)px(x,r()<.5?"#5a6551":"#93a37f",a+Math.floor(r()*w),b+Math.floor(r()*h),1,1);}
});
T("stone_bricks",(x,r)=>{bricks(x,"#7b7b7b","#606060","#6d6d6d",5,0);
  speck(x,r,["#8a8a8a","#6f6f6f"],26)});
T("bricks",(x,r)=>{bricks(x,"#9a5a4a","#c4b8ac","#8d5142",4,1);
  speck(x,r,["#a8695a","#8b4c3e"],22)});
T("obsidian",(x,r)=>{fill(x,"#140c1e");speck(x,r,["#241735","#0d0714","#32224a"],44,true)});
T("bedrock",(x,r)=>{fill(x,"#565656");speck(x,r,["#333","#6e6e6e","#7d7d7d","#222"],80,true)});
T("netherrack",(x,r)=>{fill(x,"#6e3131");speck(x,r,["#5a2626","#823c3c","#8f4444","#4d2020"],66,true)});

/* --- Minerais --- */
T("coal_ore",(x,r)=>ore(x,r,"#2b2b2b","#3f3f3f","#1a1a1a"));
T("iron_ore",(x,r)=>ore(x,r,"#d8a279","#e8bf9d","#a97b57"));
T("gold_ore",(x,r)=>ore(x,r,"#f2c942","#ffe27a","#c09a25"));
T("diamond_ore",(x,r)=>ore(x,r,"#4fe0d8","#9df6f0","#2ba59e"));
T("redstone_ore",(x,r)=>ore(x,r,"#c62222","#ff4444","#8a1616"));
T("emerald_ore",(x,r)=>ore(x,r,"#2fc45a","#69f291","#1d8a3d"));
T("lapis_ore",(x,r)=>ore(x,r,"#2c52c9","#5f80ee","#1c357f"));

/* --- Bois --- */
T("log_top",(x,r)=>{
  fill(x,"#b0894f");
  const cx=8,cy=8;
  for(let i=0;i<TS;i++)for(let j=0;j<TS;j++){
    const d=Math.hypot(i-cx+.5,j-cy+.5);
    if(d>7.4)px(x,"#6b4a24",i,j);
    else if(d>6.6)px(x,"#5e4120",i,j);
    else if(Math.floor(d)%2===0)px(x,"#9c7742",i,j);
  }
  px(x,"#6b4a24",7,7,2,2);
});
T("log_side",(x,r)=>{
  fill(x,"#6b4a24");
  for(let i=0;i<TS;i++){
    const c=["#75512a","#61411f","#7e5930","#5a3c1c"][Math.floor(r()*4)];
    px(x,c,i,0,1,TS);
  }
  px(x,"#4f3418",3,0,1,TS);px(x,"#4f3418",11,0,1,TS);
  for(let i=0;i<18;i++)px(x,r()<.5?"#835e33":"#513518",Math.floor(r()*TS),Math.floor(r()*TS),1,2);
});
T("birch_top",(x,r)=>{
  fill(x,"#d7cdb4");
  for(let i=0;i<TS;i++)for(let j=0;j<TS;j++){
    const d=Math.hypot(i-7.5,j-7.5);
    if(d>7.4)px(x,"#e8e6dd",i,j);else if(Math.floor(d)%3===0)px(x,"#c4b89b",i,j);
  }
});
T("birch_side",(x,r)=>{
  fill(x,"#dcd8cd");speck(x,r,["#eae7de","#cbc6b8"],28);
  for(let i=0;i<5;i++){const y=Math.floor(r()*TS),w=2+Math.floor(r()*4),a=Math.floor(r()*(TS-w));
    px(x,"#4a4238",a,y,w,1)}
});
T("planks",(x,r)=>{
  fill(x,"#b58a52");
  for(let y=0;y<TS;y+=4){
    px(x,"#8d6a3c",0,y,TS,1);px(x,"#c99a5e",0,y+1,TS,1);
    for(let i=0;i<7;i++)px(x,r()<.5?"#a87c46":"#c19158",Math.floor(r()*TS),y+1+Math.floor(r()*3),1+Math.floor(r()*2),1);
  }
  px(x,"#8d6a3c",5,0,1,4);px(x,"#8d6a3c",11,4,1,4);px(x,"#8d6a3c",3,8,1,4);px(x,"#8d6a3c",9,12,1,4);
});
T("birch_planks",(x,r)=>{

function mask(x,rows,cols){
  x.clearRect(0,0,TS,TS);
  for(let j=0;j<rows.length;j++){
    const row=rows[j];
    for(let i=0;i<row.length;i++){
      const c=cols[row[i]];
      if(c)px(x,c,i,j,1,1);
    }
  }
}

const BLOCKS=[], ID={};
function block(name,label,o){
  const d=Object.assign({
    name,label,
    top:o.tile,side:o.tile,bottom:o.tile,
    solid:true,opaque:true,alpha:false,hardness:1,tool:null,tier:0,
    drop:name,dropCount:1,light:0,liquid:false
  },o);
  if(o.top===undefined)d.top=o.tile||o.side;
  if(o.bottom===undefined)d.bottom=o.tile||o.side;
  if(o.side===undefined)d.side=o.tile;
  d.id=BLOCKS.length;ID[name]=d.id;BLOCKS.push(d);
  return d;
}

/* Grille -> recette (grille = tableau 3x3 d'ids ou null) */
function matchRecipe(stacks,size){
  /* Les emplacements contiennent des piles {id,n} : on extrait les identifiants. */
  const grid=new Array(9).fill(null);
  for(let j=0;j<size;j++)for(let i=0;i<size;i++){
    const s=stacks[j*3+i];
    grid[j*3+i]=s?(typeof s==="string"?s:s.id):null;
  }
  const cells=[];
  for(let j=0;j<size;j++)for(let i=0;i<size;i++)cells.push(grid[j*3+i]);
  const present=cells.filter(Boolean);
  if(!present.length)return null;
  for(const rec of RECIPES){
    if(rec.shapeless){
      if(present.length!==rec.list.length)continue;
      const pool=present.slice();let ok=true;
      for(const pat of rec.list){
        const k=pool.findIndex(v=>tagMatch(pat,v));
        if(k<0){ok=false;break}
        pool.splice(k,1);
      }
      if(ok)return rec;
    }else{
      const rh=rec.rows.length,rw=Math.max(...rec.rows.map(r=>r.length));
      if(rh>size||rw>size)continue;
      for(let oy=0;oy<=size-rh;oy++)for(let ox=0;ox<=size-rw;ox++){
        let ok=true;
        for(let j=0;j<size&&ok;j++)for(let i=0;i<size&&ok;i++){
          const cell=grid[j*3+i];
          const ri=i-ox,rj=j-oy;
          let pat=null;
          if(ri>=0&&rj>=0&&rj<rh&&ri<(rec.rows[rj]||"").length){
            const ch=rec.rows[rj][ri];
            if(ch!==" ")pat=rec.key[ch];
          }
          if(!tagMatch(pat,cell))ok=false;
        }
        if(ok)return rec;
      }
    }
  }
  return null;
}

const W=64,D=64,H=44,SEA=20,CH=8;
const CX=W/CH, CZ=D/CH;
const vox=new Uint8Array(W*D*H);
const skyL=new Uint8Array(W*D*H), blkL=new Uint8Array(W*D*H);
const IDX=(x,y,z)=>(y*D+z)*W+x;
const inside=(x,y,z)=>x>=0&&x<W&&y>=0&&y<H&&z>=0&&z<D;
function get(x,y,z){return inside(x,y,z)?vox[IDX(x,y,z)]:(y<0?ID.bedrock:0)}
function set(x,y,z,b){if(inside(x,y,z))vox[IDX(x,y,z)]=b}
function topY(x,z){for(let y=H-1;y>=0;y--){const b=get(x,y,z);if(b&&b!==ID.water)return y}return 0}

let WORLD_SEED=Math.floor(Math.random()*1e9);
function generate(seed){
  WORLD_SEED=seed;
  const n1=makeNoise2(seed),n2=makeNoise2(seed+7),n3=makeNoise2(seed+13),
        nb=makeNoise2(seed+31),nc=makeNoise2(seed+53),nd=makeNoise2(seed+71);
  const rnd=mulberry(seed+99);
  vox.fill(0);
  const biomeAt=[];
  for(let z=0;z<D;z++)for(let x=0;x<W;x++){
    const e=n1(x/48,z/48)*1.0+n2(x/22,z/22)*.42+n3(x/11,z/11)*.16;
    let h=Math.round(SEA+2+e*11);
    h=clamp(h,4,H-14);
    const t=nb(x/60+10,z/60+10);
    const biome=t>.30?"desert":(t<-.32?"snow":(nc(x/30,z/30)>.15?"forest":"plains"));
    biomeAt.push(biome);
    for(let y=0;y<=h;y++){
      let b=ID.stone;
      if(y===0)b=ID.bedrock;
      else if(y===h){
        if(h<=SEA)b=ID.sand;
        else b=biome==="desert"?ID.sand:(biome==="snow"?ID.snowy_grass:ID.grass);
      }else if(y>h-4){
        b=biome==="desert"?ID.sand:(h<=SEA+1?ID.gravel:ID.dirt);
      }
      set(x,y,z,b);
    }
    for(let y=h+1;y<=SEA;y++)set(x,y,z,ID.water);
    if(biome==="snow"&&h>SEA&&get(x,h,z)===ID.snowy_grass){/* déjà enneigé */}
  }
  /* Grottes */
  const hm=new Int16Array(W*D);
  for(let z=0;z<D;z++)for(let x=0;x<W;x++)hm[z*W+x]=topY(x,z);
  for(let y=2;y<H-16;y++)for(let z=0;z<D;z++)for(let x=0;x<W;x++){
    const b=get(x,y,z);
    if(b===0||b===ID.bedrock||b===ID.water)continue;
    const c=Math.abs(n1(x/16,z/16+y*.31)+n2(x/13+y*.27,z/13)+n3(y/9,x/17+z/17));
    if(c<0.24&&y<hm[z*W+x]-1)set(x,y,z,0);
  }
  /* Minerais en filons */
  const veins=[[ID.coal_ore,26,7,4,H-10],[ID.iron_ore,20,5,3,30],[ID.gold_ore,9,4,2,18],
               [ID.diamond_ore,6,3,2,13],[ID.redstone_ore,10,5,2,15],
               [ID.lapis_ore,8,4,2,20],[ID.emerald_ore,4,2,2,14]];
  for(const [b,count,size,ymin,ymax] of veins){
    for(let i=0;i<count*8;i++){
      let x=Math.floor(rnd()*W),y=ymin+Math.floor(rnd()*(ymax-ymin)),z=Math.floor(rnd()*D);
      for(let k=0;k<size;k++){
        if(get(x,y,z)===ID.stone)set(x,y,z,b);
        x+=Math.floor(rnd()*3)-1;y+=Math.floor(rnd()*3)-1;z+=Math.floor(rnd()*3)-1;
        if(!inside(x,y,z))break;
      }
    }
  }
  /* Arbres, cactus, décor */
  for(let z=3;z<D-3;z++)for(let x=3;x<W-3;x++){
    const biome=biomeAt[z*W+x];
    const y=topY(x,z),g=get(x,y,z);
    const dens=biome==="forest"?.045:(biome==="plains"?.012:(biome==="snow"?.02:.006));
    if(g===ID.grass||g===ID.snowy_grass){
      if(rnd()<dens){
        const birch=biome==="snow"||rnd()<.25;
        const hgt=4+Math.floor(rnd()*3);
        const LOG=birch?ID.birch_log:ID.log, LEAF=birch?ID.birch_leaves:ID.leaves;
        for(let i=1;i<=hgt;i++)set(x,y+i,z,LOG);
        for(let dy=hgt-2;dy<=hgt+1;dy++){
          const rad=dy>=hgt?1:2;
          for(let dx=-rad;dx<=rad;dx++)for(let dz=-rad;dz<=rad;dz++){
            if(dx===0&&dz===0&&dy<=hgt)continue;
            if(Math.abs(dx)===rad&&Math.abs(dz)===rad&&rnd()<.6)continue;
            if(get(x+dx,y+dy,z+dz)===0)set(x+dx,y+dy,z+dz,LEAF);
          }
        }
      }
    }else if(g===ID.sand&&biome==="desert"&&rnd()<.012){
      const hgt=2+Math.floor(rnd()*3);
      for(let i=1;i<=hgt;i++)set(x,y+i,z,ID.cactus);
    }
    if(biome==="plains"&&g===ID.grass&&rnd()<.010)set(x,y+1,z,ID.pumpkin);
    if(biome==="snow"&&get(x,y,z)===ID.water)set(x,y,z,ID.ice);
  }
  computeLight();
}

/* --- Lumière (ciel + blocs) --- */
const lq=[];
function computeLight(){
  skyL.fill(0);blkL.fill(0);
  lq.length=0;
  let head=0,tail=0;
  for(let z=0;z<D;z++)for(let x=0;x<W;x++){
    for(let y=H-1;y>=0;y--){
      const i=IDX(x,y,z);
      if(isOpaque[vox[i]])break;
      skyL[i]=15;lq[tail++]=i;
    }
  }
  while(head<tail){
    const i=lq[head++],l=skyL[i];
    if(l<=1)continue;
    const y=Math.floor(i/(W*D)), rem=i-y*W*D, z=Math.floor(rem/W), x=rem-z*W;
    for(const [dx,dy,dz] of NEI){
      const nx=x+dx,ny=y+dy,nz=z+dz;
      if(!inside(nx,ny,nz))continue;
      const j=IDX(nx,ny,nz);
      if(isOpaque[vox[j]])continue;
      const nl=l-1;
      if(skyL[j]<nl){skyL[j]=nl;lq[tail++]=j}
    }
  }
  head=tail=0;lq.length=0;
  for(let i=0;i<vox.length;i++){const e=lightOf[vox[i]];if(e){blkL[i]=e;lq[tail++]=i}}
  while(head<tail){
    const i=lq[head++],l=blkL[i];
    if(l<=1)continue;
    const y=Math.floor(i/(W*D)), rem=i-y*W*D, z=Math.floor(rem/W), x=rem-z*W;
    for(const [dx,dy,dz] of NEI){
      const nx=x+dx,ny=y+dy,nz=z+dz;
      if(!inside(nx,ny,nz))continue;
      const j=IDX(nx,ny,nz);
      if(isOpaque[vox[j]]&&!lightOf[vox[j]])continue;
      const nl=l-1;
      if(blkL[j]<nl){blkL[j]=nl;lq[tail++]=j}
    }
  }
}

function buildChunk(cx,cz){
  const P=[],U=[],C=[],I=[],P2=[],U2=[],C2=[],I2=[];
  const x0=cx*CH,z0=cz*CH;
  let ymax=0;

    for(let y=H-1;y>ymax;y--)if(vox[IDX(x,y,z)]){ymax=y;break}

    const alpha=isAlpha[b],liq=BLOCKS[b].liquid;
    for(let a=0;a<3;a++){
      const u=UA[a],v=VA[a];
      for(let s=-1;s<=1;s+=2){
        let nx=x,ny=y,nz=z;
        if(a===0)nx+=s;else if(a===1)ny+=s;else nz+=s;
        const ok=nx>=0&&nx<W&&ny>=0&&ny<H&&nz>=0&&nz<D;
        const nb=ok?vox[IDX(nx,ny,nz)]:(ny<0?1:0);
        if(nb===b||isOpaque[nb])continue;
        if(alpha&&isAlpha[nb]&&BLOCKS[nb].liquid===liq)continue;
        /* tuile */
        let ti;
        if(a===1)ti=s>0?tTop[b]:tBot[b];
        else{
          ti=tSide[b];
          if(tFront[b]>=0){
            const f=facing[IDX(x,y,z)];
            if(f===undefined){if(a===2&&s>0)ti=tFront[b]}
            else{const fv=FRONTV[f];
              if((a===2&&fv[0]===s)||(a===0&&fv[1]===s))ti=tFront[b]}
          }
        }
        const u0=uvTab[ti*4],v0=uvTab[ti*4+1],u1=uvTab[ti*4+2],v1=uvTab[ti*4+3];
        const li=ok?Math.max(skyL[IDX(nx,ny,nz)]*dayFactor,blkL[IDX(nx,ny,nz)])/15:1;
        const shd=SHADE[a][s>0?0:1]*(0.09+0.91*Math.pow(li,1.25));
        const tp=alpha?P2:P, tu=alpha?U2:U, tc=alpha?C2:C, tix=alpha?I2:I;
        const vs=tp.length/3;
        let a0=3,a1=3,a2=3,a3=3;
        for(let k=0;k<4;k++){
          const i=CO[k*2],j=CO[k*2+1];
          pp[a]=(a===0?x:a===1?y:z)+(s>0?1:0);
          pp[u]=(u===0?x:u===1?y:z)+i;
          pp[v]=(v===0?x:v===1?y:z)+j;
          tp.push(pp[0],pp[1],pp[2]);
          let ao=3;
          if(!alpha){
            const du=i*2-1,dv=j*2-1;
            oa[0]=nx;oa[1]=ny;oa[2]=nz;ob[0]=nx;ob[1]=ny;ob[2]=nz;oc[0]=nx;oc[1]=ny;oc[2]=nz;
            oa[u]+=du;ob[v]+=dv;oc[u]+=du;oc[v]+=dv;
            const o1=occl(oa[0],oa[1],oa[2]),o2=occl(ob[0],ob[1],ob[2]),o3=occl(oc[0],oc[1],oc[2]);
            ao=(o1&&o2)?0:3-(o1+o2+o3);
          }
          if(k===0)a0=ao;else if(k===1)a1=ao;else if(k===2)a2=ao;else a3=ao;
          const l=shd*AOV[ao];
          tc.push(l,l,l);
          let tuu,tvv;
          if(a===2){tuu=i;tvv=j}else{tuu=j;tvv=i}
          tu.push(u0+(u1-u0)*tuu, v0+(v1-v0)*tvv);
        }
        const flip=(a0+a2>a1+a3);
        if(s>0){
          if(flip)tix.push(vs+1,vs+2,vs+3,vs+1,vs+3,vs);
          else tix.push(vs,vs+1,vs+2,vs,vs+2,vs+3);
        }else{
          if(flip)tix.push(vs+1,vs+3,vs+2,vs+1,vs,vs+3);
          else tix.push(vs,vs+2,vs+1,vs,vs+3,vs+2);
        }
      }
    }
  }
  const mk=(p,u,c,i,mat)=>{
    if(!p.length)return null;
    const g=new THREE.BufferGeometry();
    g.setAttribute("position",new THREE.Float32BufferAttribute(p,3));
    g.setAttribute("uv",new THREE.Float32BufferAttribute(u,2));
    g.setAttribute("color",new THREE.Float32BufferAttribute(c,3));
    g.setIndex(i);g.computeBoundingSphere();
    return new THREE.Mesh(g,mat);
  };
  const k=cz*CX+cx;
  if(chunkMeshes[k]){for(const m of chunkMeshes[k]){scene.remove(m);m.geometry.dispose()}}
  const m1=mk(P,U,C,I,matOpaque), m2=mk(P2,U2,C2,I2,matAlpha);
  const list=[];
  if(m1){scene.add(m1);list.push(m1)}
  if(m2){m2.renderOrder=1;scene.add(m2);list.push(m2)}
  chunkMeshes[k]=list;
}
const dirty=new Set();
function markDirty(cx,cz){if(cx>=0&&cz>=0&&cx<CX&&cz<CZ)dirty.add(cz*CX+cx)}
function markAllDirty(){for(let i=0;i<CX*CZ;i++)dirty.add(i)}
function markAround(x,z){
  const cx=Math.floor(x/CH),cz=Math.floor(z/CH);
  markDirty(cx,cz);
  for(let i=-1;i<=1;i++)for(let j=-1;j<=1;j++)markDirty(cx+i,cz+j);
}
function flushDirty(max){
  let n=0;
  for(const k of dirty){
    buildChunk(k%CX,Math.floor(k/CX));
    dirty.delete(k);
    if(++n>=max)break;
  }
}

function addItem(id,n){
  if(!id||n<=0)return 0;
  const mx=maxStack(id);
  const lists=[inv.hot,inv.main];
  for(const L of lists)for(let i=0;i<L.length;i++){
    const s=L[i];
    if(s&&s.id===id&&s.n<mx){const add=Math.min(mx-s.n,n);s.n+=add;n-=add;if(!n)return 0}
  }
  for(const L of lists)for(let i=0;i<L.length;i++){
    if(!L[i]){const add=Math.min(mx,n);L[i]={id,n:add};n-=add;if(!n)return 0}
  }
  return n;
}
function countItem(pat){

    const s=L[i];
    if(s&&tagMatch(pat,s.id)){
      const d=Math.min(s.n,n);s.n-=d;n-=d;
      if(s.n<=0)L[i]=null;
      if(!n)return true;
    }

let actxA=null;
function audio(){if(!actxA)actxA=new (window.AudioContext||window.webkitAudioContext)();return actxA}
function sound(kind,pitch){
  try{
    const a=audio();
    if(a.state==="suspended")a.resume();
    const dur=kind==="explode"?.55:.13;
    const buf=a.createBuffer(1,a.sampleRate*dur,a.sampleRate);
    const d=buf.getChannelData(0);
    for(let i=0;i<d.length;i++){
      const t=i/d.length;
      d[i]=(Math.random()*2-1)*Math.pow(1-t,kind==="explode"?1.4:2.6);
    }
    const src=a.createBufferSource();src.buffer=buf;
    const f=a.createBiquadFilter();
    f.type=kind==="explode"?"lowpass":"bandpass";
    f.frequency.value=kind==="explode"?260:(kind==="place"?900:600)*(pitch||1);
    f.Q.value=kind==="explode"?1:1.6;
    const g=a.createGain();
    g.gain.value=kind==="explode"?.55:(kind==="step"?.10:.22);
    src.connect(f);f.connect(g);g.connect(a.destination);src.start();
  }catch(e){}
}

function stepParticles(dt){
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.life-=dt;
    if(p.life<=0){scene.remove(p.m);particles.splice(i,1);continue}
    p.vy-=22*dt;
    p.m.position.x+=p.vx*dt;p.m.position.y+=p.vy*dt;p.m.position.z+=p.vz*dt;
    const b=get(Math.floor(p.m.position.x),Math.floor(p.m.position.y),Math.floor(p.m.position.z));
    if(b&&isSolid[b]){p.m.position.y+=Math.abs(p.vy)*dt;p.vy=0;p.vx*=.6;p.vz*=.6}
    p.m.scale.setScalar(clamp(p.life*1.6,.2,1));
  }
}

function raycast(dist){
  const dir=new THREE.Vector3(0,0,-1).applyQuaternion(camera.quaternion);
  let x=Math.floor(camera.position.x),y=Math.floor(camera.position.y),z=Math.floor(camera.position.z);
  const sx=Math.sign(dir.x),sy=Math.sign(dir.y),sz=Math.sign(dir.z);
  const dx=sx!==0?Math.abs(1/dir.x):Infinity,dy=sy!==0?Math.abs(1/dir.y):Infinity,dz=sz!==0?Math.abs(1/dir.z):Infinity;
  let tx=sx>0?(x+1-camera.position.x)*dx:(camera.position.x-x)*dx;
  let ty=sy>0?(y+1-camera.position.y)*dy:(camera.position.y-y)*dy;
  let tz=sz>0?(z+1-camera.position.z)*dz:(camera.position.z-z)*dz;
  if(!isFinite(tx))tx=Infinity;if(!isFinite(ty))ty=Infinity;if(!isFinite(tz))tz=Infinity;
  let nx=0,ny=0,nz=0,t=0;
  while(t<dist){
    const b=get(x,y,z);
    if(b&&b!==ID.water&&BLOCKS[b].name!=="air")return {x,y,z,nx,ny,nz,b};
    if(tx<ty&&tx<tz){x+=sx;t=tx;tx+=dx;nx=-sx;ny=0;nz=0}
    else if(ty<tz){y+=sy;t=ty;ty+=dy;nx=0;ny=-sy;nz=0}
    else{z+=sz;t=tz;tz+=dz;nx=0;ny=0;nz=-sz}
    if(!inside(x,y,z)&&(y<0||y>=H))return null;
  }
  return null;
}

let mining=null, breaking=false, placeCd=0;
function toolFor(b){
  const d=BLOCKS[b], s=held(), it=s?ITEMS[s.id]:null;
  let speed=1,tier=0;
  if(it&&it.tool){tier=it.tier;if(it.tool===d.tool)speed=it.speed;else speed=1.1}
  const can=!d.tool||tier>=d.tier;
  return {speed,tier,can,d};
}
function breakTime(b){
  const {speed,can,d}=toolFor(b);
  if(d.hardness<=0)return .05;
  return d.hardness*(can?1.5:5)/speed;
}
function doBreak(x,y,z){
  const b=get(x,y,z);
  if(!b||b===ID.bedrock)return;
  const d=BLOCKS[b];
  if(b===ID.tnt&&!player.crouch){igniteTNT(x,y,z);return}
  const {can}=toolFor(b);
  set(x,y,z,0);delete facing[IDX(x,y,z)];
  if(furnaces[x+","+y+","+z])delete furnaces[x+","+y+","+z];
  if(chests[x+","+y+","+z]){
    for(const s of chests[x+","+y+","+z])if(s)addItem(s.id,s.n);
    delete chests[x+","+y+","+z];
  }
  burst(x,y,z,b,10);sound("dig",.9+Math.random()*.2);
  if(!creative){
    if(d.drop&&can)addItem(d.drop,d.dropCount||1);
    else if(b===ID.leaves&&Math.random()<.08)addItem("apple",1);
    if(d.tool)damageTool();
  }
  computeLight();markAround(x,z);markAllDirtyIfLight(b);
  updateHUD();
}
function markAllDirtyIfLight(b){if(BLOCKS[b].light>0||b===ID.glowstone)markAllDirty()}
function doPlace(){
  const hit=raycast(6);
  if(!hit)return;
  const s=held();
  const key=hit.x+","+hit.y+","+hit.z;
  const tb=get(hit.x,hit.y,hit.z);
  /* Interaction : ouvrir établi / four / coffre */
  if(!player.crouch){
    if(tb===ID.crafting_table){craftSize=3;openGui("table");return}
    if(tb===ID.furnace||tb===ID.furnace_lit){
      if(!furnaces[key])furnaces[key]={in:null,fuel:null,out:null,burn:0,burnMax:0,cook:0};
      guiPos=key;openGui("furnace");return}
    if(tb===ID.chest){
      if(!chests[key])chests[key]=Array(27).fill(null);
      guiPos=key;openGui("chest");sound("place",.7);return}
  }
  if(!s)return;
  if(ITEMS[s.id]&&ITEMS[s.id].food!==undefined){
    if(player.food<20||player.health<20){
      player.food=Math.min(20,player.food+ITEMS[s.id].food);
      if(!creative){s.n--;if(s.n<=0)inv.hot[sel]=null}
      sound("step");updateHUD();
    }
    return;
  }
  if(ID[s.id]===undefined)return;
  const x=hit.x+hit.nx,y=hit.y+hit.ny,z=hit.z+hit.nz;
  if(!inside(x,y,z))return;
  if(get(x,y,z)!==0&&get(x,y,z)!==ID.water)return;
  const bid=ID[s.id];
  set(x,y,z,bid);
  if(BLOCKS[bid].solid&&boxHits(player.x,player.y,player.z,player.crouch?PCH:PH)){set(x,y,z,0);return}
  if(BLOCKS[bid].front){
    const f=((Math.round(yaw/(Math.PI/2))%4)+4)%4;
    facing[IDX(x,y,z)]=f;
  }
  if(!creative){s.n--;if(s.n<=0)inv.hot[sel]=null}
  sound("place");
  computeLight();markAround(x,z);markAllDirtyIfLight(bid);
  updateHUD();
}

function explode(cx,cy,cz,r){

    if(!inside(x,y,z))continue;
    const d=Math.hypot(x+.5-cx,y+.5-cy,z+.5-cz);

  }

function slotClick(c,i,right){

    cursor=cursor?{id:cursor.id,n:cursor.n+res.n}:{id:res.id,n:res.n};
    consumeCraft();sound("place",1.2);renderGui();return;
  }

    if(!f.out)return;

    cursor=cursor?{id:cursor.id,n:cursor.n+f.out.n}:f.out;
    f.out=null;renderGui();return;
  }
  let cur;
  if(c==="fin")cur=furnaces[guiPos].in;
  else if(c==="ffuel")cur=furnaces[guiPos].fuel;
  else cur=getSt(c,i);
  const put=v=>{
    if(c==="fin")furnaces[guiPos].in=v;
    else if(c==="ffuel")furnaces[guiPos].fuel=v;
    else setSt(c,i,v);
  };
  if(right){
    if(cursor){
      if(!cur){put({id:cursor.id,n:1});cursor.n--;}
      else if(cur.id===cursor.id&&cur.n<maxStack(cur.id)){cur.n++;cursor.n--;}
      if(cursor.n<=0)cursor=null;
    }else if(cur){
      const half=Math.ceil(cur.n/2);
      cursor={id:cur.id,n:half,dmg:cur.dmg};
      cur.n-=half;if(cur.n<=0)put(null);
    }
  }else{
    if(cursor&&cur&&cur.id===cursor.id&&!ITEMS[cur.id]?.durability){
      const mx=maxStack(cur.id),add=Math.min(mx-cur.n,cursor.n);
      cur.n+=add;cursor.n-=add;if(cursor.n<=0)cursor=null;
    }else{const tmp=cur||null;put(cursor);cursor=tmp}
  }
  renderGui();updateHUD();
}

const DAYLEN=420;
let worldTime=DAYLEN*0.25, lastDayStep=-1;
const SKY_DAY=new THREE.Color(0x87ceeb),SKY_NIGHT=new THREE.Color(0x08102a),SKY_DUSK=new THREE.Color(0xe08a4a);
function updateSky(dt){
  worldTime=(worldTime+dt)%DAYLEN;
  const t=worldTime/DAYLEN;
  const s=Math.sin(t*Math.PI*2-Math.PI/2);
  dayFactor=clamp((s+.35)/1.1,.16,1);
  const col=new THREE.Color();
  if(s>0.15)col.copy(SKY_DAY);
  else if(s>-.25)col.copy(SKY_DUSK).lerp(s>0?SKY_DAY:SKY_NIGHT,s>0?s/.15:(-s)/.25);
  else col.copy(SKY_NIGHT);
  col.multiplyScalar(clamp(dayFactor+.12,.2,1));
  scene.background=col;scene.fog.color=col;
  clouds.material.opacity=.25+.45*dayFactor;
  const step=Math.round(dayFactor*7);
  if(step!==lastDayStep){lastDayStep=step;markAllDirty()}
  cloudTex.offset.x=worldTime*0.004;
}

function tickFurnaces(dt){
  for(const key in furnaces){
    const f=furnaces[key];
    const [x,y,z]=key.split(",").map(Number);
    const canSmelt=f.in&&SMELT[f.in.id]&&(!f.out||(f.out.id===SMELT[f.in.id]&&f.out.n<64));
    if(f.burn>0)f.burn-=dt;
    if(f.burn<=0&&canSmelt&&f.fuel&&FUELS[f.fuel.id]){
      f.burnMax=FUELS[f.fuel.id]*1.2;f.burn=f.burnMax;
      f.fuel.n--;if(f.fuel.n<=0)f.fuel=null;
    }
    const lit=f.burn>0;
    const b=get(x,y,z);
    if(lit&&b===ID.furnace){set(x,y,z,ID.furnace_lit);computeLight();markAround(x,z)}
    if(!lit&&b===ID.furnace_lit){set(x,y,z,ID.furnace);computeLight();markAround(x,z)}
    if(lit&&canSmelt){
      f.cook+=dt;
      if(f.cook>=8){
        f.cook=0;
        const outId=SMELT[f.in.id];
        f.out=f.out?{id:outId,n:f.out.n+1}:{id:outId,n:1};
        f.in.n--;if(f.in.n<=0)f.in=null;
      }
    }else f.cook=Math.max(0,f.cook-dt*2);
  }
}

let last=performance.now(),stepT=0,guiRefresh=0,fps=0,fpsT=0,frames=0;
function update(dt){
  const h=player.crouch?PCH:PH;
  /* accroupi */
  const wantCrouch=!!(keys.shift);
  if(wantCrouch!==player.crouch){
    if(wantCrouch){player.crouch=true}
    else if(!boxHits(player.x,player.y,player.z,PH))player.crouch=false;
  }
  const water=inWater(),ladder=onLadder();
  player.sprint=!!keys.ctrl&&!player.crouch&&player.food>6;
  let speed=player.crouch?2.0:(player.sprint?6.4:4.4);
  if(water)speed*=.55;
  let fwd=0,rgt=0;
  if(keys.z||keys.w||keys.arrowup)fwd++;
  if(keys.s||keys.arrowdown)fwd--;
  if(keys.d||keys.arrowright)rgt++;
  if(keys.q||keys.a||keys.arrowleft)rgt--;
  if(joyOn){fwd=-joyY;rgt=joyX}
  const L=Math.hypot(fwd,rgt);
  if(L>1){fwd/=L;rgt/=L}
  const fx=-Math.sin(yaw),fz=-Math.cos(yaw),rx=Math.cos(yaw),rz=-Math.sin(yaw);
  const mx=(fx*fwd+rx*rgt)*speed*dt, mz=(fz*fwd+rz*rgt)*speed*dt;
  const autoStep=mobile&&player.onGround&&!player.crouch;
  if(!tryMove("x",mx)&&autoStep&&!boxHits(player.x+mx,player.y+1,player.z,h)){player.y+=1;tryMove("x",mx)}
  if(!tryMove("z",mz)&&autoStep&&!boxHits(player.x,player.y+1,player.z+mz,h)){player.y+=1;tryMove("z",mz)}
  /* saut / nage / échelle */
  if(ladder&&(fwd!==0||keys.space)){player.vy=keys.shift?-1.5:2.6;player.onGround=false}
  else if(water){
    player.vy=keys.space?3.2:Math.max(player.vy-8*dt,-2.4);
  }else{
    if(keys.space&&player.onGround){player.vy=8.6;player.onGround=false;player.fallFrom=player.y}
    player.vy-=25*dt;
    if(player.vy<-45)player.vy=-45;
  }
  const oldY=player.y;
  player.y+=player.vy*dt;
  if(boxHits(player.x,player.y,player.z,h)){
    if(player.vy<0){
      player.y=oldY;
      if(!player.onGround&&player.fallFrom!==null&&!water){
        const fall=player.fallFrom-player.y;
        if(fall>3.5)hurt(Math.floor(fall-3));
      }
      player.onGround=true;player.fallFrom=null;
    }else player.y=oldY;
    player.vy=0;
  }else{
    if(player.onGround&&player.vy<0)player.fallFrom=player.fallFrom??oldY;
    player.onGround=false;
    if(player.fallFrom===null&&player.vy<0)player.fallFrom=oldY;
  }
  if(player.onGround&&(Math.abs(mx)+Math.abs(mz))>0.001){
    stepT+=dt;
    if(stepT>(player.sprint?.28:.42)){stepT=0;sound("step",.8+Math.random()*.4)}
  }
  if(player.y<-6)respawn();

  /* dégâts environnementaux */
  player.hurtCd=Math.max(0,player.hurtCd-dt);
  const feet=blockAtPlayer(.1),body=blockAtPlayer(.9);
  if(feet===ID.cactus||body===ID.cactus)hurt(1);
  if(headWater()){player.air-=dt*60;if(player.air<0){player.air=0;hurt(1)}}
  else player.air=Math.min(300,player.air+dt*180);
  document.getElementById("water").style.opacity=headWater()?".38":"0";
  if(!creative){
    player.foodTimer+=dt*(player.sprint?2.2:1);
    if(player.foodTimer>26){player.foodTimer=0;player.food=Math.max(0,player.food-1)}
    if(player.food>16&&player.health<20){player.regen+=dt;if(player.regen>3.5){player.regen=0;player.health++;updateHUD()}}
    if(player.food<=0){player.regen+=dt;if(player.regen>4){player.regen=0;hurt(1)}}
  }

  /* caméra */
  camera.position.set(player.x,player.y+(player.crouch?1.15:1.62),player.z);
  camera.rotation.order="YXZ";camera.rotation.y=yaw;camera.rotation.x=pitch;
  camera.fov=THREE.MathUtils.lerp(camera.fov,player.sprint?80:72,dt*6);
  camera.updateProjectionMatrix();

  /* minage */
  const hit=guiMode?null:raycast(6);
  if(hit){
    highlight.visible=true;
    highlight.position.set(hit.x+.5,hit.y+.5,hit.z+.5);
  }else highlight.visible=false;
  if(breaking&&hit){
    if(!mining||mining.x!==hit.x||mining.y!==hit.y||mining.z!==hit.z)
      mining={x:hit.x,y:hit.y,z:hit.z,t:0};
    const need=creative?.02:breakTime(get(hit.x,hit.y,hit.z));
    mining.t+=dt;
    if(Math.random()<dt*8)burst(hit.x,hit.y,hit.z,get(hit.x,hit.y,hit.z),1);
    highlight.material.color.setScalar(clamp(mining.t/need,0,1)*.95);
    if(mining.t>=need){doBreak(mining.x,mining.y,mining.z);mining=null;
      if(!mobile&&!breaking)breaking=false}
  }else{mining=null;highlight.material.color.setScalar(0)}

  /* TNT */
  for(let i=tnts.length-1;i>=0;i--){
    const t=tnts[i];t.t-=dt;
    if(t.t<=0){explode(t.x,t.y,t.z,3.6);tnts.splice(i,1)}
  }
  tickFurnaces(dt);
  stepParticles(dt);
  updateSky(dt);
  clouds.position.x=player.x;clouds.position.z=player.z;
  flushDirty(2);
  if(guiMode==="furnace"){guiRefresh+=dt;if(guiRefresh>.3){guiRefresh=0;renderGui()}}
}
function loop(now){
  const dt=Math.min((now-last)/1000,.05);last=now;
  frames++;fpsT+=dt;if(fpsT>.5){fps=Math.round(frames/fpsT);frames=0;fpsT=0}
  if(started)update(dt);
  renderer.render(scene,camera);
  const dbg=document.getElementById("debug");
  if(dbg.style.display==="block"){
    dbg.innerHTML="Minicraft 4.0 — "+fps+" fps<br>XYZ "+player.x.toFixed(1)+" / "+
      player.y.toFixed(1)+" / "+player.z.toFixed(1)+"<br>Lumière "+
      Math.round(dayFactor*15)+" · heure "+Math.round(worldTime/DAYLEN*24)+"h<br>"+
      "Mode "+(creative?"créatif":"survie")+" · seed "+WORLD_SEED;
  }
  requestAnimationFrame(loop);
}
addEventListener("resize",()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

/* =========================================================================
   21. DÉMARRAGE
   ========================================================================= */
function initWorld(){
  generate(Math.floor(Math.random()*1e9));
  for(let cz=0;cz<CZ;cz++)for(let cx=0;cx<CX;cx++)buildChunk(cx,cz);
  player.x=W/2+.5;player.z=D/2+.5;
  player.y=topY(Math.floor(player.x),Math.floor(player.z))+1.2;
}
function giveStart(){
  if(creative){
    ["grass","stone","planks","glass","torch","tnt","glowstone","water","diamond_block"]
      .forEach((b,i)=>inv.hot[i]={id:b,n:64});
  }else{
    inv.hot[0]={id:"wood_pickaxe",n:1};
    inv.hot[1]={id:"wood_axe",n:1};
    inv.hot[2]={id:"torch",n:8};
    inv.main[0]={id:"apple",n:3};
  }
}
let modeSurvival=true;
document.getElementById("mSurvival").onclick=function(){
  modeSurvival=true;this.classList.add("on");document.getElementById("mCreative").classList.remove("on")};
document.getElementById("mCreative").onclick=function(){
  modeSurvival=false;this.classList.add("on");document.getElementById("mSurvival").classList.remove("on")};
function start(isMobile){
  mobile=isMobile;creative=!modeSurvival;
  document.getElementById("menu").style.display="none";
  document.getElementById("mob").style.display=isMobile?"block":"none";
  initWorld();giveStart();updateHUD();
  started=true;
  try{audio()}catch(e){}
  if(!isMobile)canvas.requestPointerLock?.();
}
document.getElementById("mPhone").onclick=()=>start(true);
document.getElementById("mPC").onclick=()=>start(false);
updateHUD();
requestAnimationFrame(loop);
</script>
