                    { t: "Avocado Side", r: ["1. Servir avec avocat frais."], ntr: "P: 20g | G: 58g | L: 22g", tip: "Bons lipides pour la satiété." },
                    { t: "Coriandre", r: ["1. Bouquet frais à la fin."], ntr: "P: 18g | G: 53g | L: 13g", tip: "Détoxifie les métaux lourds." }
                ]
            }
        ]
    };

    let planningGlobal = [];

    function toggleDark() { document.body.classList.toggle('dark-mode'); }

    function lancer() {
        if (!document.getElementById('age').value) return alert("Veuillez entrer votre Age !");
        
        const overlay = document.getElementById('loader-overlay');
        const percentTxt = document.getElementById('loading-percentage');
        overlay.style.display = "flex";
        
        let progress = 0;
        percentTxt.innerText = "0%";
        
        const interval = setInterval(() => {
            progress += 5;
            if(progress > 100) progress = 100;
            percentTxt.innerText = progress + "%";
            if(progress >= 100) clearInterval(interval);
        }, 55);

        setTimeout(() => { 
            genererPlanning(); 
            overlay.style.display = "none";
        }, 1200);
    }

    function genererPlanning() {
        const jours = parseInt(document.getElementById('select-duree').value);
        const isVeg = document.getElementById('check-veg').checked;

        const poolP = isVeg ? db.petitDej.filter(x => x.v === true) : db.petitDej;
        const poolM = isVeg ? db.dejeuner.filter(x => x.v === true) : db.dejeuner;
        const poolD = isVeg ? db.diner.filter(x => x.v === true) : db.diner;

        if(poolP.length === 0 || poolM.length === 0 || poolD.length === 0) {
            alert("Erreur : Pas assez de plats végétariens dans la base de données !");
            document.getElementById('loader-overlay').style.display = "none";
            return;
        }

        planningGlobal = [];
        for (let i = 0; i < jours; i++) {
            planningGlobal.push({
                p: JSON.parse(JSON.stringify(poolP[Math.floor(Math.random() * poolP.length)])),
                m: JSON.parse(JSON.stringify(poolM[Math.floor(Math.random() * poolM.length)])),
                d: JSON.parse(JSON.stringify(poolD[Math.floor(Math.random() * poolD.length)])),
                vP: 0, vM: 0, vD: 0
            });
        }
        afficherMenu();
    }

    function remplacerRepas(jIdx, type) {
        const isVeg = document.getElementById('check-veg').checked;
        const categorie = type === 'p' ? db.petitDej : (type === 'm' ? db.dejeuner : db.diner);
        const pool = isVeg ? categorie.filter(x => x.v === true) : categorie;
        if (pool.length <= 1) return;
        let nouveauPlat;
        const platActuelNom = planningGlobal[jIdx][type].n;
        do { nouveauPlat = pool[Math.floor(Math.random() * pool.length)]; } while (nouveauPlat.n === platActuelNom);
        planningGlobal[jIdx][type] = JSON.parse(JSON.stringify(nouveauPlat));
        planningGlobal[jIdx]['v' + type.toUpperCase()] = 0; 
        afficherMenu();
    }

    function changerVariante(jIdx, type) {
        let key = 'v' + type.toUpperCase();
        let plat = planningGlobal[jIdx][type];
        planningGlobal[jIdx][key] = (planningGlobal[jIdx][key] + 1) % plat.variantes.length;
        afficherMenu();
    }

    function toggleDetails(id) {
        const el = document.getElementById(id);
        el.style.display = (el.style.display === 'block') ? 'none' : 'block';
    }

    function afficherMenu() {
        let html = "";
        planningGlobal.forEach((jour, idx) => {
            if (idx % 7 === 0) {
                let listIng = new Set();
                let fin = Math.min(idx + 7, planningGlobal.length);
                for(let k=idx; k<fin; k++) {
                    [planningGlobal[k].p, planningGlobal[k].m, planningGlobal[k].d].forEach(r => r.i.forEach(ing => listIng.add(ing)));
                }
                html += `<div class="shopping-list"><b>🛒 LISTE DE COURSES (Semaine ${Math.floor(idx/7)+1})</b><br>${Array.from(listIng).map(n => `<span class="shopping-item">${n}</span>`).join('')}</div>`;
            }
            html += `<div class="day-box"><span class="cal-float">${jour.p.c + jour.m.c + jour.d.c} kcal</span><h3>JOUR ${idx + 1}</h3>${renderMeal(idx, 'p', '☀️ Petit-Déjeuner', jour.p, jour.vP)}${renderMeal(idx, 'm', '🥗 Déjeuner', jour.m, jour.vM)}${renderMeal(idx, 'd', '🌙 Dîner', jour.d, jour.vD)}</div>`;
        });
        document.getElementById('content-area').innerHTML = html;
    }

    function renderMeal(jIdx, type, label, meal, vIdx) {
        const id = `det-${jIdx}-${type}`;
        const v = meal.variantes[vIdx];
        return `<div class="meal-section"><b>${label} :</b> ${meal.n} <small>(${v.t})</small><br>🛒 Ingrédients : ${meal.i.join(', ')}<div class="no-print"><button class="btn-sm btn-replace" onclick="remplacerRepas(${jIdx}, '${type}')">🔄 Changer</button><button class="btn-sm btn-variant" onclick="changerVariante(${jIdx}, '${type}')">✨ Variante</button><button class="btn-sm btn-recipe" onclick="toggleDetails('${id}')">📖 Recette</button></div><div id="${id}" class="details-content"><b>👨‍🍳 PRÉPARATION :</b><br>${v.r.map((step, i) => `<b>${i+1}.</b> ${step}`).join('<br>')}<div class="macro-box">📊 <b>Valeurs :</b><br>${v.ntr}</div></div></div>`;
    }

    function sauvegarderProfil() {
        const p = { age: document.getElementById('age').value, poids: document.getElementById('poids').value, taille: document.getElementById('taille').value, sexe: document.getElementById('sexe').value, veg: document.getElementById('check-veg').checked };
        localStorage.setItem('NutriGenius_V9_FINAL', JSON.stringify(p));
    }

    function chargerProfil() {
        const s = localStorage.getItem('NutriGenius_V9_FINAL');
        if (s) {
            const d = JSON.parse(s);
            document.getElementById('age').value = d.age || "";
            document.getElementById('poids').value = d.poids || "";
            document.getElementById('taille').value = d.taille || "";
            document.getElementById('sexe').value = d.sexe || "H";
            document.getElementById('check-veg').checked = d.veg || false;
        }
    }

    function googleTranslateElementInit() {
      new google.translate.TranslateElement({
        pageLanguage: 'fr',
        layout: google.translate.TranslateElement.InlineLayout.SIMPLE,
        // Correction ici : On utilise la variable avec les 50 langues
        includedLanguages: supportedLangs, 
        autoDisplay: false
      }, 'google_translate_element');
    }
</script>
