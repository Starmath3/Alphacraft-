<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NutriGenius AI 26.1.5.2 - Pro Kitchen Edition</title>
    <style>
        :root { --bg: #f0f4f8; --card: white; --text: #2c3e50; --primary: #009245; --accent: #e67e22; }
        .dark-mode { --bg: #1a1a1a; --card: #2d2d2d; --text: #f0f4f8; --primary: #27ae60; --accent: #d35400; }
        
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); text-align: center; padding: 20px; transition: 0.3s; }
        .container { background: var(--card); padding: 25px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); display: inline-block; width: 100%; max-width: 800px; text-align: left; }
        
        .header-ui { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .dark-toggle { cursor: pointer; background: var(--primary); color: white; padding: 8px 15px; border-radius: 20px; font-size: 0.8em; font-weight: bold; }
        
        h1 { margin: 0; color: var(--primary); }
        .subtitle { font-weight: bold; font-size: 0.85em; text-transform: uppercase; margin-bottom: 20px; display: block; color: #7f8c8d; }
        
        .input-group { margin-bottom: 15px; background: rgba(0,0,0,0.03); padding: 15px; border-radius: 12px; }
        .row { display: flex; gap: 10px; margin-bottom: 10px; }
        .input-field, .select-box { width: 100%; padding: 12px; border-radius: 10px; border: 2px solid #e0e0e0; background: var(--card); color: var(--text); }
        
        .btn { width: 100%; padding: 15px; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; color: white; background: var(--primary); font-size: 1.1em; transition: 0.2s; margin-top: 10px; }
        .btn:hover { filter: brightness(1.1); transform: translateY(-2px); }
        
        .btn-sm { width: auto; padding: 8px 12px; font-size: 0.75em; margin: 4px 2px; border: none; border-radius: 8px; cursor: pointer; color: white; font-weight: bold; transition: 0.2s; }
        .btn-replace { background: var(--accent); }
        .btn-recipe { background: #3498db; }
        .btn-variant { background: #8e44ad; }

        #loader { display: none; margin: 20px 0; font-weight: bold; color: var(--primary); font-size: 1.2em; font-style: italic; }
        
        .day-box { background: var(--card); padding: 20px; margin-bottom: 20px; border-radius: 15px; border-left: 10px solid var(--primary); box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        .meal-section { margin-top: 15px; padding-top: 10px; border-top: 1px dashed rgba(127, 140, 141, 0.3); }
        .details-content { display: none; font-size: 0.95em; margin-top: 10px; background: rgba(0,0,0,0.04); padding: 20px; border-radius: 10px; line-height: 1.6; border-left: 4px solid #3498db; }
        
        .shopping-list { background: #e8f5e9; border: 2px dashed var(--primary); padding: 15px; border-radius: 12px; margin: 25px 0; color: #1b5e20; }
        .shopping-item { display: inline-block; background: white; padding: 5px 12px; margin: 4px; border-radius: 20px; font-size: 0.8em; font-weight: bold; border: 1px solid #c3e6cb; }

        .badge-ntr { background: #2c3e50; color: white; padding: 3px 10px; border-radius: 5px; font-size: 0.8em; margin-right: 5px; }
        .cal-float { float: right; background: var(--primary); color: white; padding: 4px 12px; border-radius: 10px; font-size: 0.9em; font-weight: bold; }

        @media print { .no-print, .btn-sm { display: none !important; } .details-content { display: block !important; border: none; background: none; } }
    </style>
</head>
<body onload="chargerProfil()">

<div class="container">
    <div class="header-ui">
        <h1>NutriGenius AI 🥗</h1>
        <div class="dark-toggle no-print" onclick="toggleDark()">🌓 Mode Sombre</div>
    </div>
    <span class="subtitle">v26.1.5.2 - Recettes Détaillées & Gestes Techniques</span>

    <div class="no-print">
        <div class="input-group">
            <div class="row">
                <input type="number" id="age" class="input-field" placeholder="Age" oninput="sauvegarderProfil()">
                <select id="sexe" class="input-field" onchange="sauvegarderProfil()">
                    <option value="H">Homme</option>
                    <option value="F">Femme</option>
                </select>
            </div>
            <div class="row">
                <input type="number" id="poids" class="input-field" placeholder="Poids (kg)" oninput="sauvegarderProfil()">
                <input type="number" id="taille" class="input-field" placeholder="Taille (cm)" oninput="sauvegarderProfil()">
            </div>
        </div>
        <select id="select-duree" class="select-box">
            <option value="1">🥗 Menu du Jour</option>
            <option value="7">📅 Menu de la Semaine</option>
            <option value="30">📊 Menu du Mois</option>
            <option value="365">🗓️ Menu de l'Année</option>
        </select>
        <button class="btn" onclick="lancer()">GÉNÉRER MON MENU</button>
    </div>

    <div id="loader">Loading...</div>
    <div id="resultat">
        <div id="content-area"></div>
    </div>
</div>

<script>
    const db = {
        petitDej: [
            { 
                n: "Omelette Soufflée au Curcuma 🍳", c: 360, 
                variantes: [
                    { r: ["Séparez les blancs des jaunes de 3 œufs certifiés.", "Montez les blancs en neige très ferme avec une pincée de sel.", "Mélangez doucement les jaunes avec 1/2 c.à.c de curcuma et des oignons verts ciselés.", "Incorporez délicatement les blancs aux jaunes avec une spatule sans les casser.", "Faites chauffer une poêle huilée et versez la préparation.", "Laissez cuire à feu très doux pendant 6 à 8 minutes sans retourner pour garder l'aspect soufflé."], ntr: "P: 22g | G: 4g | L: 18g", tip: "Couvrez la poêle pour que le dessus cuise à la vapeur." }
                ],
                i: ["Oeufs certifiés", "Oignons vert", "Curcuma", "Sel", "Poivre"]
            },
            { 
                n: "Pancakes à l'Avoine Aériens 🥞", c: 380, 
                variantes: [
                    { r: ["Mixez 50g de flocons d'avoine pour obtenir une farine.", "Mélangez avec 1 œuf et 100ml de lait de coco.", "Laissez reposer la pâte 15 minutes pour que l'avoine s'hydrate.", "Ajoutez une pincée de bicarbonate.", "Cuisez de petites louches dans une poêle antiadhésive 2 minutes par face à feu moyen."], ntr: "P: 15g | G: 45g | L: 12g", tip: "Si la pâte est trop épaisse, rajoutez un filet d'eau." }
                ],
                i: ["Flocons d'avoine", "Lait coco", "Oeuf", "Bicarbonate"]
            }
        ],
        dejeuner: [
            { 
                n: "Carry Poulet Traditionnel Halal 🍗", c: 580, 
                variantes: [
                    { r: ["Découpez le poulet en petits morceaux.", "Faites roussir la viande dans un peu d'huile pendant 10 min jusqu'à coloration dorée.", "Ajoutez les oignons émincés et laissez-les devenir translucides.", "Pilez ensemble l'ail, le gingembre et le sel, puis ajoutez-les à la marmite avec le curcuma et le thym.", "Ajoutez 3 tomates concassées.", "Couvrez et laissez mijoter à feu moyen pendant 25 à 30 minutes jusqu'à ce que la sauce soit épaisse (huile qui remonte)."], ntr: "P: 45g | G: 10g | L: 20g", tip: "N'ajoutez pas d'eau, le jus des tomates suffit pour une sauce onctueuse." }
                ],
                i: ["Poulet Halal", "Tomates", "Curcuma", "Oignons", "Ail", "Gingembre", "Thym"]
            }
        ],
        diner: [
            { 
                n: "Gratin de Chouchou Léger 🥘", c: 340, 
                variantes: [
                    { r: ["Épluchez 2 chouchous sous l'eau pour éviter que la sève ne colle aux mains.", "Coupez-les en dés et faites-les cuire à la vapeur pendant 20 min.", "Préparez une béchamel légère (lait, maïzena, muscade).", "Écrasez grossièrement les chouchous à la fourchette, mélangez à la sauce.", "Disposez dans un plat, parsemez de fromage râpé.", "Enfournez à 200°C pendant 15 min pour faire gratiner le dessus."], ntr: "P: 12g | G: 35g | L: 10g", tip: "Le secret : bien égoutter le chouchou pour ne pas que le gratin rende d'eau." }
                ]
            }
        ]
    };

    let planningGlobal = [];

    function toggleDark() { document.body.classList.toggle('dark-mode'); }

    function lancer() {
        if (!document.getElementById('age').value) return alert("Complétez votre profil !");
        document.getElementById('loader').style.display = "block";
        document.getElementById('resultat').style.display = "none";
        setTimeout(() => { genererPlanning(); }, 800);
    }

    function genererPlanning() {
        const jours = parseInt(document.getElementById('select-duree').value);
        planningGlobal = [];
        for (let i = 0; i < jours; i++) {
            planningGlobal.push({
                p: JSON.parse(JSON.stringify(db.petitDej[Math.floor(Math.random() * db.petitDej.length)])),
                m: JSON.parse(JSON.stringify(db.dejeuner[Math.floor(Math.random() * db.dejeuner.length)])),
                d: JSON.parse(JSON.stringify(db.diner[Math.floor(Math.random() * db.diner.length)])),
                vP: 0, vM: 0, vD: 0 
            });
        }
        afficherMenu();
    }

    function changerVariante(jIdx, type) {
        let key = 'v' + type.toUpperCase();
        let meal = planningGlobal[jIdx][type];
        planningGlobal[jIdx][key] = (planningGlobal[jIdx][key] + 1) % meal.variantes.length;
        afficherMenu();
    }

    function remplacerRepas(jIdx, type) {
        const pool = type === 'p' ? db.petitDej : (type === 'm' ? db.dejeuner : db.diner);
        planningGlobal[jIdx][type] = JSON.parse(JSON.stringify(pool[Math.floor(Math.random() * pool.length)]));
        planningGlobal[jIdx]['v' + type.toUpperCase()] = 0;
        afficherMenu();
    }

    function toggleDetails(id) {
        const el = document.getElementById(id);
        el.style.display = (el.style.display === 'block') ? 'none' : 'block';
    }

    function afficherMenu() {
        document.getElementById('loader').style.display = "none";
        document.getElementById('resultat').style.display = "block";
        let html = "";
        
        planningGlobal.forEach((jour, idx) => {
            let totalCal = jour.p.c + jour.m.c + jour.d.c;
            html += `
            <div class="day-box">
                <span class="cal-float">${totalCal} kcal</span>
                <h3>JOUR ${idx + 1}</h3>
                ${renderMeal(idx, 'p', '☀️ Petit-Déjeuner', jour.p, jour.vP)}
                ${renderMeal(idx, 'm', '🥗 Déjeuner', jour.m, jour.vM)}
                ${renderMeal(idx, 'd', '🌙 Dîner', jour.d, jour.vD)}
            </div>`;
        });
        document.getElementById('content-area').innerHTML = html;
    }

    function renderMeal(jIdx, type, label, meal, varIdx) {
        const id = `det-${jIdx}-${type}`;
        const variante = meal.variantes[varIdx];
        return `
        <div class="meal-section">
            <span style="font-size:1.1em;"><b>${label} :</b> ${meal.n}</span>
            <div class="no-print">
                <button class="btn-sm btn-replace" onclick="remplacerRepas(${jIdx}, '${type}')">🔄 Changer Plat</button>
                <button class="btn-sm btn-recipe" onclick="toggleDetails('${id}')">📖 Voir Recette Détaillée</button>
            </div>
            <div id="${id}" class="details-content">
                <span class="badge-ntr">Méthode de préparation</span><br><br>
                ${variante.r.map((s, i) => `<b>Étape ${i+1}:</b> ${s}`).join('<br><br>')}
                <br><br>
                <div style="background:rgba(52, 152, 219, 0.1); padding:10px; border-radius:8px; font-size: 0.9em;">
                    <b>📊 Macros :</b> ${variante.ntr} | <b>💡 Astuce :</b> ${variante.tip}
                </div>
            </div>
        </div>`;
    }

    function sauvegarderProfil() {
        const p = { age: document.getElementById('age').value, poids: document.getElementById('poids').value, taille: document.getElementById('taille').value, sexe: document.getElementById('sexe').value };
        localStorage.setItem('NutriGenius_26', JSON.stringify(p));
    }

    function chargerProfil() {
        const s = localStorage.getItem('NutriGenius_26');
        if (s) {
            const d = JSON.parse(s);
            document.getElementById('age').value = d.age || ""; document.getElementById('poids').value = d.poids || "";
            document.getElementById('taille').value = d.taille || ""; document.getElementById('sexe').value = d.sexe || "H";
        }
    }
</script>
</body>
</html>
