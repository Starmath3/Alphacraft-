<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NutriGenius AI 26.1.4.2</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f4f8; text-align: center; padding: 20px; }
        .container { background: white; padding: 25px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); display: inline-block; width: 100%; max-width: 550px; }
        h1 { color: #2c3e50; margin-bottom: 5px; }
        .subtitle { color: #009245; font-weight: bold; margin-bottom: 20px; font-size: 0.9em; text-transform: uppercase; }
        .input-group { margin-bottom: 15px; text-align: left; background: #f9f9f9; padding: 15px; border-radius: 12px; border: 1px solid #eee; }
        .section-title { font-size: 0.85em; color: #7f8c8d; font-weight: bold; text-transform: uppercase; margin-bottom: 10px; display: block; }
        .row { display: flex; gap: 10px; margin-bottom: 10px; }
        .input-field, .select-box { width: 100%; padding: 12px; border-radius: 10px; border: 2px solid #e0e0e0; font-size: 1em; box-sizing: border-box; }
        .btn { width: 100%; padding: 15px; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; color: white; background: #009245; font-size: 1.1em; margin-bottom: 10px; transition: 0.2s; }
        .btn:hover { background: #1b5e20; }
        .checkbox-group { display: flex; align-items: center; gap: 10px; font-weight: bold; color: #27ae60; cursor: pointer; margin: 10px 0; }
        #loader { display: none; margin: 20px 0; }
        .progress-bg { background: #eee; border-radius: 10px; height: 12px; overflow: hidden; margin: 10px 0; }
        #progress-bar { width: 0%; height: 100%; background: #27ae60; transition: width 0.1s linear; }
        #resultat { display: none; margin-top: 20px; text-align: left; }
        .shopping-list { background: #f0fff4; border: 2px dashed #009245; padding: 15px; border-radius: 12px; margin: 25px 0; }
        .shopping-item { display: inline-block; background: #fff; padding: 5px 12px; margin: 3px; border-radius: 20px; font-size: 0.8em; color: #1b5e20; border: 1px solid #c3e6cb; }
        .day-box { background: white; padding: 12px; margin-bottom: 10px; border-radius: 12px; border-left: 6px solid #009245; box-shadow: 0 4px 6px rgba(0,0,0,0.05); position: relative; }
        .cal-badge { float: right; background: #e8f5e9; color: #2e7d32; padding: 2px 8px; border-radius: 8px; font-size: 0.75em; font-weight: bold; }
        @media print { .input-group, .btn, h1, .subtitle { display: none; } }
    </style>
</head>
<body onload="chargerProfil()">

<div class="container">
    <h1>NutriGenius AI 🥗</h1>
    <div class="subtitle">Certifié Halal Réunion & Planning Intelligent</div>

    <div class="input-group">
        <span class="section-title">Profil Physique (Sauvegarde auto)</span>
        <div class="row">
            <input type="number" id="age" class="input-field" placeholder="Age" oninput="sauvegarderProfil()">
            <select id="sexe" class="input-field" onchange="sauvegarderProfil()">
                <option value="H">Homme</option>
                <option value="F">Femme</option>
            </select>
        </div>
        <div class="row">
            <input type="number" id="poids" class="input-field" placeholder="Poids (kg)" oninput="sauvegarderProfil()">
            <input type="number" id="taille" class="input-field" placeholder="Taille (cm)" oninput="sauvegarderProfil()">
        </div>
    </div>

    <div class="input-group">
        <span class="section-title">Paramètres du programme</span>
        <select id="select-duree" class="select-box">
            <option value="1">🥗 Menu du Jour</option>
            <option value="7">📅 Menu de la Semaine</option>
            <option value="30">📊 Menu du Mois</option>
            <option value="365">🗓️ Menu de l'Année</option>
        </select>
        <label class="checkbox-group">
            <input type="checkbox" id="check-veg"> 🥗 Mode Végétarien uniquement
        </label>
    </div>

    <button type="button" class="btn" onclick="lancer()">GÉNÉRER MON MENU</button>

    <div id="loader">
        <div style="font-size: 1.5em; font-weight: bold; color: #009245;"><span id="chiffre">0</span>%</div>
        <div class="progress-bg"><div id="progress-bar"></div></div>
    </div>

    <div id="resultat">
        <button class="btn" style="background:#34495e" onclick="window.print()">🖨️ IMPRIMER LE DOSSIER</button>
        <div id="content-area"></div>
    </div>
</div>

<script>
    function sauvegarderProfil() {
        const profil = {
            age: document.getElementById('age').value,
            poids: document.getElementById('poids').value,
            taille: document.getElementById('taille').value,
            sexe: document.getElementById('sexe').value
        };
        localStorage.setItem('NutriGenius_Save', JSON.stringify(profil));
    }

    function chargerProfil() {
        const save = localStorage.getItem('NutriGenius_Save');
        if (save) {
            const data = JSON.parse(save);
            document.getElementById('age').value = data.age || "";
            document.getElementById('poids').value = data.poids || "";
            document.getElementById('taille').value = data.taille || "";
            document.getElementById('sexe').value = data.sexe || "H";
        }
    }

    const db = {
        petitDej: [
            { n: "Porridge aux baies 🍓", v: true, c: 320, i: ["Flocons d'avoine", "Baies", "Lait d'amande"] },
            { n: "Avocat Toast & œuf poché 🥑", v: true, c: 380, i: ["Pain complet", "Avocat", "Oeuf"] },
            { n: "Skyr aux noix 🌰", v: true, c: 290, i: ["Skyr", "Noix", "Miel"] },
            { n: "Omelette fines herbes 🍳", v: true, c: 310, i: ["Oeufs certifiés", "Persil", "Beurre"] },
            { n: "Tartine Saumon fumé 🐟", v: false, c: 410, i: ["Pain", "Saumon fumé", "Fromage frais"] }
        ],
        dejeuner: [
            { n: "Saumon & Riz complet 🍣", v: false, c: 520, i: ["Saumon", "Riz complet", "Asperges"] },
            { n: "Carry Poulet Halal 🍗", v: false, c: 550, i: ["Poulet Réunion", "Tomates", "Oignons", "Curcuma"] },
            { n: "Salade de quinoa & feta 🥗", v: true, c: 450, i: ["Quinoa", "Feta", "Pois chiches"] },
            { n: "Rougail Morue 🌶️", v: false, c: 480, i: ["Morue", "Oignons", "Piment"] },
            { n: "Dahl lentilles coco 🍛", v: true, c: 510, i: ["Lentilles corail", "Lait coco", "Épices"] }
        ],
        diner: [
            { n: "Soupe de courge 🎃", v: true, c: 240, i: ["Courge", "Oignons", "Crème"] },
            { n: "Soupe de Brèdes 🍵", v: true, c: 260, i: ["Brèdes", "Gingembre", "Ail"] },
            { n: "Poisson Vapeur Citron 🍋", v: false, c: 310, i: ["Poisson frais", "Citron", "Courgettes"] },
            { n: "Gratin Chouchou 🥘", v: true, c: 380, i: ["Chouchou", "Fromage râpé", "Lait"] },
            { n: "Wok de dinde & brocoli 🥦", v: false, c: 420, i: ["Dinde", "Brocoli", "Noix de cajou"] }
        ]
    };

    function lancer() {
        if (!document.getElementById('age').value) {
            alert("⚠️ Merci de remplir votre profil.");
            return;
        }
        let n = 0;
        document.getElementById('resultat').style.display = "none";
        document.getElementById('loader').style.display = "block";
        let interval = setInterval(function() {
            n += 5;
            document.getElementById('chiffre').innerText = n;
            document.getElementById('progress-bar').style.width = n + "%";
            if (n >= 100) { clearInterval(interval); finaliser(); }
        }, 30);
    }

    function finaliser() {
        const jours = parseInt(document.getElementById('select-duree').value);
        const isVeg = document.getElementById('check-veg').checked;
        document.getElementById('loader').style.display = "none";
        document.getElementById('resultat').style.display = "block";

        const fP = isVeg ? db.petitDej.filter(x => x.v) : db.petitDej;
        const fM = isVeg ? db.dejeuner.filter(x => x.v) : db.dejeuner;
        const fD = isVeg ? db.diner.filter(x => x.v) : db.diner;

        let finalHtml = "";
        for (let i = 1; i <= jours; i++) {
            if (i === 1 || (i - 1) % 15 === 0) {
                let tempSet = new Set();
                let limite = Math.min(i + 14, jours);
                [...fP, ...fM, ...fD].forEach(item => item.i.forEach(ing => tempSet.add(ing)));
                finalHtml += `<div class="shopping-list"><b>🛒 LISTE DE COURSES : JOUR ${i} À ${limite}</b><br><small>Produits certifiés Halal Réunion</small><br>${Array.from(tempSet).map(ing => `<span class="shopping-item">${ing}</span>`).join('')}</div>`;
            }

            let p = fP[Math.floor(Math.random() * fP.length)];
            let m = fM[Math.floor(Math.random() * fM.length)];
            let d = fD[Math.floor(Math.random() * fD.length)];
            let totalJours = p.c + m.c + d.c;

            finalHtml += `<div class="day-box"><span class="cal-badge">${totalJours} kcal</span><b>JOUR ${i}</b><br><span style="display:block; margin-top:5px;">☀️ ${p.n} <small>(${p.c} kcal)</small></span><span style="display:block;">🥗 ${m.n} <small>(${m.c} kcal)</small></span><span style="display:block;">🌙 ${d.n} <small>(${d.c} kcal)</small></span></div>`;
        }
        document.getElementById('content-area').innerHTML = finalHtml;
    }
</script>
</body>
</html>
