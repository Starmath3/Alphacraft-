                ntr: "Protéines : 20g | Glucides : 22g | Lipides : 14g", 
                tip: "Cette variante est parfaite pour utiliser des restes cuits." // 62 car.
} ] } ];

// ÉTAPE 1 : Fonctions de calcul
function calculerRatioPortion() {
    const age = parseInt(document.getElementById('age').value) || 30;
    const poids = parseFloat(document.getElementById('poids').value) || 70;
    const taille = parseFloat(document.getElementById('taille').value) || 170;
    const sexe = document.getElementById('sexe').value;

    // Calcul simple du métabolisme de base (Mifflin-St Jeor)
    let bmr = (10 * poids) + (6.25 * taille) - (5 * age);
    bmr = (sexe === 'H') ? bmr + 5 : bmr - 161;
    
    // Retourne un ratio basé sur 2000 kcal de référence
    return bmr / 2000;
}

function genererMenu() {
    const ageInput = document.getElementById('age');
    const res = document.getElementById('resultat');
    const dureeInput = document.getElementById('duree-programme');
    const loader = document.getElementById('loader-overlay');

    if (!ageInput || !ageInput.value) { 
        alert("Veuillez entrer votre âge !"); 
        return; 
    }

    const age = parseInt(ageInput.value);
    const duree = dureeInput ? parseInt(dureeInput.value) : 1;
    const selectedModes = Array.from(document.querySelectorAll('.filter-mode:checked')).map(cb => cb.value);

    if (loader) loader.style.display = 'flex';

    setTimeout(() => {
        try {
            if (age >= 1 && age <= 2) {
                res.innerHTML = `<div class="error-msg">👶 À 1 ou 2 ans, l'alimentation est gérée par le pédiatre.</div>`;
                if (loader) loader.style.display = 'none';
                return;
            }

            let htmlGlobal = "";
            const moments = ['matin', 'midi', 'soir'];

            for (let jour = 1; jour <= duree; jour++) {
                let htmlJour = "";
                if (duree > 1) {
                    htmlJour += `<h2 style="width:100%; text-align:center; color:var(--primary); margin-top:40px; border-top: 2px solid #ccc; padding-top:20px;">JOUR ${jour}</h2>`;
                }

                if (age >= 3 && age <= 6) {
                    moments.forEach(m => {
                        if (typeof db_kids !== 'undefined') {
                            let options = db_kids.filter(r => r.cat === m && age >= r.ageMin);
                            if (options.length > 0) {
                                const choice = options[Math.floor(Math.random() * options.length)];
                                // On encode pour éviter les erreurs de guillemets
                                const optionsData = encodeURIComponent(JSON.stringify(options));
                                htmlJour += buildCardHTML(m, choice, true, age, optionsData);
                            }
                        }
                    });
                } else {
                    let possible = true;
                    moments.forEach(m => {
                        let options = [];
                        if (typeof db !== 'undefined') {
                            db.forEach(recette => {
                                if (recette.cat === m) {
                                    recette.variantes.forEach(v => {
                                        const match = selectedModes.every(mode => v.m.includes(mode));
                                        if (match) options.push({ nomRecette: recette.n, ...v });
                                    });
                                }
                            });
                        }

                        if (options.length > 0) {
                            const choice = options[Math.floor(Math.random() * options.length)];
                            const optionsData = encodeURIComponent(JSON.stringify(options));
                            htmlJour += buildCardHTML(m, choice, false, age, optionsData);
                        } else { possible = false; }
                    });

                    if (!possible && jour === 1) {
                        htmlGlobal = `<div class="error-msg">❌ Aucun repas trouvé pour vos filtres.</div>`;
                        break;
                    }
                }
                htmlGlobal += htmlJour;
            }

            res.innerHTML = htmlGlobal;

            const listContainer = document.getElementById('liste-courses-container');
            if (listContainer) {
                listContainer.style.display = 'block';
                setTimeout(() => { if (typeof calculerListeCourses === 'function') calculerListeCourses(); }, 50);
            }

        } catch (error) {
            console.error("Erreur génération:", error);
            res.innerHTML = `<div class="error-msg">⚠️ Erreur technique.</div>`;
        }

        if (loader) loader.style.display = 'none';
        sauvegarderProfil(); 
    }, 500);
}

function buildCardHTML(moment, choice, isKid, age, optionsData) {
    const border = isKid ? 'style="border-left: 8px solid #ffcb05;"' : '';
    const badgeColor = isKid ? '#ffcb05' : 'var(--primary)';
    const title = choice.nomRecette || choice.n;

    return `
        <div class="recipe-card" ${border} data-ing='${JSON.stringify(choice.ing || [])}'>
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
                <div style="background:${badgeColor}; color:white; padding:4px 10px; border-radius:4px; font-size:12px; font-weight:bold;">
                    ${moment.toUpperCase()}
                </div>
                <button class="change-btn" onclick="changerVar('${optionsData}', this)" 
                    style="width:auto; margin:0; padding:5px 10px; font-size:11px; background:var(--text); color:white; border:none; border-radius:5px; cursor:pointer;">
                    🔄 AUTRES VARIANTES
                </button>
            </div>
            
            <h3 class="card-title" style="color:var(--primary); margin:10px 0;">${title}</h3>
            ${choice.t ? `<p><strong>Variante :</strong> <span class="card-vt">${choice.t}</span></p>` : ''}

            <div style="background: rgba(0, 146, 69, 0.05); border-radius: 8px; padding: 10px; margin-bottom: 12px; border: 1px dashed var(--primary);">
                <strong style="font-size: 0.85em; color: var(--primary); display: block; margin-bottom: 5px;">🛒 INGRÉDIENTS :</strong>
                <div class="ing-text" style="font-size: 0.85em; color: #444; line-height: 1.4;">
                    ${choice.ing ? choice.ing.map(i => `• ${i.nom} : <b>${i.q}${i.u}</b>`).join('<br>') : 'Dosage selon portion'}
                </div>
            </div>
            
            <div class="card-steps" style="text-align:left; font-size:0.9em; color:#555; border-top:1px solid #eee; padding-top:10px;">
                ${choice.r.map(s => `<p style="margin:4px 0;">• ${s}</p>`).join('')}
            </div>
            
            <div style="display:flex; gap:10px; margin-top:15px;">
                ${choice.ntr ? `<div class="ntr-box" style="flex:1; background:#f9f9f9; padding:8px; border-radius:5px; font-weight:bold; font-size:0.8em; border-left:3px solid var(--accent);">📊 ${choice.ntr}</div>` : ''}
                ${choice.tip ? `<div class="tip-box" style="flex:1; background:#fff4e6; padding:8px; border-radius:5px; font-size:0.8em; border-left:3px solid var(--accent); font-style:italic;">💡 ${choice.tip}</div>` : ''}
            </div>
        </div>`;
}

function changerVar(optionsData, btn) {
    // On décode les données proprement
    const listeOptions = JSON.parse(decodeURIComponent(optionsData));
    if (!listeOptions || listeOptions.length === 0) return;
    
    const v = listeOptions[Math.floor(Math.random() * listeOptions.length)];
    const card = btn.closest('.recipe-card');

    card.setAttribute('data-ing', JSON.stringify(v.ing || []));
    if (card.querySelector('.card-title')) card.querySelector('.card-title').innerText = v.nomRecette || v.n;
    if (card.querySelector('.card-vt')) card.querySelector('.card-vt').innerText = v.t || "";

    const ingDisplay = card.querySelector('.ing-text');
    if (ingDisplay && v.ing) {
        ingDisplay.innerHTML = v.ing.map(i => `• ${i.nom} : <b>${i.q}${i.u}</b>`).join('<br>');
    }

    const stepsElem = card.querySelector('.card-steps');
    if (stepsElem) {
        stepsElem.innerHTML = v.r.map(s => `<p style="margin:4px 0;">• ${s}</p>`).join('');
    }

    calculerListeCourses();
}

function calculerListeCourses() {
    const total = {};
    const cards = document.querySelectorAll('.recipe-card');
    if (cards.length === 0) return;

    cards.forEach(card => {
        const data = card.getAttribute('data-ing');
        if (data) {
            try {
                const ingredients = JSON.parse(data);
                ingredients.forEach(item => {
                    const nom = item.nom.toLowerCase();
                    if (total[nom]) {
                        total[nom].q += item.q;
                    } else {
                        total[nom] = { n: item.nom, q: item.q, u: item.u };
                    }
                });
            } catch (e) { console.error(e); }
        }
    });

    const display = document.getElementById('liste-ingredients-display');
    if (display) {
        display.innerHTML = Object.values(total).map(i => `
            <div style="background: #f9f9f9; padding: 10px; border-radius: 10px; border-left: 4px solid var(--accent); font-size: 0.9em; box-shadow: 0 2px 5px rgba(0,0,0,0.05);">
                <strong style="text-transform: capitalize;">${i.n}</strong> : ${Math.round(i.q * 100) / 100}${i.u}
            </div>
        `).join('');
    }
}

function sauvegarderProfil() {
    const profil = {
        age: document.getElementById('age').value,
        poids: document.getElementById('poids').value,
        taille: document.getElementById('taille').value,
        sexe: document.getElementById('sexe').value
    };
    localStorage.setItem('NutriGenius_Save', JSON.stringify(profil));
    console.log("Profil sauvegardé.");
}

function calculerListeCourses() {
    const total = {};
    const cards = document.querySelectorAll('.recipe-card');
    if (cards.length === 0) return;

    cards.forEach(card => {
        const data = card.getAttribute('data-ing');
        if (data) {
            try {
                const ingredients = JSON.parse(data);
                ingredients.forEach(item => {
                    const nom = item.nom.toLowerCase();
                    if (total[nom]) {
                        total[nom].q += item.q;
                    } else {
                        total[nom] = { n: item.nom, q: item.q, u: item.u };
                    }
                });
            } catch (e) { console.error(e); }
        }
    });

    const display = document.getElementById('liste-ingredients-display');
    if (display) {
        display.innerHTML = Object.values(total).map(i => `
            <div style="background: #f9f9f9; padding: 10px; border-radius: 10px; border-left: 4px solid var(--accent); font-size: 0.9em; box-shadow: 0 2px 5px rgba(0,0,0,0.05);">
                <strong style="text-transform: capitalize;">${i.n}</strong> : ${Math.round(i.q * 100) / 100}${i.u}
            </div>
        `).join('');
    }

    const container = document.getElementById('liste-courses-container');
    if (container) {
        container.style.display = 'block';
    }
}

</script>
