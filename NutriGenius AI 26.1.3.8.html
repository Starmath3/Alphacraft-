<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NutriGenius AI 26.1.3.8 - Système Expert</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f4f8; text-align: center; padding: 20px; }
        .container { background: white; padding: 25px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); display: inline-block; width: 100%; max-width: 550px; }
        h1 { color: #2c3e50; margin-bottom: 20px; }
        .input-group { margin-bottom: 15px; text-align: left; background: #f9f9f9; padding: 15px; border-radius: 12px; }
        .section-title { font-size: 0.85em; color: #7f8c8d; font-weight: bold; text-transform: uppercase; margin-bottom: 10px; display: block; }
        .row { display: flex; gap: 10px; margin-bottom: 10px; }
        .input-field, .select-box { width: 100%; padding: 12px; border-radius: 10px; border: 2px solid #e0e0e0; font-size: 1em; box-sizing: border-box; }
        .input-field:focus { border-color: #27ae60; outline: none; }
        .checkbox-group { display: flex; align-items: center; gap: 10px; font-weight: bold; color: #27ae60; cursor: pointer; margin-top: 10px; }
        
        .btn { width: 100%; padding: 15px; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; color: white; font-size: 1.1em; background: #27ae60; transition: 0.2s; }
        .btn:hover { background: #219150; transform: translateY(-2px); }

        #loader { display: none; margin: 20px 0; }
        .progress-bg { background: #eee; border-radius: 10px; height: 12px; overflow: hidden; margin: 10px 0; }
        #progress-bar { width: 0%; height: 100%; background: #27ae60; transition: width 0.1s linear; }
        
        #resultat { display: none; margin-top: 20px; text-align: left; }
        .summary-card { background: #27ae60; color: white; padding: 15px; border-radius: 12px; margin-bottom: 15px; font-size: 0.95em; }
        .day-box { background: white; padding: 15px; margin-bottom: 12px; border-radius: 12px; border-left: 6px solid #27ae60; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .meal-type { font-weight: bold; color: #2c3e50; font-size: 0.9em; }
        .meal-name { color: #34495e; font-size: 1em; }
        .cal-tag { float: right; color: #7f8c8d; font-size: 0.85em; }
    </style>
</head>
<body>

<div class="container">
    <h1>NutriGenius AI 🥗</h1>

    <div class="input-group">
        <span class="section-title">Votre Profil Physique</span>
        <div class="row">
            <input type="number" id="age" class="input-field" placeholder="Âge (ex: 25)">
            <select id="sexe" class="input-field">
                <option value="H">Homme</option>
                <option value="F">Femme</option>
            </select>
        </div>
        <div class="row">
            <input type="number" id="poids" class="input-field" placeholder="Poids (kg)">
            <input type="number" id="taille" class="input-field" placeholder="Taille (cm)">
        </div>
    </div>

    <div class="input-group">
        <span class="section-title">Paramètres du Plan</span>
        <select id="select-duree" class="select-box">
            <option value="1">🥗 Menu du Jour</option>
            <option value="7">📅 Menu de la Semaine</option>
            <option value="30">📊 Menu du Mois</option>
        </select>
        <label class="checkbox-group">
            <input type="checkbox" id="check-veg"> 🥗 Régime Végétarien uniquement
        </label>
    </div>

    <button type="button" class="btn" onclick="lancer()">Générer mon programme personnalisé</button>

    <div id="loader">
        <div style="font-size: 1.5em; font-weight: bold; color: #27ae60;"><span id="chiffre">0</span>%</div>
        <div class="progress-bg"><div id="progress-bar"></div></div>
        <p id="status-msg">Analyse des besoins nutritionnels...</p>
    </div>

    <div id="resultat">
        <div id="summary" class="summary-card"></div>
        <div id="menu-content"></div>
    </div>
</div>

<script>
    const db = {
        petitDej: [
            { n: "Porridge aux baies", c: 350, v: true }, { n: "Muesli banane", c: 380, v: true },
            { n: "Avocat Toast & œuf", c: 450, v: true }, { n: "Skyr aux noix", c: 280, v: true },
            { n: "Omelette fines herbes", c: 320, v: true }, { n: "Pancakes banane", c: 410, v: true },
            { n: "Smoothie bowl açai", c: 350, v: true }, { n: "Tartine saumon fumé", c: 400, v: false },
            { n: "Shakshuka poivrons", c: 380, v: true }, { n: "Pouding de chia coco", c: 320, v: true }
        ],
        dejeuner: [
            { n: "Saumon & Riz complet", c: 620, v: false }, { n: "Salade Quinoa & Feta", c: 480, v: true },
            { n: "Poulet & Patates douces", c: 550, v: false }, { n: "Dahl lentilles coco", c: 510, v: true },
            { n: "Wok crevettes légumes", c: 450, v: false }, { n: "Steak de dinde & brocolis", c: 490, v: false },
            { n: "Falafels & sauce yaourt", c: 530, v: true }, { n: "Bowl thon edamames", c: 500, v: false },
            { n: "Lasagnes de légumes", c: 580, v: true }, { n: "Riz sauté au tofu", c: 520, v: true }
        ],
        diner: [
            { n: "Soupe de courge & châtaignes", c: 280, v: true }, { n: "Cabillaud & poireaux", c: 340, v: false },
            { n: "Salade de lentilles tièdes", c: 390, v: true }, { n: "Ratatouille & steak soja", c: 320, v: true },
            { n: "Omelette champignons", c: 310, v: true }, { n: "Papillote de dinde", c: 350, v: false },
            { n: "Velouté de tomates basilic", c: 250, v: true }, { n: "Brochettes crevettes riz", c: 400, v: false },
            { n: "Quiche sans pâte épinards", c: 370, v: true }, { n: "Chou-fleur rôti & tahini", c: 330, v: true }
        ]
    };

    function calculerCalories() {
        const p = parseFloat(document.getElementById('poids').value) || 70;
        const t = parseFloat(document.getElementById('taille').value) || 170;
        const a = parseInt(document.getElementById('age').value) || 30;
        const s = document.getElementById('sexe').value;
        let bmr = (10 * p) + (6.25 * t) - (5 * a);
        bmr = (s === 'H') ? bmr + 5 : bmr - 161;
        return Math.round(bmr * 1.35); // Facteur activité moyenne
    }

    function lancer() {
        let n = 0;
        document.getElementById('resultat').style.display = "none";
        document.getElementById('loader').style.display = "block";
        
        let timer = setInterval(() => {
            n += 5;
            document.getElementById('chiffre').innerText = n;
            document.getElementById('progress-bar').style.width = n + "%";
            if (n >= 100) {
                clearInterval(timer);
                finaliser();
            }
        }, 30);
    }

    function finaliser() {
        const jours = parseInt(document.getElementById('select-duree').value);
        const isVeg = document.getElementById('check-veg').checked;
        const cible = calculerCalories();
        
        document.getElementById('loader').style.display = "none";
        document.getElementById('resultat').style.display = "block";

        document.getElementById('summary').innerHTML = `
            <b>ANALYSE TERMINÉE</b><br>
            Besoins journaliers estimés : <b>${cible} kcal</b><br>
            Répartition suggérée : 25% Matin / 40% Midi / 35% Soir.
        `;

        const fP = isVeg ? db.petitDej.filter(x => x.v) : db.petitDej;
        const fM = isVeg ? db.dejeuner.filter(x => x.v) : db.dejeuner;
        const fD = isVeg ? db.diner.filter(x => x.v) : db.diner;

        let html = "";
        for(let i=1; i<=jours; i++) {
            let p = fP[Math.floor(Math.random() * fP.length)];
            let m = fM[Math.floor(Math.random() * fM.length)];
            let d = fD[Math.floor(Math.random() * fD.length)];

            html += `
            <div class="day-box">
                <span style="color:#27ae60; font-weight:bold">JOUR ${i}</span>
                <span class="cal-tag">Total : ${p.c + m.c + d.c} kcal</span>
                <hr style="border:0; border-top:1px solid #eee; margin:10px 0">
                <div class="meal-name"><span class="meal-type">Matin :</span> ${p.n} <small>(${p.c} cal)</small></div>
                <div class="meal-name"><span class="meal-type">Midi :</span> ${m.n} <small>(${m.c} cal)</small></div>
                <div class="meal-name"><span class="meal-type">Soir :</span> ${d.n} <small>(${d.c} cal)</small></div>
            </div>`;
        }
        document.getElementById('menu-content').innerHTML = html;
    }
</script>
</body>
</html>
