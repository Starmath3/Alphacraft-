<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NutriGenius AI 26.1.3.9 - Version Premium</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f4f8; text-align: center; padding: 20px; }
        .container { background: white; padding: 25px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); display: inline-block; width: 100%; max-width: 550px; }
        h1 { color: #2c3e50; margin-bottom: 20px; }
        .input-group { margin-bottom: 15px; text-align: left; background: #f9f9f9; padding: 15px; border-radius: 12px; border: 1px solid #eee; }
        .section-title { font-size: 0.85em; color: #7f8c8d; font-weight: bold; text-transform: uppercase; margin-bottom: 10px; display: block; }
        .row { display: flex; gap: 10px; margin-bottom: 10px; }
        .input-field, .select-box { width: 100%; padding: 12px; border-radius: 10px; border: 2px solid #e0e0e0; font-size: 1em; box-sizing: border-box; transition: 0.3s; }
        .input-field:focus { border-color: #27ae60; outline: none; background: #fff; }
        
        .error-border { border-color: #e74c3c !important; background: #fdf2f2 !important; }
        #error-msg { color: #e74c3c; font-size: 0.85em; display: none; margin-bottom: 10px; font-weight: bold; }

        .checkbox-group { display: flex; align-items: center; gap: 10px; font-weight: bold; color: #27ae60; cursor: pointer; margin-top: 10px; }
        .btn { width: 100%; padding: 15px; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; color: white; font-size: 1.1em; background: #27ae60; transition: 0.2s; box-shadow: 0 4px 0 #219150; }
        .btn:hover { background: #219150; transform: translateY(-2px); }
        .btn:active { transform: translateY(0); box-shadow: none; }

        #loader { display: none; margin: 20px 0; }
        .progress-bg { background: #eee; border-radius: 10px; height: 12px; overflow: hidden; margin: 10px 0; }
        #progress-bar { width: 0%; height: 100%; background: #27ae60; transition: width 0.1s linear; }
        
        #resultat { display: none; margin-top: 20px; text-align: left; }
        .summary-card { background: #27ae60; color: white; padding: 15px; border-radius: 12px; margin-bottom: 15px; box-shadow: 0 4px 10px rgba(39, 174, 96, 0.3); }
        .day-box { background: white; padding: 15px; margin-bottom: 12px; border-radius: 12px; border-left: 6px solid #27ae60; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .cal-tag { float: right; color: #7f8c8d; font-size: 0.85em; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h1>NutriGenius AI 🥗</h1>

    <div id="error-msg">⚠️ Veuillez corriger les champs en rouge (valeurs positives uniquement).</div>

    <div class="input-group">
        <span class="section-title">Votre Profil Physique</span>
        <div class="row">
            <input type="number" id="age" class="input-field" placeholder="Âge" min="1">
            <select id="sexe" class="input-field">
                <option value="H">Homme</option>
                <option value="F">Femme</option>
            </select>
        </div>
        <div class="row">
            <input type="number" id="poids" class="input-field" placeholder="Poids (kg)" min="1">
            <input type="number" id="taille" class="input-field" placeholder="Taille (cm)" min="1">
        </div>
        <span class="section-title">Niveau d'activité</span>
        <select id="activite" class="select-box">
            <option value="1.2">Sédentaire (Bureau, peu de sport)</option>
            <option value="1.375">Légèrement actif (Sport 1-3 fois/semaine)</option>
            <option value="1.55">Actif (Sport 3-5 fois/semaine)</option>
            <option value="1.725">Très actif (Sport quotidien intense)</option>
        </select>
    </div>

    <div class="input-group">
        <span class="section-title">Paramètres du Plan</span>
        <select id="select-duree" class="select-box">
            <option value="1">🥗 Menu du Jour</option>
            <option value="7">📅 Menu de la Semaine</option>
            <option value="30">📊 Menu du Mois</option>
            <option value="365">🗓️ Menu de l'année</option>
        </select>
        <label class="checkbox-group">
            <input type="checkbox" id="check-veg"> 🥗 Régime Végétarien
        </label>
    </div>

    <button type="button" class="btn" onclick="lancer()">Générer mon programme IA</button>

    <div id="loader">
        <div style="font-size: 1.5em; font-weight: bold; color: #27ae60;"><span id="chiffre">0</span>%</div>
        <div class="progress-bg"><div id="progress-bar"></div></div>
    </div>

    <div id="resultat">
        <div id="summary" class="summary-card"></div>
        <div id="menu-content" style="max-height: 500px; overflow-y: auto; padding-right: 5px;"></div>
    </div>
</div>

<script>
    // Base de données (version simplifiée pour l'exemple, tu peux remettre tes 150 plats ici)
    const db = {
        petitDej: [
            { n: "Porridge aux baies", c: 350, v: true }, { n: "Muesli banane", c: 380, v: true },
            { n: "Avocat Toast & œuf", c: 450, v: true }, { n: "Skyr aux noix", c: 280, v: true },
            { n: "Omelette fines herbes", c: 320, v: true }, { n: "Tartine saumon fumé", c: 400, v: false }
        ],
        dejeuner: [
            { n: "Saumon & Riz complet", c: 620, v: false }, { n: "Salade Quinoa & Feta", c: 480, v: true },
            { n: "Poulet & Patates douces", c: 550, v: false }, { n: "Dahl lentilles coco", c: 510, v: true },
            { n: "Lasagnes de légumes", c: 580, v: true }
        ],
        diner: [
            { n: "Soupe de courge & châtaignes", c: 280, v: true }, { n: "Cabillaud & poireaux", c: 340, v: false },
            { n: "Salade de lentilles tièdes", c: 390, v: true }, { n: "Omelette champignons", c: 310, v: true },
            { n: "Papillote de dinde", c: 350, v: false }
        ]
    };

    function calculerCalories() {
        let p = Math.abs(parseFloat(document.getElementById('poids').value));
        let t = Math.abs(parseFloat(document.getElementById('taille').value));
        let a = Math.abs(parseInt(document.getElementById('age').value));
        let act = parseFloat(document.getElementById('activite').value);
        const s = document.getElementById('sexe').value;

        // Formule de Mifflin-St Jeor
        let bmr = (10 * p) + (6.25 * t) - (5 * a);
        bmr = (s === 'H') ? bmr + 5 : bmr - 161;
        return Math.round(bmr * act);
    }

    function validerFormulaire() {
        const ids = ['poids', 'taille', 'age'];
        let valide = true;
        document.getElementById('error-msg').style.display = "none";

        ids.forEach(id => {
            const el = document.getElementById(id);
            if (!el.value || el.value <= 0) {
                el.classList.add('error-border');
                valide = false;
            } else {
                el.classList.remove('error-border');
            }
        });

        if (!valide) document.getElementById('error-msg').style.display = "block";
        return valide;
    }

    function lancer() {
        if (!validerFormulaire()) return;

        let n = 0;
        document.getElementById('resultat').style.display = "none";
        document.getElementById('loader').style.display = "block";
        
        let timer = setInterval(() => {
            n += (parseInt(document.getElementById('select-duree').value) > 30) ? 10 : 5; 
            if(n > 100) n = 100;
            document.getElementById('chiffre').innerText = n;
            document.getElementById('progress-bar').style.width = n + "%";
            if (n >= 100) {
                clearInterval(timer);
                finaliser();
            }
        }, 30);
    }

    function finaliser() {
        const jours = parseInt(document.getElementById('select-duree').value);
        const isVeg = document.getElementById('check-veg').checked;
        const cible = calculerCalories();
        
        document.getElementById('loader').style.display = "none";
        document.getElementById('resultat').style.display = "block";

        document.getElementById('summary').innerHTML = `
            <b>VOTRE BILAN NUTRITIONNEL AI</b><br>
            Cible quotidienne : <b>${cible} kcal</b><br>
            <small>Basé sur votre métabolisme et votre activité.</small>
        `;

        const fP = isVeg ? db.petitDej.filter(x => x.v) : db.petitDej;
        const fM = isVeg ? db.dejeuner.filter(x => x.v) : db.dejeuner;
        const fD = isVeg ? db.diner.filter(x => x.v) : db.diner;

        let html = "";
        for(let i=1; i<=jours; i++) {
            let p = fP[Math.floor(Math.random() * fP.length)];
            let m = fM[Math.floor(Math.random() * fM.length)];
            let d = fD[Math.floor(Math.random() * fD.length)];

            html += `
            <div class="day-box">
                <b>JOUR ${i}</b> <span class="cal-tag">${p.c + m.c + d.c} kcal</span><br>
                <hr style="border:0; border-top:1px solid #eee; margin:8px 0">
                <small>☀️ ${p.n}</small><br>
                <small>🥗 ${m.n}</small><br>
                <small>🌙 ${d.n}</small>
            </div>`;
        }
        document.getElementById('menu-content').innerHTML = html;
    }
</script>
</body>
</html>
